<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proportion Lab – The Perfect Mix | MyMasteryLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --teal:#00A7B2; --teal-d:#00928E; --teal-dd:#007F7B; --teal-l:#E1F7F8; --cyan:#21DED7;
  --orange:#FAA71C; --orange-l:#FFF1D6; --burnt:#D77F28; --burnt-l:#FBE7D6;
  --crimson:#C92426; --crimson-l:#FBE3E3; --ink:#16202A; --muted:#55636C; --line:#D3DEE1; --card:#FFFFFF;
  --head:'Fredoka', 'Nunito', system-ui, sans-serif; --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: light; } }
:root[data-theme="dark"]{ color-scheme: light; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px); scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.5;min-height:100%;
  background:#F4FCFC;
  background-image:
    radial-gradient(circle at 8% 12%, rgba(0,167,178,.30), transparent 34%),
    radial-gradient(circle at 92% 8%, rgba(250,167,28,.38), transparent 32%),
    radial-gradient(circle at 85% 70%, rgba(201,36,38,.14), transparent 34%),
    radial-gradient(circle at 12% 78%, rgba(33,222,215,.30), transparent 36%),
    radial-gradient(circle at 50% 45%, rgba(215,127,40,.12), transparent 40%),
    linear-gradient(160deg,#EFFBFB 0%,#FFF6E6 55%,#FDEEEA 100%);
  background-attachment:fixed; padding-bottom:110px}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-40px;border-radius:50%;border:2px solid rgba(0,167,178,.25);background:rgba(255,255,255,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion: reduce){.bubbles{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--teal);
  padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--orange);font-weight:700}
.ttl{font-family:var(--head);font-size:18px;color:var(--teal-dd);font-weight:600}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-l);border:2px solid var(--teal);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.o{background:var(--orange-l);border-color:var(--orange)}
.fslots{display:flex;gap:4px}
.fslot{width:28px;height:34px;border-radius:6px;border:2px dashed var(--burnt);display:grid;place-items:center;font-family:var(--head);font-weight:700;color:var(--burnt);font-size:14px;background:#fff;cursor:pointer}
.fslot.on{border-style:solid;background:linear-gradient(160deg,var(--orange),var(--burnt));color:#fff;transform:rotate(-4deg)}
.tbtn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tbtn:hover{background:var(--teal-l)}
.tbtn.dark{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
.bunting{height:18px;background:
  linear-gradient(135deg,var(--teal) 50%,transparent 50%) 0 0/36px 18px repeat-x;
  -webkit-mask: linear-gradient(#000,#000);opacity:.0}
.flags{display:flex;overflow:hidden;height:16px}
.flags i{flex:0 0 26px;height:16px;clip-path:polygon(0 0,100% 0,50% 100%)}

/* ---------- festival route ---------- */
.route{position:relative;z-index:2;max-width:1200px;margin:14px auto 0;padding:0 16px}
.lane{display:flex;gap:6px;align-items:flex-end;justify-content:space-between;background:#fff;border-radius:26px 26px 26px 26px;padding:12px 14px 10px;
  border:3px solid var(--ink);box-shadow:6px 6px 0 var(--teal);overflow-x:auto}
.stall{flex:1 0 82px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:14px;position:relative}
.stall:hover{background:var(--teal-l)}
.stall.cur{background:var(--orange-l)}
.stall .nm{font-size:12px;font-weight:800;line-height:1.15;text-align:center;color:var(--ink);max-width:96px}
.stall .tm{font-size:11px;color:var(--muted);font-weight:700}
.stall.locked{opacity:.55}
.stall .lk{position:absolute;top:2px;right:8px;font-size:15px}
.stall svg{width:46px;height:56px}

/* ---------- stage ---------- */
main{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:16px}
.hero{position:relative;border-radius:30px;padding:24px 28px 46px;color:#fff;overflow:hidden;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.hero h1{font-family:var(--head);font-size:clamp(28px,4vw,44px);line-height:1.05;margin:4px 0 6px;font-weight:700}
.hero p{margin:0;max-width:62ch;font-weight:700;font-size:17px;opacity:.97}
.hero .pn{font-family:var(--head);font-size:16px;font-weight:600;opacity:.95}
.hero .cast{position:absolute;right:20px;bottom:30px;display:flex;gap:4px}
.hero .cast svg{width:86px;height:86px;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.25))}
@media (min-width:821px){.hero{padding-right:330px}}
.hero .wave{position:absolute;left:0;right:0;bottom:-2px;height:40px}
.hero .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
@media (max-width:820px){.hero .cast{position:static;margin-top:10px}.hero .cast svg{width:64px;height:64px}}

/* story */
.story{margin:22px 0 8px;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;background:#fff;border-radius:26px;padding:16px 20px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--orange);position:relative}
.story .who{text-align:center}
.story .who svg{width:130px;height:130px}
.story .who b{display:block;font-family:var(--head);font-size:17px}
.story .who small{color:var(--muted);font-weight:700}
.bub{position:relative;background:var(--teal-l);border-radius:22px;padding:16px 20px;font-size:19px;font-weight:700;min-height:92px}
.bub::before{content:"";position:absolute;left:-14px;top:36px;border:10px solid transparent;border-right-color:var(--teal-l);border-left:0;width:0}
.story .nav{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal)}
@media (max-width:640px){.story{grid-template-columns:1fr}.bub::before{display:none}.story .who svg{width:96px;height:96px}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:22px;margin-top:22px}
.card{position:relative;background:var(--card);border-radius:24px;border:3px solid var(--ink);padding:18px 20px 20px;box-shadow:6px 6px 0 var(--c,var(--teal));scroll-margin-top:170px}
.card.wide{grid-column:1/-1}
.card header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card header .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--cl,var(--teal-l));flex:0 0 auto}
.card h3{font-family:var(--head);font-size:21px;margin:0;font-weight:600;line-height:1.15}
.card .opt{font-size:12px;font-weight:800;background:var(--orange-l);border:2px solid var(--orange);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.card .st{margin-left:auto;font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;background:var(--orange-l);color:var(--burnt);border:2px solid var(--orange);white-space:nowrap}
.card.done .st{background:var(--teal);border-color:var(--teal);color:#fff}
.card.done::after{content:"Done ✔";position:absolute;right:16px;bottom:12px;font-family:var(--head);font-weight:700;color:var(--teal);border:3px solid var(--teal);border-radius:10px;padding:0 8px;transform:rotate(-8deg);opacity:.85;font-size:15px;pointer-events:none}
.card.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 8px var(--orange)}}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.q{margin:10px 0;font-weight:700}
.q .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;margin-right:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
input.ans,textarea.ans{font:inherit;font-weight:800;font-size:18px;border:3px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink);text-align:center;min-width:0}
textarea.ans{width:100%;min-height:72px;text-align:left;font-size:16px;font-weight:700;resize:vertical}
input.ans.wide{text-align:left}
.ans.ok{border-color:var(--teal);background:var(--teal-l)}
.ans.bad{border-color:var(--crimson);background:var(--crimson-l)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:16px}
.choices button:hover{background:var(--orange-l)}
.choices button.sel{background:var(--ink);color:#fff}
.choices.ok button.sel{background:var(--teal);border-color:var(--teal)}
.choices.bad button.sel{background:var(--crimson);border-color:var(--crimson)}
.stars button{font-size:30px;padding:2px 8px;line-height:1;color:var(--line);border-color:var(--line)}
.stars button.lit{color:var(--orange);border-color:var(--orange);background:#fff}
.stars button.sel{background:var(--orange-l)!important;color:var(--burnt)!important}
.btn{border:3px solid var(--ink);background:var(--teal);color:#fff;border-radius:14px;padding:9px 18px;font-weight:900;font-size:16px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.o{background:var(--orange);color:var(--ink)}
.btn.r{background:var(--crimson)}
.btn.w{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{display:none;margin-top:10px;background:var(--orange-l);border-left:6px solid var(--orange);border-radius:10px;padding:8px 12px;font-weight:700}
.hint.show{display:block}
.note{background:var(--teal-l);border-radius:14px;padding:10px 14px;font-weight:700;margin-top:10px}
.reveal{display:none}.reveal.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.say{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.say svg{width:56px;height:56px;flex:0 0 auto}
.say .b{background:var(--crimson-l);border-radius:16px;padding:8px 12px;font-weight:800;position:relative}
.say.ruby .b{background:var(--teal-l)} .say.jack .b{background:var(--orange-l)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-weight:900;font-size:15px;border:2px solid var(--ink)}
.pill.m{background:var(--orange)} .pill.s{background:#BFF3F1} .pill.o{background:#FFD27A} .pill.k{background:#fff}
table.rt{border-collapse:separate;border-spacing:0;width:100%;margin-top:8px;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
table.rt th,table.rt td{padding:6px 8px;text-align:center;border-bottom:2px solid var(--line);border-right:2px solid var(--line)}
table.rt th{background:var(--teal-dd);color:#fff;font-family:var(--head);font-weight:600}
table.rt td:first-child{background:var(--teal-l);font-weight:900;text-align:left}
table.rt input.ans{width:64px;font-size:16px;padding:4px}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.scene{border:3px solid var(--ink);border-radius:18px;padding:10px;background:linear-gradient(180deg,#fff, var(--teal-l))}
.scene h4{margin:4px 0;font-family:var(--head);font-weight:600;font-size:18px}
.scene svg{width:100%;height:120px}
.scene input.ans{width:100%;text-align:left;font-size:15px}
.menuboard{background:var(--teal-dd);color:#fff;border-radius:18px;padding:14px;border:3px solid var(--ink)}
.menuboard .it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed rgba(255,255,255,.4)}
.menuboard .it:last-child{border:0}
.menuboard b{font-family:var(--head);font-size:19px;font-weight:600}
.menuboard .mini{display:flex;gap:2px;margin-top:4px}
.menuboard .mini i{width:16px;height:16px;border-radius:4px;border:1.5px solid #fff}
.bar{display:flex;gap:5px;min-height:62px;padding:8px;border:3px dashed var(--ink);border-radius:14px;background:#fff;flex-wrap:wrap;align-items:center}
.bx{width:52px;height:46px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:13px;animation:pop .25s}
.bx.m{background:var(--orange)} .bx.s{background:#BFF3F1} .bx.gap{border:0;width:12px;background:none}
.ticket{background:#fff;border:3px solid var(--ink);border-radius:16px;position:relative;padding:12px 14px;background-image:radial-gradient(circle at 0 50%, transparent 10px, #fff 11px)}
.ticket .tno{font-family:var(--head);font-weight:700;color:var(--burnt);font-size:15px}
.dnl{display:grid;grid-template-columns:110px repeat(6,1fr);align-items:center;gap:4px;margin-top:8px;font-weight:900;text-align:center}
.dnl .lb{text-align:left}
.dnl .ln{grid-column:2/-1;height:6px;border-radius:4px}
.dnl input.ans{width:100%;padding:3px;font-size:16px}
.dnl .c{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px}
.meter{position:relative;height:56px;margin:26px 6px 8px;border-radius:18px;border:3px solid var(--ink);background:linear-gradient(90deg,#E8FBFB,#BFF3F1 22%,#FFE2A8 45%,var(--orange) 70%,var(--burnt))}
.meter .tick{position:absolute;top:100%;transform:translateX(-50%);font-size:12px;font-weight:900;margin-top:2px}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);transition:left 1.2s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:13px}
.meter .mk i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-style:normal}
.meter .mk.b i{background:var(--crimson);color:#fff}
.jugs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jug{text-align:center;border:3px solid var(--ink);border-radius:16px;padding:8px;background:#fff}
.jug svg{width:70px;height:86px}
.jug b{display:block;font-family:var(--head);font-weight:600}
.strawrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:30px;min-height:46px}
.strawrow span{transition:all .6s}
.strawrow span.gone{opacity:0;transform:translateY(-30px) rotate(40deg) scale(.4)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .g{border:3px solid var(--ink);border-radius:16px;padding:8px;background:#fff}
.vs svg{width:70px;height:86px}
.disc{display:grid;grid-template-columns:1fr 1fr;gap:0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-top:8px}
.disc div{padding:12px}
.disc .a{background:var(--crimson-l)} .disc .m{background:var(--teal-l)}
.disc h4{margin:0 0 4px;font-family:var(--head);font-weight:600}
.race{border:3px solid var(--ink);border-radius:16px;padding:10px;background:#fff;margin:8px 0}
.lanex{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin:6px 0;font-weight:800;font-size:14px}
.track{height:30px;background:repeating-linear-gradient(90deg,#F1F5F6 0 18px,#fff 18px 36px);border:2px solid var(--ink);border-radius:999px;position:relative;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;transition:width .5s}
.track .run{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;transition:left .5s}
.bigcard{font-family:var(--head);font-weight:700;font-size:54px;text-align:center;padding:12px;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(160deg,#fff,var(--orange-l));margin:8px 0}
.timer{font-family:var(--head);font-size:26px;font-weight:700}
.shakebox{display:grid;place-items:center;text-align:center;border:3px solid var(--ink);border-radius:20px;padding:14px;background:linear-gradient(160deg,#fff,var(--teal-l));min-height:150px}
.shakebox .cmd{font-family:var(--head);font-size:32px;font-weight:700}
.shakebox .moves{font-size:30px;letter-spacing:4px;margin:6px 0}
.growth{width:100%;border-collapse:collapse;margin-top:8px}
.growth td,.growth th{border:2px solid var(--ink);padding:8px;text-align:center;font-weight:800}
.growth th{background:var(--teal-dd);color:#fff;font-family:var(--head);font-weight:600}
.grandbtn{font-size:22px;padding:14px 28px;background:linear-gradient(120deg,var(--orange),var(--crimson));color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.discover{background:linear-gradient(120deg,var(--teal),var(--teal-dd));color:#fff}
.discover h3{color:#fff}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:3px solid var(--ink);box-shadow:0 -6px 0 rgba(0,167,178,.25);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-weight:900}
.pbar{width:110px;height:14px;border-radius:999px;border:2px solid var(--ink);overflow:hidden;background:#fff}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));width:0;transition:width .5s}
.todo{flex:1;display:flex;gap:6px;overflow-x:auto;padding:2px;align-items:center}
.todo .lbl{font-weight:900;font-size:13px;white-space:nowrap;color:var(--burnt)}
.tchip{white-space:nowrap;border:2px solid var(--orange);background:var(--orange-l);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.tchip.ok{border-color:var(--teal);background:var(--teal-l);color:var(--teal-dd)}
.tchip.op{border-style:dashed}
.next{flex:0 0 auto}
.next.ready{animation:pulse 1.2s infinite;background:var(--orange);color:var(--ink)}

/* drawers & modals */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:#fff;z-index:60;border-left:4px solid var(--ink);transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer .dh{background:var(--teal-dd);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px}
.drawer .dh h2{margin:0;font-family:var(--head);font-weight:600;font-size:21px;flex:1}
.drawer .db{overflow:auto;padding:14px 16px 40px;flex:1}
.drawer h4{font-family:var(--head);font-weight:600;margin:16px 0 6px;color:var(--teal-dd);font-size:17px}
.drawer .ctl{display:flex;flex-wrap:wrap;gap:6px}
.drawer .ctl button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:5px 10px;font-weight:800;font-size:13px}
.drawer .ctl button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.drawer .ans-list{background:var(--orange-l);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.drawer .ans-list div{margin:3px 0}
.trow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.trow .s{width:22px;text-align:center}
.trow button{margin-left:auto;border:2px solid var(--ink);background:#fff;border-radius:8px;font-size:12px;font-weight:800;padding:2px 8px}
.mtime{font-family:var(--head);font-size:30px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(22,32,42,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:#fff;border:4px solid var(--ink);border-radius:28px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:10px 10px 0 var(--orange);position:relative}
.mbox h2{font-family:var(--head);font-weight:700;margin:0 0 8px;font-size:28px;color:var(--teal-dd)}
.x{position:absolute;top:12px;right:14px;border:2px solid var(--ink);background:#fff;border-radius:50%;width:36px;height:36px;font-weight:900}
.fcard{border:4px solid var(--ink);border-radius:22px;padding:22px;text-align:center;background:linear-gradient(150deg,var(--orange),var(--burnt));color:#fff;animation:flip .8s}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg)}}
.fcard .no{font-family:var(--head);font-weight:700;font-size:18px;opacity:.95}
.fcard .tx{font-family:var(--head);font-weight:600;font-size:26px;line-height:1.2;margin-top:6px}
.rule{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;margin:8px 0;background:#fff}
.rule b{flex:0 0 auto;width:34px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--orange);font-family:var(--head)}
.rule.off{opacity:.4}
.toast{position:fixed;top:90px;left:50%;transform:translate(-50%,-30px);z-index:90;background:var(--ink);color:#fff;border-radius:16px;padding:12px 20px;font-weight:800;opacity:0;transition:all .35s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.trk-ph{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;margin:8px 0}
.trk-ph h4{margin:0 0 4px;font-family:var(--head);font-weight:600;display:flex;gap:8px;align-items:center}
.trk-ph .tk{display:flex;gap:6px;flex-wrap:wrap}

/* splash */
.splash{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 15% 20%, rgba(0,167,178,.45), transparent 40%),radial-gradient(circle at 85% 15%, rgba(250,167,28,.55), transparent 40%),radial-gradient(circle at 70% 90%, rgba(201,36,38,.25), transparent 40%),linear-gradient(160deg,#E9FAFA,#FFF4DF)}
.splash .sbox{background:#fff;border:4px solid var(--ink);border-radius:32px;padding:26px 28px;max-width:760px;width:100%;box-shadow:12px 12px 0 var(--teal);text-align:center}
.splash h1{font-family:var(--head);font-size:clamp(36px,6vw,62px);margin:4px 0 0;line-height:1;color:var(--teal-dd);font-weight:700}
.splash h2{font-family:var(--head);font-size:clamp(22px,3vw,30px);margin:4px 0 12px;color:var(--burnt);font-weight:600}
.splash .castrow{display:flex;justify-content:center;gap:8px;margin:10px 0}
.splash .castrow div{text-align:center;font-weight:800;font-size:13px}
.splash .castrow svg{width:96px;height:96px}
.splash label{display:block;text-align:left;font-weight:800;margin:8px 0 4px}
.splash input{width:100%;font:inherit;font-size:18px;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.splash .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.splash .two{grid-template-columns:1fr}}

/* whiteboard */
#wbCanvas{position:fixed;inset:0;z-index:40;pointer-events:none;touch-action:none}
#wbCanvas.live{pointer-events:auto;cursor:crosshair}
#board{position:fixed;inset:0;z-index:55;display:none;background:#fff;background-image:linear-gradient(rgba(0,167,178,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,167,178,.12) 1px,transparent 1px);background-size:32px 32px}
#board.open{display:block}
#boardCanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.wbbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:66;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--teal);padding:8px 10px;display:none;gap:6px;align-items:center;flex-wrap:wrap;max-width:96vw;justify-content:center}
.wbbar.open{display:flex}
.wbbar button{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:38px;height:38px;font-weight:900;font-size:15px;padding:0 8px}
.wbbar button.on{border-color:var(--ink);background:var(--orange-l)}
.wbbar .sw{width:28px;height:28px;min-width:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.wbbar .sw.on{box-shadow:0 0 0 3px var(--ink)}
.wbbar .sep{width:2px;height:28px;background:var(--line)}
.wbbar .lab{font-weight:900;font-size:12px;color:var(--muted)}
.wbtext{position:fixed;z-index:67;font:800 22px var(--body);border:2px dashed var(--ink);background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px}
#fx{position:fixed;inset:0;z-index:96;pointer-events:none}

/* finale */
.finale{position:fixed;inset:0;z-index:92;display:none;overflow:auto;padding:24px 16px;
  background:radial-gradient(circle at 20% 15%, rgba(250,167,28,.55), transparent 40%),radial-gradient(circle at 80% 10%, rgba(0,167,178,.5), transparent 40%),radial-gradient(circle at 50% 100%, rgba(201,36,38,.30), transparent 45%),linear-gradient(170deg,#F0FCFC,#FFF3DA)}
.finale.open{display:block}
.fin{max-width:1000px;margin:0 auto;text-align:center}
.fin h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,6vw,64px);margin:6px 0;color:var(--teal-dd);line-height:1.02}
.fin .sub{font-weight:800;font-size:19px}
.cert{margin:20px auto;max-width:760px;background:#fff;border:5px solid var(--ink);border-radius:28px;padding:22px;box-shadow:10px 10px 0 var(--orange);position:relative}
.cert::before{content:"";position:absolute;inset:10px;border:3px dashed var(--teal);border-radius:20px;pointer-events:none}
.cert .nm{font-family:var(--head);font-size:clamp(30px,5vw,48px);font-weight:700;color:var(--burnt);margin:4px 0}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.award{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 10px;box-shadow:5px 5px 0 var(--teal);animation:pop .6s backwards}
.award .em{font-size:44px}
.award b{display:block;font-family:var(--head);font-weight:600;font-size:18px}
.award small{font-weight:700;color:var(--muted)}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin:16px 0}
@media (max-width:700px){.msgs{grid-template-columns:1fr}}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:900}
.stats b{display:block;font-family:var(--head);font-size:28px;color:var(--teal-dd)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>

<!-- splash -->
<div class="splash" id="splash">
  <div class="sbox">
    <div class="brand" style="font-size:22px">MyMastery<b>Lab</b></div>
    <h1>Proportion Lab</h1>
    <h2>The Perfect Mix</h2>
    <div class="castrow" id="castrow"></div>
    <p style="font-weight:800;margin:6px 0 10px">The Summer Sky Festival opens tomorrow. Blendo 3000 has been mixing… and the taste-testers are pulling faces.</p>
    <div class="two">
      <div><label for="inLearner">Chief Flavour Scientist's name</label><input id="inLearner" placeholder="e.g. Emma" maxlength="24"></div>
      <div><label for="inMentor">Mentor's name</label><input id="inMentor" placeholder="e.g. Mr. Carter" maxlength="24"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn o" id="btnStart" style="font-size:20px">Start the festival 🧃</button>
      <button class="btn w" id="btnContinue" style="display:none">Continue saved session</button>
    </div>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <div class="brand">MyMastery<b>Lab</b></div>
    <div class="ttl">Proportion Lab – The Perfect Mix</div>
    <div class="spacer"></div>
    <span class="chip" id="chipName">🧪 Scientist</span>
    <span class="chip o" id="chipStars">⭐ 0</span>
    <div class="fslots" id="fslots" title="Formula Cards"></div>
    <button class="tbtn" id="tWb" title="Whiteboard over lesson (W)">✏️ Draw</button>
    <button class="tbtn" id="tBoard" title="Blank board (B)">⬜ Board</button>
    <button class="tbtn" id="tTrack" title="Activity tracker (T)">📋 Tracker</button>
    <button class="tbtn" id="tSound" title="Sound on/off">🔊</button>
    <button class="tbtn dark" id="tMentor" title="Mentor panel (M)">🎓 Mentor</button>
  </div>
  <div class="flags" id="flags"></div>
</header>

<nav class="route" aria-label="Festival route"><div class="lane" id="lane"></div></nav>

<main id="stage"></main>

<div class="dock">
  <div class="dock-in">
    <div class="prog"><span id="progTxt">0/0</span><div class="pbar"><i id="progBar"></i></div></div>
    <div class="todo" id="todo"></div>
    <button class="btn next" id="btnNext">Next stall ▶</button>
  </div>
</div>

<!-- whiteboard -->
<canvas id="wbCanvas"></canvas>
<div id="board"><canvas id="boardCanvas"></canvas></div>
<div class="wbbar" id="wbbar"></div>

<!-- mentor drawer -->
<aside class="drawer" id="mentor" aria-label="Mentor panel">
  <div class="dh"><h2>🎓 Mentor control room</h2><button class="tbtn" id="mClose">✕</button></div>
  <div class="db" id="mBody"></div>
</aside>

<div class="modal" id="modal"><div class="mbox"><button class="x" id="mx">✕</button><div id="mcontent"></div></div></div>
<div class="toast" id="toast"></div>
<div class="finale" id="finale"></div>
<canvas id="fx"></canvas>

<script>
/* =========================================================
   Proportion Lab – The Perfect Mix  |  MyMasteryLab
   Teacher-controlled storyline (Lesson plan phases 1–9)
   ========================================================= */
const KEY = 'mml-proportion-lab-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------------- state ---------------- */
const fresh = () => ({
  learner: '', mentor: '', lab: '', drink: '', phase: 0, unlocked: 0,
  done: {}, inputs: {}, complete: {}, cards: [], stars: 0, correct: 0, miss: 0,
  first: {}, diag: {}, autoUnlock: true, sound: true, path: 'Core', storyPos: {},
  bar: [], lightning: null, shake: 0, strawRun: false, method: '', started: Date.now(), phaseStart: Date.now(), finaleSeen: false
});
let S = fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }

/* ---------------- characters (SVG) ---------------- */
const CH = {
  ruby: (s = '') => `<svg viewBox="0 0 120 120" ${s} aria-label="Ruby Hayes"><circle cx="60" cy="60" r="58" fill="#E1F7F8" stroke="#16202A" stroke-width="3"/>
    <circle cx="60" cy="24" r="13" fill="#D77F28" stroke="#16202A" stroke-width="2.5"/>
    <path d="M22 116c4-26 18-36 38-36s34 10 38 36z" fill="#00A7B2" stroke="#16202A" stroke-width="3"/>
    <path d="M44 84h32v32H44z" fill="#fff" stroke="#16202A" stroke-width="2.5"/><circle cx="60" cy="98" r="6" fill="#FAA71C" stroke="#16202A" stroke-width="2"/>
    <path d="M32 58c0-20 12-30 28-30s28 10 28 30c0 6-2 14-6 18H38c-4-4-6-12-6-18z" fill="#D77F28" stroke="#16202A" stroke-width="3"/>
    <ellipse cx="60" cy="60" rx="21" ry="23" fill="#F7D7BF" stroke="#16202A" stroke-width="3"/>
    <path d="M39 50c8-10 26-12 42 0-6-12-36-14-42 0z" fill="#D77F28"/>
    <circle cx="52" cy="58" r="3" fill="#16202A"/><circle cx="68" cy="58" r="3" fill="#16202A"/>
    <circle cx="47" cy="66" r="4" fill="#FAA71C" opacity=".5"/><circle cx="73" cy="66" r="4" fill="#FAA71C" opacity=".5"/>
    <path d="M52 69c4 5 12 5 16 0" fill="none" stroke="#16202A" stroke-width="3" stroke-linecap="round"/></svg>`,
  blendo: (s = '') => `<svg viewBox="0 0 120 120" ${s} aria-label="Blendo 3000"><circle cx="60" cy="60" r="58" fill="#FBE3E3" stroke="#16202A" stroke-width="3"/>
    <path d="M36 18h48l-6 52H42z" fill="#E1F7F8" stroke="#16202A" stroke-width="3"/>
    <path d="M39 40h42l-3.5 30h-35z" fill="#FAA71C"/><circle cx="52" cy="50" r="3" fill="#fff"/><circle cx="66" cy="58" r="2.5" fill="#fff"/><circle cx="58" cy="44" r="2" fill="#fff"/>
    <rect x="32" y="11" width="56" height="10" rx="4" fill="#C92426" stroke="#16202A" stroke-width="3"/>
    <rect x="30" y="70" width="60" height="38" rx="10" fill="#00928E" stroke="#16202A" stroke-width="3"/>
    <rect x="38" y="76" width="44" height="20" rx="6" fill="#16202A"/>
    <path d="M45 88l5-5 5 5M65 88l5-5 5 5" fill="none" stroke="#21DED7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="102" r="3" fill="#FAA71C"/><circle cx="54" cy="102" r="3" fill="#21DED7"/>
    <path d="M30 84h-12l-4-10M90 84h12l4-10" fill="none" stroke="#16202A" stroke-width="4" stroke-linecap="round"/></svg>`,
  jack: (s = '') => `<svg viewBox="0 0 120 120" ${s} aria-label="Jack Monroe"><circle cx="60" cy="60" r="58" fill="#FFF1D6" stroke="#16202A" stroke-width="3"/>
    <path d="M22 116c4-26 18-36 38-36s34 10 38 36z" fill="#00A7B2" stroke="#16202A" stroke-width="3"/>
    <path d="M52 82l8 16 8-16" fill="none" stroke="#C92426" stroke-width="4"/><rect x="54" y="96" width="12" height="14" rx="2" fill="#fff" stroke="#16202A" stroke-width="2"/>
    <ellipse cx="60" cy="60" rx="21" ry="23" fill="#EFC6A6" stroke="#16202A" stroke-width="3"/>
    <path d="M37 50c2-18 44-18 46 0z" fill="#FAA71C" stroke="#16202A" stroke-width="3"/><path d="M80 48h16" stroke="#16202A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="52" cy="60" r="3" fill="#16202A"/><circle cx="68" cy="60" r="3" fill="#16202A"/>
    <path d="M50 70c5 6 15 6 20 0" fill="none" stroke="#16202A" stroke-width="3" stroke-linecap="round"/>
    <rect x="80" y="84" width="22" height="28" rx="3" fill="#fff" stroke="#16202A" stroke-width="2.5" transform="rotate(10 91 98)"/>
    <path d="M85 92h12M85 98h12M85 104h8" stroke="#00A7B2" stroke-width="2" transform="rotate(10 91 98)"/></svg>`,
  sci: (s = '') => `<svg viewBox="0 0 120 120" ${s} aria-label="Chief Flavour Scientist"><circle cx="60" cy="60" r="58" fill="#E1F7F8" stroke="#16202A" stroke-width="3"/>
    <path d="M22 116c4-26 18-36 38-36s34 10 38 36z" fill="#fff" stroke="#16202A" stroke-width="3"/>
    <path d="M60 82l-12 34M60 82l12 34" stroke="#00A7B2" stroke-width="4"/><rect x="72" y="96" width="10" height="14" rx="2" fill="#FAA71C" stroke="#16202A" stroke-width="2"/>
    <ellipse cx="60" cy="60" rx="21" ry="23" fill="#F3CDB2" stroke="#16202A" stroke-width="3"/>
    <path d="M38 54c0-18 10-26 22-26s22 8 22 26c-6-8-14-12-22-12s-16 4-22 12z" fill="#6B3E1E" stroke="#16202A" stroke-width="3"/>
    <rect x="40" y="38" width="17" height="11" rx="5" fill="#BFF3F1" stroke="#16202A" stroke-width="2.5"/><rect x="63" y="38" width="17" height="11" rx="5" fill="#BFF3F1" stroke="#16202A" stroke-width="2.5"/>
    <path d="M57 43h6" stroke="#16202A" stroke-width="2.5"/>
    <circle cx="52" cy="62" r="3" fill="#16202A"/><circle cx="68" cy="62" r="3" fill="#16202A"/>
    <path d="M51 71c5 6 13 6 18 0" fill="none" stroke="#16202A" stroke-width="3" stroke-linecap="round"/></svg>`
};
const NAMES = { ruby: ['Ruby Hayes', 'Owner, The Perfect Mix'], blendo: ['Blendo 3000', 'Over-eager robot blender'], jack: ['Jack Monroe', 'Festival organiser'], sci: ['You', 'Chief Flavour Scientist'] };

/* ---------------- tiny UI builders ---------------- */
const nm = () => S.learner || 'Scientist';
function inp(id, g, a, w = 76, ph = '?') { return `<input class="ans" data-id="${id}" data-g="${g}" data-a="${a}" ${w ? `style="width:${w}px"` : ''} placeholder="${ph}" autocomplete="off" inputmode="${/^(text|any|rec:text)/.test(a) ? 'text' : 'decimal'}" aria-label="answer">`; }
function txt(id, g, a, ph) { return `<textarea class="ans" data-id="${id}" data-g="${g}" data-a="${a}" placeholder="${ph}"></textarea>`; }
function chs(id, g, a, opts, cls = '') { return `<div class="choices ${cls}" data-id="${id}" data-g="${g}" data-a="${a}">${opts.map(o => `<button type="button" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`; }
function stars(id, g) { return chs(id, g, 'any', [1, 2, 3, 4, 5].map(n => [String(n), '★']), 'stars'); }
function chk(g, label = 'Check my answer ✓', hint = '') { return `<div class="row" style="margin-top:12px"><button class="btn" data-check="${g}">${label}</button></div>${hint ? `<div class="hint" id="hint-${g}">💡 ${hint}</div>` : ''}`; }
function say(who, text) { return `<div class="say ${who}">${CH[who]()}<div class="b"><small style="display:block;color:var(--muted)">${NAMES[who][0]}</small>${text}</div></div>`; }
const pm = (n) => `<span class="pill m">${n} mango</span>`, ps = (n, w = 'sparkling') => `<span class="pill s">${n} ${w}</span>`;
function card(key, icon, body, o = {}) {
  const t = TASKS[key];
  return `<section class="card ${o.wide ? 'wide' : ''}" id="card-${key}" data-task="${key}" style="--c:${o.c || 'var(--teal)'};--cl:${o.cl || 'var(--teal-l)'}">
    <header><span class="ic">${icon}</span><h3>${t ? t.label : key}${t && t.opt ? '<span class="opt">Bonus</span>' : ''}</h3><span class="st">${t && t.opt ? 'Optional' : 'To do'}</span></header>${body}</section>`;
}
function infoCard(id, icon, title, body, o = {}) {
  return `<section class="card ${o.wide ? 'wide' : ''} ${o.cls || ''}" id="${id}" style="--c:${o.c || 'var(--orange)'};--cl:${o.cl || 'var(--orange-l)'}"><header><span class="ic">${icon}</span><h3>${title}</h3></header>${body}</section>`;
}
function jugSVG(m, t, label) {
  const h = 60 * (m / t);
  return `<svg viewBox="0 0 70 86"><path d="M12 10h46l-4 70H16z" fill="#E8FBFB" stroke="#16202A" stroke-width="3"/>
  <clipPath id="cj${label}"><path d="M12 10h46l-4 70H16z"/></clipPath>
  <rect x="0" y="${80 - 66}" width="70" height="66" fill="#BFF3F1" clip-path="url(#cj${label})"/>
  <rect x="0" y="${80 - h}" width="70" height="${h}" fill="#FAA71C" clip-path="url(#cj${label})"/>
  <path d="M58 22c10 0 10 26 0 26" fill="none" stroke="#16202A" stroke-width="3"/></svg>`;
}

/* ---------------- PHASES ---------------- */
const PHASES = [
 { id: 'p1', name: 'Welcome to the Festival', short: 'Festival', icon: '🎪', time: '0–5 min', mins: 5, color: '#00A7B2', color2: '#21DED7',
   goal: 'Spot real-life mix-ups, meet the crew and set up your lab.',
   cast: ['ruby', 'blendo', 'jack'],
   story: [
     ['jack', 'Welcome to the Summer Sky Festival! The gates open tomorrow and 500 thirsty visitors are on their way. 🎉'],
     ['ruby', 'I\'m Ruby Hayes, and this is my juice truck, The Perfect Mix. Our star drink is Sunset Squeeze: 2 cups of mango juice to 3 cups of sparkling water.'],
     ['blendo', 'BEEP BOOP! I am BLENDO 3000, the fastest blender in town. My one rule: NEED MORE? ADD MORE!'],
     ['ruby', 'Last night Blendo made the festival batch… and the taste-testers pulled faces. 😬'],
     ['ruby', 'I need a Chief Flavour Scientist to find the secret of a perfect mix. {name}, that\'s you!']
   ],
   tasks: [['p1_story', 'Read the festival story'], ['p1_mix', 'Mix-Up Moments'], ['p1_lab', 'Open your lab'], ['p1_predict', 'Lock your prediction']],
   notes: ['Keep it light and fast: this is a trailer, not a lecture.', 'Mix-Up Moments: accept every guess. Say: "Hold that thought — all three broke the SAME secret rule."', 'Any prediction is fine. A "Genius" vote makes a bigger turnaround later.'],
   answers: ['Mix-ups: each part grew by the same amount instead of the same number of times.', 'Prediction: any answer (revisited in Phase 9).'],
   body: () => `
   ${card('p1_mix', '🤔', `<p class="q">Three things went wrong at the festival this week. What do you think happened in each one? Any guess counts.</p>
    <div class="scenes">
     <div class="scene"><h4>The stretched selfie</h4>
      <svg viewBox="0 0 340 160"><rect x="16" y="38" width="120" height="90" rx="6" fill="#fff" stroke="#16202A" stroke-width="3"/><circle cx="76" cy="83" r="30" fill="#F7D7BF" stroke="#16202A" stroke-width="3"/><circle cx="66" cy="78" r="3"/><circle cx="86" cy="78" r="3"/><path d="M64 92c6 6 18 6 24 0" stroke="#16202A" stroke-width="3" fill="none"/>
      <text x="76" y="150" text-anchor="middle" font-weight="900" font-size="16">4 cm × 3 cm</text>

function hit(s, x, y) {
  const r = 14;
  if (s.p) return s.p.some(q => Math.hypot(q[0] - x, q[1] - y) < r + s.size);
  if (s.t === 'line' || s.t === 'arrow') { const dx = s.x2 - s.x1, dy = s.y2 - s.y1, l = dx * dx + dy * dy || 1; let t = ((x - s.x1) * dx + (y - s.y1) * dy) / l; t = Math.max(0, Math.min(1, t)); return Math.hypot(s.x1 + t * dx - x, s.y1 + t * dy - y) < r; }
  if (s.t === 'rect' || s.t === 'ell') return x > Math.min(s.x1, s.x2) - r && x < Math.max(s.x1, s.x2) + r && y > Math.min(s.y1, s.y2) - r && y < Math.max(s.y1, s.y2) + r;
  if (s.t === 'text') return x > s.x - 4 && x < s.x + s.text.length * (8 + s.size * 2) && y > s.y - 30 && y < s.y + 8;
  if (s.t === 'stamp') return x > s.x - 10 && x < s.x + (s.w || 200) && y > s.y - 20 && y < s.y + (s.h || 80);
  return false;
}
function pos(e) { return WB.mode === 'board' ? [e.clientX, e.clientY] : [e.clientX + scrollX, e.clientY + scrollY]; }
function wbDown(e) {
  if (WB.pass && WB.mode === 'overlay') return;
  e.preventDefault(); const [x, y] = pos(e); const t = WB.tool;
  if (t === 'text') { textAt(e.clientX, e.clientY, x, y); return; }
  if (t.startsWith('st:')) { strokes().push({ t: 'stamp', name: t.slice(3), x, y, color: WB.color }); redrawWB(); SND.click(); return; }
  if (t === 'eraser') { WB.cur = { t: 'eraser' }; erase(x, y); return; }
  WB.cur = (t === 'pen' || t === 'hl') ? { t, p: [[x, y]], color: WB.color, size: WB.size } : { t, x1: x, y1: y, x2: x, y2: y, color: WB.color, size: WB.size };
  e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
}
function wbMove(e) { if (!WB.cur) return; const [x, y] = pos(e); if (WB.cur.t === 'eraser') return erase(x, y); if (WB.cur.p) WB.cur.p.push([x, y]); else { WB.cur.x2 = x; WB.cur.y2 = y; } redrawWB(); }
function wbUp() { if (!WB.cur) return; if (WB.cur.t !== 'eraser') strokes().push(WB.cur); WB.cur = null; redrawWB(); }
function erase(x, y) { const a = strokes(); for (let i = a.length - 1; i >= 0; i--) if (hit(a[i], x, y)) a.splice(i, 1); redrawWB(); }
function textAt(cx, cy, x, y) {
  const inp_ = document.createElement('input'); inp_.className = 'wbtext'; inp_.style.left = cx + 'px'; inp_.style.top = (cy - 18) + 'px'; inp_.style.color = WB.color; document.body.appendChild(inp_); setTimeout(() => inp_.focus(), 0);
  const commit = () => { const v = inp_.value.trim(); if (v) { strokes().push({ t: 'text', text: v, x, y: y + 8, color: WB.color, size: WB.size }); redrawWB(); } inp_.remove(); };
  inp_.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') inp_.remove(); ev.stopPropagation(); }); inp_.addEventListener('blur', commit);
}
[wc, bc].forEach(c => { c.addEventListener('pointerdown', wbDown); c.addEventListener('pointermove', wbMove); c.addEventListener('pointerup', wbUp); c.addEventListener('pointerleave', wbUp); });
wc.addEventListener('wheel', e => { window.scrollBy(0, e.deltaY); }, { passive: true });
addEventListener('scroll', () => { if ((WB.over[S.phase] || []).length) redrawWB(); }, { passive: true });
const WBCOL = ['#16202A', '#00A7B2', '#00928E', '#21DED7', '#FAA71C', '#D77F28', '#C92426'];
const TOOLS = [['pen', '✏️', 'Pen'], ['hl', '🖍️', 'Highlighter'], ['line', '╱', 'Line'], ['arrow', '➜', 'Arrow'], ['rect', '▭', 'Box'], ['ell', '◯', 'Circle'], ['text', 'T', 'Text'], ['eraser', '🧽', 'Eraser']];
const STAMPS = [['st:bar', '🧱', 'Bar model'], ['st:table', '▦', 'Ratio table'], ['st:dnl', '📏', 'Double number line'], ['st:meter', '🌡️', 'Sip Meter'], ['st:times', '×?', 'Multiplier arrows'], ['st:cups', '🥤', 'Two jugs']];
function renderWBBar() {
  $('#wbbar').innerHTML = `<span class="lab">${WB.mode === 'board' ? 'Board' : 'Over lesson'}</span>
   ${WB.mode === 'overlay' ? `<button data-pass class="${WB.pass ? 'on' : ''}" title="Hand: click the lesson underneath">✋</button>` : ''}
   ${TOOLS.map(t => `<button data-tool="${t[0]}" class="${WB.tool === t[0] ? 'on' : ''}" title="${t[2]}">${t[1]}</button>`).join('')}<span class="sep"></span>
   ${STAMPS.map(t => `<button data-tool="${t[0]}" class="${WB.tool === t[0] ? 'on' : ''}" title="Stamp: ${t[2]}">${t[1]}</button>`).join('')}<span class="sep"></span>
   ${WBCOL.map(c => `<button class="sw ${WB.color === c ? 'on' : ''}" data-col="${c}" style="background:${c}" title="Colour"></button>`).join('')}<span class="sep"></span>
   ${[2, 4, 8].map(z => `<button data-size="${z}" class="${WB.size === z ? 'on' : ''}" title="Size"><span style="display:inline-block;width:${z + 4}px;height:${z + 4}px;border-radius:50%;background:var(--ink)"></span></button>`).join('')}<span class="sep"></span>
   <button data-act="undo" title="Undo">↶</button><button data-act="clear" title="Clear">🗑️</button><button data-act="swap" title="Switch board">${WB.mode === 'board' ? '📄 Lesson' : '⬜ Board'}</button><button data-act="close" title="Close (Esc)">✕</button>`;
  $$('#wbbar [data-tool]').forEach(b => b.onclick = () => { WB.tool = b.dataset.tool; WB.pass = false; applyWB(); });
  $$('#wbbar [data-col]').forEach(b => b.onclick = () => { WB.color = b.dataset.col; renderWBBar(); });
  $$('#wbbar [data-size]').forEach(b => b.onclick = () => { WB.size = +b.dataset.size; renderWBBar(); });
  const pb = $('#wbbar [data-pass]'); if (pb) pb.onclick = () => { WB.pass = !WB.pass; applyWB(); };
  $$('#wbbar [data-act]').forEach(b => b.onclick = () => { const a = b.dataset.act; if (a === 'undo') { strokes().pop(); redrawWB(); } if (a === 'clear') { strokes().length = 0; redrawWB(); } if (a === 'swap') openWB(WB.mode === 'board' ? 'overlay' : 'board'); if (a === 'close') closeWB(); });
}
function applyWB() { wc.classList.toggle('live', WB.open && WB.mode === 'overlay' && !WB.pass); renderWBBar(); }
function openWB(mode) { WB.open = true; WB.mode = mode; $('#board').classList.toggle('open', mode === 'board'); $('#wbbar').classList.add('open'); applyWB(); redrawWB(); }
function closeWB() { WB.open = false; WB.cur = null; $('#board').classList.remove('open'); $('#wbbar').classList.remove('open'); applyWB(); }
$('#tWb').onclick = () => WB.open && WB.mode === 'overlay' ? closeWB() : openWB('overlay');
$('#tBoard').onclick = () => WB.open && WB.mode === 'board' ? closeWB() : openWB('board');

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if ($('#splash').style.display !== 'none') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { closeModal(); closeWB(); $('#mentor').classList.remove('open'); }
  else if (k === 'w') $('#tWb').click(); else if (k === 'b') $('#tBoard').click(); else if (k === 'm') toggleMentor(); else if (k === 't') openTracker();
});

/* ---------------- finale ---------------- */
function openFinale() {
  S.finaleSeen = true; save(); closeModal();
  const mins = Math.max(1, Math.round((Date.now() - S.started) / 60000));
  const firstOk = Object.values(S.first).filter(Boolean).length, attempts = Object.keys(S.first).length;
  const c1 = +S.inputs.p2_conf || 0, c2 = +S.inputs.p9_conf || 0, L = S.lightning ? S.lightning.score : 0;
  const lab = S.lab ? `The ${S.lab} Lab` : 'The Perfect Mix Lab';
  const awards = [
    ['🥄', 'The Golden Ladle', 'Saved the Summer Sky Festival'],
    ['🧪', 'Chief Flavour Scientist', lab],
    ['🤖', 'Blendo Fixer', 'Taught a robot to multiply'],
    ['🫆', 'Fingerprint Finder', 'Proved taste = fraction of the whole'],
    ['⚡', 'Lightning Mixer', `Mix or Miss: ${L}/8`],
    ['📈', 'Growth Star', c2 > c1 ? `Confidence +${c2 - c1} ★` : `Confidence ${c2}/5 ★`]
  ];
  $('#finale').innerHTML = `<div class="fin">
   <div class="brand" style="font-size:22px">MyMastery<b>Lab</b></div>
   <h1>🎉 The gates are open!</h1>
   <p class="sub">500 visitors are sipping the Perfect Mix — and every cup tastes exactly right.</p>
   <div style="display:flex;justify-content:center;gap:6px;margin:10px 0">${CH.ruby('style="width:92px;height:92px"')}${CH.sci('style="width:120px;height:120px"')}${CH.blendo('style="width:92px;height:92px"')}${CH.jack('style="width:92px;height:92px"')}</div>
   <div class="cert">
     <svg viewBox="0 0 120 120" style="width:96px;height:96px"><circle cx="60" cy="60" r="56" fill="#FFF1D6" stroke="#16202A" stroke-width="3"/><path d="M74 18c-8 0-14 6-14 14v34" fill="none" stroke="#16202A" stroke-width="10" stroke-linecap="round"/><path d="M74 18c-8 0-14 6-14 14v34" fill="none" stroke="#FAA71C" stroke-width="5" stroke-linecap="round"/><path d="M36 66h48c0 30-48 30-48 0z" fill="#FAA71C" stroke="#16202A" stroke-width="3"/><path d="M42 72c4 10 30 10 36 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M24 70l-8 4M96 70l8 4M30 92l-8 6M90 92l8 6" stroke="#C92426" stroke-width="3" stroke-linecap="round"/></svg>
     <div style="font-weight:800;color:var(--muted)">This certifies that</div>
     <div class="nm">${nm()}</div>
     <div style="font-family:var(--head);font-size:22px;font-weight:600">is now a Chief Flavour Scientist</div>
     <p style="font-weight:700;max-width:52ch;margin:8px auto">for proving that perfect mixtures need <b>multiplication</b>, not addition — and for scaling recipes up and down without changing a single sip of flavour.</p>
     <div class="row" style="justify-content:space-around;font-weight:800;margin-top:10px"><span>🧪 ${lab}</span><span>🥤 Signature drink: ${S.drink || '—'}</span><span>🎓 Mentor: ${S.mentor || '—'}</span></div>
     <div style="font-family:var(--head);margin-top:8px;color:var(--teal-dd)">Proportion Lab – The Perfect Mix · ${new Date().toLocaleDateString()}</div>
   </div>
   <div class="awards">${awards.map((a, i) => `<div class="award" style="animation-delay:${.15 * i}s"><div class="em">${a[0]}</div><b>${a[1]}</b><small>${a[2]}</small></div>`).join('')}</div>
   <div class="stats"><div><b>${S.stars}</b>Flavour stars</div><div><b>${firstOk}/${attempts || 0}</b>Right first time</div><div><b>${S.cards.length}/5</b>Formula Cards</div><div><b>${mins}</b>Minutes</div></div>
   <div class="msgs">${say('ruby', `${nm()}, thanks to you, 500 people tasted the Perfect Mix — and Blendo finally learned to multiply. That's not luck. That's thinking like a scientist. 💛`)}
     ${say('blendo', 'NEW RULE INSTALLED: "NEED MORE? MULTIPLY MORE!" Thank you, Chief. You are my favourite human. 🤖🧡')}</div>
   <div class="card" style="text-align:left;--c:var(--orange)"><header><span class="ic" style="background:var(--orange-l)">📒</span><h3>${nm()}'s Lab Rulebook</h3></header>${FORMULA.map((f, i) => `<div class="rule"><b>${i + 1}</b><span style="font-weight:800">${f}</span></div>`).join('')}</div>
   <div class="row" style="justify-content:center;margin:20px 0 40px"><button class="btn o" id="fAgain">🎆 Celebrate again</button><button class="btn" id="fPrint">🖨️ Print certificate</button><button class="btn w" id="fClose">Back to the lesson</button></div>
  </div>`;
  $('#finale').classList.add('open'); $('#finale').scrollTop = 0;
  const party = () => { SND.finale(); rain(220); fireworks(8); };
  party();
  $('#fAgain').onclick = party; $('#fPrint').onclick = () => window.print(); $('#fClose').onclick = () => { $('#finale').classList.remove('open'); clearInterval(fwTimer); };
}

/* ---------------- boot ---------------- */
function decor() {
  $('#bubbles').innerHTML = Array.from({ length: 16 }, (_, i) => { const s = 10 + Math.random() * 34; return `<span style="left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${14 + Math.random() * 18}s;animation-delay:${-Math.random() * 30}s"></span>`; }).join('');
  const fc = ['#00A7B2', '#FAA71C', '#D77F28', '#C92426', '#21DED7'];
  $('#flags').innerHTML = Array.from({ length: 80 }, (_, i) => `<i style="background:${fc[i % fc.length]}"></i>`).join('');
  $('#castrow').innerHTML = ['ruby', 'blendo', 'jack', 'sci'].map(c => `<div>${CH[c]()}${c === 'sci' ? 'You!' : NAMES[c][0]}</div>`).join('');
}
function start() {
  $('#splash').style.display = 'none'; ac(); SND.unlock();
  updateTop(); renderLane(); renderPhase(Math.min(S.phase, S.unlocked)); sizeWB();
}
decor(); sizeFx();
addEventListener('resize', () => { sizeFx(); sizeWB(); });
const saved = load();
if (saved && saved.learner) { $('#btnContinue').style.display = ''; $('#btnContinue').textContent = `Continue ${saved.learner}'s session`; $('#inLearner').value = saved.learner; $('#inMentor').value = saved.mentor || ''; }
$('#btnContinue').onclick = () => { S = Object.assign(fresh(), saved); start(); };
$('#btnStart').onclick = () => {
  const l = $('#inLearner').value.trim(); if (!l) { $('#inLearner').focus(); toast('Type the scientist\'s name first 🧪'); return; }
  S = fresh(); S.learner = l; S.mentor = $('#inMentor').value.trim(); save(); start();
};
$('#inLearner').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnStart').click(); });
</script>
