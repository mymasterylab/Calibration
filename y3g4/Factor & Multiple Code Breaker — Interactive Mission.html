<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Factor & Multiple Code Breaker — Interactive Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Brand requires a light/white background in every theme, so dark-mode tokens intentionally keep the light values. */
:root{
  --teal:#00A7B2; --teal-2:#32cdc8; --teal-3:#21ded7; --teal-deep:#00928e; --teal-soft:#E6F7F8; --teal-mist:#F2FBFB;
  --orange:#FAA71C; --orange-soft:#FFF4E0; --burnt:#D77F28; --crimson:#C92426; --flame:#ff5900; --red:#ff4200;
  --ink:#1a1a1a; --ink-2:#4a4a4a; --line:#e3e8ea; --paper:#FFFFFF;
  --good:#00a9a5; --bad:#C92426;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:26px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FFFFFF; --ink:#1a1a1a; } }
:root[data-theme="dark"]{ --paper:#FFFFFF; --ink:#1a1a1a; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--teal);background:var(--paper);position:relative;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lock{width:40px;height:40px;flex:none}
.brand h1{font-size:1.45rem;font-weight:800;color:var(--ink);white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:.72rem;color:var(--teal-deep);font-weight:600;letter-spacing:.01em}
.agentchip{display:flex;align-items:center;gap:8px;background:var(--teal-soft);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.agentchip .av{width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:20px;border:2px solid var(--teal)}
.letters{display:flex;gap:6px;align-items:center}
.letters .lt{width:34px;height:40px;border-radius:9px;border:2px dashed #c9d4d7;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#b9c4c7;background:var(--paper)}
.letters .lt.on{border:2px solid var(--burnt);background:var(--orange);color:var(--paper);box-shadow:0 3px 0 var(--burnt);animation:flipin .6s}
.letters .cap{font-size:.72rem;color:var(--ink-2);margin-right:4px;line-height:1.1;max-width:70px}
@keyframes flipin{0%{transform:rotateY(90deg) scale(1.3)}100%{transform:none}}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-weight:600;font-size:.9rem}
.tbtn:hover{border-color:var(--teal)}
.tbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tbtn.mentor.on{background:var(--burnt);border-color:var(--burnt)}

.main{display:grid;grid-template-columns:230px 1fr;min-height:0}
.rail{border-right:2px solid var(--line);padding:16px 12px;overflow:auto;background:linear-gradient(180deg,var(--teal-mist),var(--paper))}
.rail h2{font-size:1rem;color:var(--teal-deep);margin:0 6px 10px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:4px dotted #b7dfe2}
.stn{position:relative;display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 6px;border-radius:14px;text-align:left}
.stn .dot{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:21px;background:#eef2f3;border:3px solid #d5dde0;position:relative;z-index:1}
.stn .nm{font-weight:600;font-size:.88rem;line-height:1.15}
.stn .tm{display:block;font-size:.72rem;color:var(--ink-2);font-weight:400}
.stn.locked{opacity:.55;cursor:not-allowed}
.stn.locked .dot::after{content:"🔒";position:absolute;right:-6px;bottom:-6px;font-size:14px}
.stn.open .dot{background:var(--paper);border-color:var(--teal)}
.stn.done .dot{background:var(--teal);border-color:var(--teal-deep)}
.stn.done .dot::after{content:"✓";position:absolute;right:-5px;bottom:-5px;background:var(--orange);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;display:grid;place-items:center;font-weight:800}
.stn.cur{background:var(--paper);box-shadow:0 0 0 3px var(--orange) inset}
.stn.cur .dot{transform:scale(1.08);border-color:var(--orange)}

.stagewrap{position:relative;min-height:0;overflow:hidden}
.stage{height:100%;overflow:auto;padding:22px 28px 60px;position:relative}
.bottom{display:flex;align-items:center;gap:14px;padding:10px 18px;border-top:3px solid var(--teal-soft);background:var(--paper);flex-wrap:wrap;z-index:25;position:relative}
.tasks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}
.tasks .lab{font-weight:600;font-size:.85rem;color:var(--ink-2)}
.tk{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 6px;background:#f1f4f5;font-size:.82rem;font-weight:500}
.tk i{width:20px;height:20px;border-radius:50%;border:2px solid #c5cfd2;display:grid;place-items:center;font-style:normal;font-size:12px}
.tk.ok{background:var(--teal-soft)} .tk.ok i{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{border:0;border-radius:14px;padding:11px 20px;font-weight:700;font-family:var(--display);font-size:1.08rem;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.btn.alt{background:var(--orange);box-shadow:0 4px 0 var(--burnt);color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.small{padding:7px 14px;font-size:.95rem}
.btn[disabled]{background:#dfe5e7;color:#8a9699;box-shadow:0 4px 0 #c8d0d2;cursor:not-allowed}
.btn.pulse:not([disabled]){animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--teal-deep),0 0 0 0 rgba(0,167,178,.5)}50%{box-shadow:0 4px 0 var(--teal-deep),0 0 0 12px rgba(0,167,178,0)}}
.mentor-only{display:none!important}
body.mentor .mentor-only{display:revert!important}
body.mentor .mentor-only.flex{display:flex!important}
body.mentor .mentor-only.hide{display:none!important}

/* ---------- Story ---------- */
.scene{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;background:linear-gradient(120deg,var(--teal-soft),var(--orange-soft));border-radius:var(--r-lg);padding:18px 24px 18px 18px;position:relative;overflow:hidden;margin-bottom:18px}
.scene::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:22px solid rgba(255,255,255,.55)}
.scene .who{width:128px;text-align:center}
.scene .who svg{width:118px;height:138px;display:block;margin:0 auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.scene .who b{font-family:var(--display);font-size:.95rem;display:block;margin-top:2px}
.chapter{font-family:var(--display);color:var(--teal-deep);font-weight:700;font-size:.95rem}
.scene h2{font-size:2.1rem;font-weight:800;margin:0 0 8px}
.bubble{background:var(--paper);border-radius:20px;padding:14px 18px;position:relative;font-size:1.08rem;min-height:64px;box-shadow:0 3px 0 rgba(0,146,142,.18);max-width:760px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:12px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble.villain{background:#fff;box-shadow:0 0 0 3px var(--crimson)}
.bubble.villain::before{border-right-color:var(--crimson)}
.dlgnav{display:flex;align-items:center;gap:10px;margin-top:10px;position:relative;z-index:1}
.dlgnav .dots{display:flex;gap:5px}
.dlgnav .dots span{width:9px;height:9px;border-radius:50%;background:rgba(0,146,142,.25)}
.dlgnav .dots span.on{background:var(--teal);width:22px;border-radius:9px}
.speaker-tag{font-family:var(--display);font-weight:700;color:var(--teal-deep);display:block;font-size:.95rem}
.villain .speaker-tag{color:var(--crimson)}

.notes{background:var(--orange-soft);border:2px dashed var(--burnt);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;font-size:.92rem}
.notes b{color:var(--burnt);font-family:var(--display);font-size:1.02rem}
.notes ul{margin:6px 0 0;padding-left:18px}

/* ---------- Activity cards ---------- */
.card{background:var(--paper);border-radius:var(--r-lg);border:3px solid var(--teal-soft);padding:20px 22px;margin-bottom:18px;position:relative}
.card.o{border-color:var(--orange-soft)}
.card.c{border-color:#f6d3d3}
.card h3{font-size:1.5rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 .ico{font-size:1.5rem}
.card .sub{color:var(--ink-2);margin:0 0 14px}
.tag{font-family:var(--body);font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--orange);color:var(--ink)}
.tag.t{background:var(--teal);color:#fff}
.tag.done{background:var(--teal-soft);color:var(--teal-deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.why{background:var(--teal-soft);border-left:8px solid var(--teal);border-radius:14px;padding:12px 16px;margin-top:14px}
.why b.h{font-family:var(--display);color:var(--teal-deep);font-size:1.1rem;display:block}
.fb{min-height:28px;margin-top:10px;font-weight:600;border-radius:12px;padding:0}
.fb.ok{color:var(--teal-deep);background:var(--teal-soft);padding:8px 14px}
.fb.no{color:var(--crimson);background:#fdecec;padding:8px 14px}
.fb.info{color:var(--burnt);background:var(--orange-soft);padding:8px 14px}
.fb.pop{animation:popin .35s}
@keyframes popin{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 16px;font-family:var(--display);font-weight:700;font-size:1.1rem}
.tab.on{border-color:var(--teal);background:var(--teal-soft)}
.tab.ok::after{content:" ✓";color:var(--teal-deep)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:700;font-size:1.2rem;padding:0 10px}
.chip:hover{border-color:var(--teal)}
.chip.sel{background:var(--teal);color:#fff;border-color:var(--teal-deep)}
.chip.good{background:var(--teal-soft);border-color:var(--teal)}
.chip.x{text-decoration:line-through;opacity:.4}
.ask{font-weight:600;margin:8px 0}
.in{width:74px;height:48px;border:3px dashed var(--teal-2);border-radius:12px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;background:var(--teal-mist);color:var(--ink)}
.in.wide{width:100%;text-align:left;padding:8px 12px;font-family:var(--body);font-size:1rem;font-weight:500;height:auto;min-height:48px}
.in.ok{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.in.no{border-style:solid;border-color:var(--crimson);background:#fdecec}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:500}
.opt:hover{border-color:var(--teal-2)}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--crimson);background:#fdecec}
.tf{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:2px dashed var(--line);padding:10px 0;flex-wrap:wrap}
.tf .q{flex:1;min-width:220px;font-weight:500}
.thumb{border:3px solid var(--line);background:var(--paper);border-radius:12px;font-size:1.5rem;width:58px;height:48px}
.thumb.right{border-color:var(--teal);background:var(--teal-soft)}
.thumb.wrong{border-color:var(--crimson);background:#fdecec}

/* Rectangle builder */
.tray{min-height:180px;border-radius:20px;background:repeating-linear-gradient(45deg,var(--orange-soft),var(--orange-soft) 14px,#fff9ee 14px,#fff9ee 28px);border:4px solid var(--orange);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;margin-top:10px;overflow:auto}
.tray .r{display:flex;gap:6px}
.tile{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(215,127,40,.35);animation:drop .35s backwards}
.tile.left{box-shadow:0 0 0 3px var(--crimson);background:#fdecec}
.tray .cap{font-family:var(--display);font-weight:700;font-size:1.2rem;margin-top:6px}
.tray .cap.bad{color:var(--crimson)}
@keyframes drop{from{transform:translateY(-16px) scale(.6);opacity:0}}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.slot{min-width:92px;height:44px;border-radius:12px;border:3px dashed #c5cfd2;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.15rem;color:#aab5b8;padding:0 10px}
.slot.on{border:3px solid var(--teal);background:var(--teal);color:#fff;animation:popin .4s}

/* Frog */
.river{background:linear-gradient(180deg,#e6f7f8,#d6f3f4);border-radius:22px;padding:16px;border:3px solid var(--teal-2)}
.pads{display:grid;grid-template-columns:repeat(20,1fr);gap:5px}
.pad{aspect-ratio:1;border-radius:50%;border:2px solid #b7dfe2;background:rgba(255,255,255,.8);font-weight:700;font-size:.82rem;display:grid;place-items:center;position:relative;padding:0;min-width:0}
.pad:hover{border-color:var(--teal)}
.pad.hit{background:var(--teal-3);border-color:var(--teal-deep);color:var(--ink)}
.pad.hit::before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(0,146,142,.35);clip-path:polygon(0 0,100% 0,100% 100%,55% 55%,0 100%)}
.pad.frog{background:var(--orange)}
.pad .fg{position:absolute;top:-24px;font-size:24px;animation:hop .4s}
@keyframes hop{0%{transform:translateY(20px) scale(.6)}60%{transform:translateY(-10px)}100%{transform:none}}
.pads + .pads{margin-top:30px}
.hopbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:130px;height:130px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.2rem}
.hopbtn{width:130px;height:130px;border-radius:50%;border:0;background:var(--teal-3);font-size:3rem;box-shadow:0 6px 0 var(--teal-deep)}
.hopbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-deep)}
.bigcount{font-family:var(--display);font-size:2rem;font-weight:800}

/* Rainbow */
.rb{width:100%;max-width:720px;display:block;margin:6px auto}
.rb text{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800}
.closed{background:linear-gradient(90deg,var(--teal),var(--teal-3));color:#fff;border-radius:14px;padding:10px 16px;font-family:var(--display);font-size:1.2rem;font-weight:700;margin-top:8px;animation:popin .5s}

/* Grid 1-50 */
.g50{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:560px}
.g50 button{aspect-ratio:1.25;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:700;font-size:1.1rem;position:relative;padding:0}
.g50 button.t10{background:var(--teal);color:#fff;border-color:var(--teal-deep)}
.g50 button.f5{box-shadow:0 0 0 3px var(--orange) inset}
.g50 button.f2::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--burnt)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;margin-top:10px}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:18px;height:18px;border-radius:5px;display:inline-block}
.blocks{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:10px 0}
.rods{display:flex;gap:4px}
.rods i{width:12px;height:80px;border-radius:3px;background:repeating-linear-gradient(0deg,var(--teal) 0 7px,var(--teal-3) 7px 8px)}
.cubes{display:flex;gap:4px;flex-wrap:wrap;width:60px}
.cubes i{width:12px;height:12px;border-radius:3px;background:var(--orange)}
.bags{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.bag{width:74px;height:84px;border-radius:12px 12px 26px 26px;background:var(--orange);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--ink);position:relative;font-size:1.3rem;box-shadow:0 4px 0 var(--burnt)}
.bag::before{content:"";position:absolute;top:-8px;left:22px;right:22px;height:12px;border:4px solid var(--burnt);border-bottom:0;border-radius:10px 10px 0 0}
.bag em{position:absolute;right:-14px;top:-12px;background:var(--crimson);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.9rem}
.loose{display:flex;gap:4px}
.loose i{width:22px;height:22px;border-radius:50%;background:var(--crimson)}

.calc{background:#1f2b2d;border-radius:22px;padding:16px;width:260px;box-shadow:0 6px 0 #0d1415}
.calc .disp{background:#dff7f6;border-radius:12px;height:62px;font-family:"Courier New",monospace;font-weight:700;font-size:1.5rem;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;overflow:hidden;color:#123}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.calc .keys span{height:34px;border-radius:8px;background:#35464a;color:#fff;display:grid;place-items:center;font-size:.9rem}
.calc .keys span.hl{background:var(--orange);color:var(--ink)}
.race{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.qbig{font-family:var(--display);font-size:2rem;font-weight:800}
.score{font-family:var(--display);font-size:1.2rem;font-weight:700;color:var(--teal-deep)}
.speed{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.flash{font-family:var(--display);font-size:4.5rem;font-weight:800;text-align:center;background:var(--teal-mist);border-radius:22px;padding:10px;border:4px solid var(--teal-2)}
.det{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.det button{width:90px;height:76px;border-radius:18px;border:3px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.det button small{font-family:var(--body);font-size:.66rem;font-weight:600;color:var(--ink-2);margin-top:4px}
.det button.sel{background:var(--orange);border-color:var(--burnt);animation:beep .3s}
@keyframes beep{50%{transform:scale(1.08)}}
.bar{height:14px;border-radius:9px;background:#eef2f3;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));width:100%;transition:width 1s linear}

/* Real world */
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.mcard{border:3px solid var(--line);border-radius:22px;background:var(--paper);padding:14px;text-align:left;position:relative}
.mcard .art{font-size:2.6rem;height:64px;display:flex;align-items:center;gap:4px}
.mcard h4{font-size:1.25rem}
.mcard p{margin:4px 0 0;font-size:.88rem;color:var(--ink-2)}
.mcard.on{border-color:var(--teal);box-shadow:0 5px 0 var(--teal-2)}
.mcard.ok::after{content:"✓ Done";position:absolute;top:10px;right:10px;background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.8rem}
.tl{display:grid;grid-template-columns:70px repeat(25,1fr);gap:3px;align-items:center;margin:6px 0}
.tl button{height:34px;border-radius:7px;border:2px solid var(--line);background:var(--paper);font-size:.72rem;font-weight:700;padding:0;min-width:0}
.tl button.blue{background:var(--teal);color:#fff;border-color:var(--teal-deep)}
.tl button.redb{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.tl .nm{font-weight:700;font-size:.85rem}
.beds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bed{border:3px solid var(--line);border-radius:14px;background:#fff8ec;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bed .gd{display:grid;gap:3px}
.bed .gd i{width:9px;height:9px;border-radius:50%;background:var(--crimson)}
.bed.right{border-color:var(--teal);background:var(--teal-soft)}
.bed.wrong{border-color:var(--orange)}

/* Vault */
.vaultwrap{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}
.clue{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);font-weight:500}
.clue input{width:22px;height:22px;accent-color:var(--teal)}
.clue.ticked span{text-decoration:line-through;color:var(--ink-2)}
.vault{position:relative;perspective:900px;width:100%;max-width:340px;margin:0 auto}
.vault .treasure{position:absolute;inset:8% 8%;border-radius:50%;background:radial-gradient(circle,var(--orange-soft),var(--orange));display:grid;place-items:center;font-size:4rem}
.vault .door{position:relative;transform-origin:left center;transition:transform 1.6s cubic-bezier(.5,-.2,.3,1.3)}
.vault.open .door{transform:rotateY(-105deg)}
.vault svg{width:100%;display:block}
.dial{transform-origin:170px 170px;transition:transform 1.2s}
.vault.c1 .dial{transform:rotate(540deg)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:12px}
.keypad button{height:52px;border-radius:14px;border:0;background:var(--teal-soft);font-family:var(--display);font-size:1.5rem;font-weight:800;box-shadow:0 3px 0 var(--teal-2)}
.keypad button.en{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-deep)}
.codebox{display:flex;gap:8px;justify-content:center}
.codebox span{width:64px;height:76px;border-radius:14px;border:4px solid var(--ink);background:#fff;font-family:var(--display);font-size:2.8rem;font-weight:800;display:grid;place-items:center}
.lettiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.lettiles button{width:56px;height:62px;border-radius:12px;border:0;background:var(--orange);font-family:var(--display);font-size:2rem;font-weight:800;box-shadow:0 4px 0 var(--burnt)}
.lettiles button.gift{background:var(--paper);box-shadow:0 0 0 3px var(--orange) inset}
.lettiles button.used{opacity:.25;pointer-events:none}
.pwslots{display:flex;gap:8px;justify-content:center}
.pwslots button{width:56px;height:62px;border-radius:12px;border:3px dashed var(--burnt);background:var(--orange-soft);font-family:var(--display);font-size:2rem;font-weight:800;padding:0}

/* Debrief */
.stars{display:flex;gap:6px}
.stars button{font-size:2.1rem;border:0;background:none;filter:grayscale(1);opacity:.4;padding:0 2px;transition:transform .15s}
.stars button.on{filter:none;opacity:1;transform:scale(1.1)}
.riddle{background:var(--orange-soft);border:3px solid var(--orange);border-radius:18px;padding:14px 18px;font-weight:500}
.riddle ol{margin:6px 0 0;padding-left:22px}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatars button{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--paper);font-size:1.8rem}
.avatars button.sel{border-color:var(--teal);background:var(--teal-soft);transform:scale(1.08)}
.idcard{border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--teal-3));padding:16px;color:#fff;display:flex;gap:16px;align-items:center;box-shadow:0 6px 0 var(--teal-deep)}
.idcard .ph{width:86px;height:86px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:3rem;flex:none}
.idcard .nm{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1}
.idcard .lbl{font-size:.75rem;opacity:.9}
.idcard .stamp{margin-left:auto;border:3px solid #fff;border-radius:10px;padding:4px 8px;transform:rotate(-8deg);font-family:var(--display);font-weight:800}

/* Overlays */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,120,128,.28);padding:20px}
.ov.show{display:flex}
.modal{background:var(--paper);border-radius:30px;padding:26px 30px;max-width:520px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(0,146,142,.25);animation:zoom .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.modal h2{font-size:2.2rem;font-weight:800}
.badgeart{width:170px;height:170px;margin:0 auto 6px;display:block;animation:spinin 1s cubic-bezier(.3,1.4,.5,1)}
@keyframes spinin{from{transform:rotate(-200deg) scale(.2)}}
.bigletter{width:84px;height:96px;margin:10px auto;border-radius:16px;background:var(--orange);font-family:var(--display);font-size:3.6rem;font-weight:800;display:grid;place-items:center;box-shadow:0 6px 0 var(--burnt);animation:flipin 1s .5s backwards}
.chap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:var(--paper)}
.chap.show{display:flex;animation:fadeout 1.9s forwards}
@keyframes fadeout{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0;visibility:hidden}}
.chap .in2{text-align:center}
.chap .n{font-family:var(--display);font-size:1.3rem;color:var(--teal-deep);font-weight:700}
.chap .t{font-family:var(--display);font-size:clamp(2.6rem,7vw,5.2rem);font-weight:800;line-height:1}
.chap .ic{font-size:5rem;animation:zoom .6s}

/* Finale */
.finale{position:fixed;inset:0;z-index:90;display:none;overflow:auto;background:radial-gradient(circle at 50% 0%,var(--orange-soft),var(--paper) 60%);padding:24px}
.finale.show{display:block}
.fin{max-width:1000px;margin:0 auto;text-align:center}
.fin h2{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;line-height:1}
.fin .lead{font-size:1.2rem;margin:8px 0 18px}
.trophy{width:170px;animation:spinin 1.2s cubic-bezier(.3,1.4,.5,1)}
.cert{border:6px double var(--teal);border-radius:24px;padding:22px;margin:18px auto;background:#fff;max-width:760px;position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:2px dashed var(--orange);border-radius:18px;pointer-events:none}
.cert .aw{font-family:var(--display);color:var(--burnt);font-size:1.2rem;font-weight:700}
.cert .who{font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem);font-weight:800;color:var(--teal-deep);line-height:1.1}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.award{border-radius:20px;padding:12px;background:var(--teal-soft);animation:zoom .5s backwards}
.award .e{font-size:2.4rem}
.award b{font-family:var(--display);display:block;font-size:1.1rem}
.award small{font-size:.78rem;color:var(--ink-2)}
.award.gold{background:var(--orange-soft);box-shadow:0 0 0 3px var(--orange) inset}
.cast{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.cast svg{width:92px;height:108px;animation:bob 1.2s ease-in-out infinite}
.cast div:nth-child(2) svg{animation-delay:.2s}.cast div:nth-child(3) svg{animation-delay:.4s}.cast div:nth-child(4) svg{animation-delay:.6s}.cast div:nth-child(5) svg{animation-delay:.8s}
.cast small{display:block;font-weight:600;font-size:.78rem}
.msg{background:var(--teal-soft);border-radius:22px;padding:18px 22px;text-align:left;display:flex;gap:16px;align-items:center;max-width:760px;margin:0 auto 18px}
.msg svg{width:90px;flex:none}
.msg p{margin:0;font-size:1.08rem}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stats div{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 16px}
.stats b{font-family:var(--display);font-size:1.6rem;display:block;color:var(--teal-deep)}

/* Whiteboard */
#wb{position:absolute;left:0;top:0;z-index:20;display:none;touch-action:none;cursor:crosshair}
#wb.show{display:block}
#wb.board{background-color:#fff;background-image:linear-gradient(#eaf5f6 1px,transparent 1px),linear-gradient(90deg,#eaf5f6 1px,transparent 1px);background-size:32px 32px}
#wb.pass{pointer-events:none}
.wbbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:22;display:none;gap:6px;align-items:center;background:var(--paper);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--teal-2),0 0 0 2px var(--teal-soft);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
.wbbar.show{display:flex}
.wbbar button{border:2px solid var(--line);background:var(--paper);border-radius:10px;height:38px;min-width:38px;padding:0 8px;font-weight:600;font-size:.85rem}
.wbbar button.on{border-color:var(--teal);background:var(--teal-soft)}
.wbbar .sw{width:28px;height:28px;min-width:28px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.wbbar .sw.on{box-shadow:0 0 0 3px var(--ink)}
.wbbar .sep{width:2px;height:28px;background:var(--line)}
.wbtext{position:absolute;z-index:23;border:2px dashed var(--teal);background:rgba(255,255,255,.9);font-family:var(--display);font-weight:700;font-size:26px;padding:2px 6px;min-width:120px;outline:none}

/* Timer */
.timer{position:fixed;right:18px;bottom:84px;z-index:60;background:var(--paper);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--orange),0 0 0 3px var(--orange-soft);display:none;width:230px;text-align:center}
.timer.show{display:block}
.timer .t{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1}
.timer .t.end{color:var(--crimson);animation:shake .5s 3}
.timer .row{justify-content:center;margin-top:6px}
.timer .row button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 9px;font-weight:600;font-size:.82rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:120}

@media (max-width:1440px){ .tbtn span{display:none} .tbtn{padding:6px 10px} }
@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:2px solid var(--line);padding:8px}
  .rail h2{display:none}
  .path{display:flex;gap:4px;overflow-x:auto}
  .path::before{display:none}
  .stn .nm{display:none}
  .grid2,.vaultwrap{grid-template-columns:1fr}
  .missions{grid-template-columns:1fr}
  .beds{grid-template-columns:1fr 1fr}
  .scene{grid-template-columns:1fr}
  .scene .who{display:flex;align-items:center;gap:8px;width:auto}
  .scene .who svg{width:70px;height:82px;margin:0}
  .bubble::before{display:none}
  .pads{grid-template-columns:repeat(10,1fr)}
  .stage{padding:16px 14px 60px}
}
@media (max-width:560px){ .brand h1{font-size:1.1rem} .letters .cap{display:none} .tbtn span{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
@media print{
  body *{visibility:hidden} .cert,.cert *{visibility:visible} .cert{position:absolute;left:0;top:0;width:100%}
  body{overflow:visible}
}

<script>
(function(){

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const nm=()=>esc(S.agent?('Agent '+S.agent):'Agent');
const snack=()=>esc(S.snack||'favourite snack');

/* ================= SOUND ================= */
const SND=(()=>{let ctx=null;

    click(){tone(900,0,.05,'square',.035)},

/* ================= CONFETTI ================= */
const FX=(()=>{const cv=$('#fx'), c=cv.getContext('2d'); let P=[], raf=0, rainUntil=0; const COLS=['#00A7B2','#FAA71C','#D77F28','#C92426','#21ded7','#ff5900','#32cdc8'];

  function size(){const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; c.setTransform(d,0,0,d,0,0);} size(); addEventListener('resize',size);
  function add(x,y,vx,vy){P.push({x,y,vx,vy,r:4+Math.random()*6,col:COLS[Math.random()*COLS.length|0],rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:1,sh:Math.random()<.5?0:(Math.random()<.5?1:2)})}
  function burst(x,y,n){n=reduce?Math.min(n,15):n; for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, s=3+Math.random()*7; add(x,y,Math.cos(a)*s,Math.sin(a)*s-4);} go();}
  function rain(ms){rainUntil=performance.now()+ms; go();}
  function go(){ if(!raf) raf=requestAnimationFrame(loop); }
  function loop(t){ c.clearRect(0,0,innerWidth,innerHeight);
    if(t<rainUntil && !reduce) for(let i=0;i<4;i++) add(Math.random()*innerWidth,-10,(Math.random()-.5)*2,2+Math.random()*3);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.99;p.rot+=p.vr;if(p.y>innerHeight+20)p.life=0; c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;
      if(p.sh===0) c.fillRect(-p.r/2,-p.r,p.r,p.r*2); else if(p.sh===1){c.beginPath();c.arc(0,0,p.r/2,0,7);c.fill()} else {c.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;c.lineTo(Math.cos(a)*p.r*.8,Math.sin(a)*p.r*.8);const b=a+.628;c.lineTo(Math.cos(b)*p.r*.35,Math.sin(b)*p.r*.35)}c.fill()}
      c.restore();});
    P=P.filter(p=>p.life>0);
    if(P.length||t<rainUntil) raf=requestAnimationFrame(loop); else {raf=0;c.clearRect(0,0,innerWidth,innerHeight);}
  }
  return{burst,rain,at(el,n){const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,n||40);}};
})();

function renderRail(){
  $('#path').innerHTML=PH.map((p,i)=>{const cls=['stn']; if(i>S.max) cls.push('locked'); else cls.push('open'); if(isComplete(i)) cls.push('done'); if(i===S.phase) cls.push('cur');
    return `<li><button class="${cls.join(' ')}" data-i="${i}" ${i>S.max?'aria-disabled="true"':''} title="${esc(p.title)}"><span class="dot">${p.icon}</span><span class="nm">${esc(p.title)}<span class="tm">${p.time}</span></span></button></li>`}).join('');
  $$('#path .stn').forEach(b=>b.onclick=()=>{const i=+b.dataset.i; if(i<=S.max){SND.click();goTo(i,false);} else {SND.miss(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400);}});
}
function T(i){const k=PH[i].key; return S.tasks[k]||(S.tasks[k]={});}
function isComplete(i){return PH[i].tasks.every(k=>T(i)[k]);}
function renderFooter(){
  const i=S.phase, P=PH[i], t=T(i);
  $('#tasks').innerHTML=`<span class="lab">To unlock:</span>`+P.tasks.map(k=>`<span class="tk ${t[k]?'ok':''}"><i>${t[k]?'✓':''}</i>${TASKLAB[k]}</span>`).join('');
  const nb=$('#bNext'), last=i===PH.length-1, comp=isComplete(i);
  $('#bBack').disabled=i===0; $('#bBack').style.visibility=i===0?'hidden':'visible';
  if(last){ nb.textContent='🎉 Grand celebration'; nb.disabled=!comp; $('#bForce').textContent='Celebrate anyway'; }
  else { nb.textContent=(S.max>i?'Next mission: ':'Unlock: ')+PH[i+1].title+(S.max>i?' ▶':' 🔓'); nb.disabled=!(comp||S.max>i); $('#bForce').textContent='Unlock anyway'; }
  $('#bForce').classList.toggle('hide',comp||S.max>i);
}
function done(k){ /* task keys are unique, so a delayed call still marks the right chapter */
  let i=PH.findIndex(p=>p.tasks.includes(k)); if(i<0) i=S.phase; const t=T(i); if(t[k]) return; t[k]=true; save(); renderFooter(); renderRail();
  if(isComplete(i)) setTimeout(()=>completePhase(i),700);}
function addLetter(L){ if(L && !S.letters.includes(L)){ S.letters.push(L); save(); renderTop(); } }
function completePhase(i){
  const P=PH[i]; if(!isComplete(i)) return;
  if(P.badge && !S.badges.includes(P.badge.name)){ S.badges.push(P.badge.name); addLetter(P.badge.letter); save(); if(S.phase===i) showBadge(P.badge); else SND.badge(); }

}

const factors=n=>range(1,n).filter(d=>n%d===0);
const RBC=['#00A7B2','#FAA71C','#D77F28','#C92426','#21ded7','#ff5900','#00928e','#32cdc8'];
function rainbowSVG(all,found,opts={}){
  const W=700,H=opts.h||230,pad=40,base=H-40; const xs=all.map((_,i)=>pad+i*(W-2*pad)/Math.max(1,all.length-1));
  let arcs=''; const n=opts.n; const pairs=[];
  all.forEach((a,i)=>{const b=n/a; if(a<=b && found.includes(a) && found.includes(b)) pairs.push([i,all.indexOf(b)]);});
  (opts.pairs||pairs).forEach(([i,j],k)=>{ const x1=xs[i],x2=xs[j]; if(i===j){ arcs+=`<circle cx="${x1}" cy="${base}" r="30" fill="none" stroke="#FAA71C" stroke-width="7" stroke-dasharray="6 5"/>`; return;}
    const r=(x2-x1)/2; arcs+=`<path d="M${x1} ${base-18} A ${r} ${Math.min(r,base-30)} 0 0 1 ${x2} ${base-18}" fill="none" stroke="${RBC[k%RBC.length]}" stroke-width="9" stroke-linecap="round" style="stroke-dasharray:1200;stroke-dashoffset:0;animation:drawarc 1s"/>`; });
  const nodes=all.map((a,i)=>{ const f=found.includes(a); const miss=opts.missing&&opts.missing.includes(a);
    return `<g><circle cx="${xs[i]}" cy="${base}" r="20" fill="${f?'#fff':(miss?'#fdecec':'#f4f7f8')}" stroke="${f?'#00A7B2':(miss?'#C92426':'#c5cfd2')}" stroke-width="3" ${f?'':'stroke-dasharray="4 4"'}/><text x="${xs[i]}" y="${base+7}" text-anchor="middle" font-size="19" fill="${f?'#1a1a1a':(miss?'#C92426':'#aab5b8')}">${f?a:'?'}</text></g>`;}).join('');
  return `<svg class="rb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Factor rainbow"><style>@keyframes drawarc{from{stroke-dashoffset:1200}}</style>${opts.extra||''}${arcs}${nodes}</svg>`;
}

    <div>for discovering why numbers have hidden structures — factors, multiples and divisibility clues — and using them to crack the vault.</div>
    <div class="awards">${AW.map(([e,n,s],i)=>{const got=S.badges.includes(n);return `<div class="award ${n==='Vault Master'?'gold':''}" style="animation-delay:${.3+i*.15}s;${got?'':'opacity:.45'}"><div class="e">${e}</div><b>${n}</b><small>${s}</small></div>`}).join('')}</div>
    <div class="stats"><div><b>${S.conf0||'–'} → ${S.conf1||'–'} ⭐</b>Confidence</div><div><b>${S.stats.speedBest}/10</b>Speed round best</div><div><b>${S.stats.calcWins}</b>Calculators beaten</div><div><b>${S.letters.length}/5</b>Secret letters</div></div>
    <div class="sub">${dt}</div></div>
   <div class="msg">${CH.max.svg()}<p><b>A message from Agent Max:</b> ${nm()}, today you didn't just learn rules — you discovered <b>why</b> they work. You built rectangles, raced a calculator, caught Professor Scramble cheating and even wrote your own riddle. That's how real mathematicians think. HQ is proud of you. See you on the next mission!</p></div>
   <div class="row" style="justify-content:center;margin-bottom:30px"><button class="btn alt" id="fAgain">🎉 Celebrate again</button><button class="btn ghost" id="fPrint">🖨️ Print certificate</button><button class="btn" id="fClose">Back to mission map</button></div>
  </div>`;
  F.classList.add('show'); F.scrollTop=0; SND.grand(); FX.rain(5000);
  [300,1200,2200,3000,3800].forEach((t,i)=>setTimeout(()=>FX.burst(innerWidth*(.2+.6*Math.random()),innerHeight*(.2+.3*Math.random()),90),t));
  $('#fAgain').onclick=()=>{SND.grand();FX.rain(4000);FX.burst(innerWidth/2,innerHeight/3,150);};
  $('#fPrint').onclick=()=>{try{window.print()}catch(e){}};
  $('#fClose').onclick=()=>{F.classList.remove('show');SND.click();};
}

/* ================= FOOTER / TOOLS ================= */
$('#bNext').onclick=()=>{ const i=S.phase; if(i===PH.length-1){ finale(); return; } if(PHASE_CLEANUP){PHASE_CLEANUP();PHASE_CLEANUP=null;} goTo(i+1,S.max<=i); };
$('#bForce').onclick=()=>{ const i=S.phase; if(i===PH.length-1){ finale(); return; } if(PHASE_CLEANUP){PHASE_CLEANUP();PHASE_CLEANUP=null;} goTo(i+1,true); };
$('#bBack').onclick=()=>{ if(S.phase>0){ if(PHASE_CLEANUP){PHASE_CLEANUP();PHASE_CLEANUP=null;} SND.click(); goTo(S.phase-1,false);} };
$('#bSound').onclick=()=>{S.sound=!S.sound;save();renderTop(); if(S.sound) SND.ok();};
$('#bMentor').onclick=()=>{const on=document.body.classList.toggle('mentor'); $('#bMentor').classList.toggle('on',on); SND.click();};
$('#bReset').onclick=()=>{ if(confirm('Reset the whole mission for a new learner?')){ const snd=S.sound; S=fresh(); S.sound=snd; save(); WB.clearAll(); renderAll(); } };

/* Timer */
(function(){ let total=60, left=60, h=null; const d=$('#tDisp');
  const show=()=>{d.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; d.classList.toggle('end',left===0);};
  $('#bTimer').onclick=()=>{$('#timer').classList.toggle('show'); $('#bTimer').classList.toggle('on',$('#timer').classList.contains('show'));};
  $('#tClose').onclick=()=>{$('#timer').classList.remove('show');$('#bTimer').classList.remove('on');};
  $$('#timer [data-s]').forEach(b=>b.onclick=()=>{total=left=+b.dataset.s; if(h){clearInterval(h);h=null;$('#tGo').textContent='▶ Start';} show();});
  $('#tGo').onclick=()=>{ if(h){clearInterval(h);h=null;$('#tGo').textContent='▶ Start';return;} if(left===0) left=total; $('#tGo').textContent='⏸ Pause';
    h=setInterval(()=>{left--; if(left<=5&&left>0) SND.tick(); show(); if(left<=0){clearInterval(h);h=null;$('#tGo').textContent='▶ Start';SND.unlock();}},1000); };
  $('#tReset').onclick=()=>{ if(h){clearInterval(h);h=null;} left=total; $('#tGo').textContent='▶ Start'; show(); };
  show();
})();

/* Whiteboard */
const WB=(()=>{ const cv=$('#wb'), bar=$('#wbbar'), wrap=$('#stage'), inner=$('#stageInner'), ctx=cv.getContext('2d');
  let open=false, mode='annotate', tool='pen', color='#1a1a1a', size=6, cur=null; const pages={};
  const key=()=>S.phase+':'+mode; const strokes=()=>pages[key()]||(pages[key()]=[]);
  function fit(){ if(!open) return; const w=wrap.clientWidth, h=Math.max(wrap.clientHeight, inner.offsetTop+inner.offsetHeight+60); const d=Math.min(devicePixelRatio||1,1.5);
    if(cv.style.width===w+'px'&&cv.style.height===h+'px') return; cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=Math.round(w*d); cv.height=Math.min(Math.round(h*d),16000); ctx.setTransform(d,0,0,d,0,0); redraw(); }
  if(window.ResizeObserver) new ResizeObserver(()=>fit()).observe(inner);
  function drawStroke(s){ if(s.tool==='text'){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.fillStyle=s.color; ctx.font=`700 ${s.size*4+14}px "Baloo 2", sans-serif`; ctx.fillText(s.text,s.x,s.y); return; }
    ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over'; ctx.globalAlpha=s.tool==='hl'?.35:1; ctx.strokeStyle=s.color; ctx.lineWidth=s.tool==='hl'?s.size*3.5:(s.tool==='eraser'?s.size*4:s.size); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(s.pts.length===1) ctx.lineTo(s.pts[0][0]+.1,s.pts[0][1]); ctx.stroke(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); if(!open) return; strokes().forEach(drawStroke); }
  const pos=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{ if(tool==='hand') return; if(tool==='text'){ placeText(pos(e)); return; } cv.setPointerCapture(e.pointerId); cur={tool,color,size,pts:[pos(e)]}; strokes().push(cur); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; cur.pts.push(pos(e)); redraw(); });
  const end=()=>{cur=null;}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  function placeText([x,y]){ const t=document.createElement('div'); t.className='wbtext'; t.contentEditable='true'; t.style.left=x+'px'; t.style.top=(y-22)+'px'; t.style.color=color; wrap.appendChild(t); setTimeout(()=>t.focus(),10);
    const commit=()=>{ const txt=t.innerText.trim(); if(txt) strokes().push({tool:'text',color,size,text:txt,x,y:y+8}); t.remove(); redraw(); };
    t.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();t.blur();} if(ev.key==='Escape'){t.innerText='';t.blur();} }); t.addEventListener('blur',commit,{once:true}); }
  function setOpen(v){ open=v; cv.classList.toggle('show',v); bar.classList.toggle('show',v); $('#bWB').classList.toggle('on',v); cv.classList.toggle('board',mode==='board'); cv.style.width=''; if(v) fit(); else ctx.clearRect(0,0,cv.width,cv.height); }
  $('#bWB').onclick=()=>{ setOpen(!open); SND.click(); };
  $('#wbClose').onclick=()=>setOpen(false);
  $$('#wbbar [data-tool]').forEach(b=>b.onclick=()=>{ tool=b.dataset.tool; $$('#wbbar [data-tool]').forEach(x=>x.classList.toggle('on',x===b)); cv.classList.toggle('pass',tool==='hand'); cv.style.cursor=tool==='text'?'text':'crosshair'; });
  $$('#wbbar [data-c]').forEach(b=>b.onclick=()=>{ color=b.dataset.c; $$('#wbbar [data-c]').forEach(x=>x.classList.toggle('on',x===b)); if(tool==='eraser'||tool==='hand'){ $$('#wbbar [data-tool]')[0].click(); } });
  $$('#wbbar [data-size]').forEach(b=>b.onclick=()=>{ size=+b.dataset.size; $$('#wbbar [data-size]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#wbMode').onclick=()=>{ mode=mode==='annotate'?'board':'annotate'; $('#wbMode').textContent=mode==='board'?'🎬 Draw on activity':'📋 Blank board'; cv.classList.toggle('board',mode==='board'); if(mode==='board'&&tool==='hand') $$('#wbbar [data-tool]')[0].click(); redraw(); };
  $('#wbUndo').onclick=()=>{ strokes().pop(); redraw(); };
  $('#wbClear').onclick=()=>{ pages[key()]=[]; redraw(); };
  addEventListener('resize',()=>{ if(open) fit(); });
  $('#stage').addEventListener('scroll',()=>{},{passive:true});
  return{redraw(){ cv.style.width=''; fit(); redraw(); },clearAll(){Object.keys(pages).forEach(k=>delete pages[k]);redraw();}};
})();

/* Enter in an answer box presses the next button in the same row */
document.addEventListener('keydown',e=>{ const t=e.target; if(e.key!=='Enter'||!(t instanceof HTMLInputElement)||!t.classList.contains('in')) return;
  const row=t.closest('.row'); if(!row) return; const btn=[...row.querySelectorAll('button')].find(b=>t.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING&&!b.disabled);
  if(btn){ e.preventDefault(); btn.click(); } });
/* keyboard: Esc closes overlays */
addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#badgeOv').classList.remove('show'); $('#chap').classList.remove('show'); } });
document.addEventListener('pointerdown',()=>{},{once:true});

renderAll();
if(S.phase===0 && !S.agent) chapter(0);
})();
</script>
