<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mystery Math Market · MyMasteryLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00A7B2; --teal-d:#00928e; --teal-m:#32cdc8; --teal-l:#E6F7F8;
  --orange:#FAA71C; --orange-l:#FFF4E0; --burnt:#D77F28; --crimson:#C92426; --crimson-l:#fdecec;
  --ink:#1A1A1A; --muted:#55636b; --line:#d6e7e9; --white:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--white)}
body{height:100%;margin:0;background:var(--white);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hidden{display:none!important}

/* ---------- APP GRID ---------- */
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}

/* ---------- TOP BAR ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--white);border-bottom:3px solid var(--teal);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);white-space:nowrap}
.brand span{color:var(--orange)}
.shop-sign{font-family:var(--display);font-weight:800;font-size:20px;color:var(--white);background:var(--burnt);padding:2px 18px;border-radius:8px;box-shadow:0 3px 0 #a85f1c;position:relative;white-space:nowrap;max-width:32vw;overflow:hidden;text-overflow:ellipsis}
.shop-sign::before,.shop-sign::after{content:"";position:absolute;top:-10px;width:2px;height:10px;background:var(--burnt)}
.shop-sign::before{left:14px}.shop-sign::after{right:14px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--orange-l);border:2px solid var(--orange);border-radius:999px;padding:3px 6px 3px 10px;font-weight:800}
.pill.teal{background:var(--teal-l);border-color:var(--teal)}
.mini{border:0;background:var(--white);border-radius:999px;width:28px;height:28px;font-weight:800;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mini:hover{background:var(--orange)}
.vault-mini{display:flex;gap:4px}
.vault-mini b{width:26px;height:30px;border-radius:6px;background:var(--ink);color:var(--orange);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.vault-mini b.got{background:var(--teal);color:var(--white);animation:pop .5s}
.timer{font-family:var(--display);font-size:20px;min-width:52px;text-align:center}
.timer.alarm{color:var(--crimson);animation:blink .6s steps(2) 6}
.tbtn{border:2px solid var(--teal);background:var(--white);border-radius:10px;padding:5px 12px;font-weight:800}
.tbtn:hover{background:var(--teal-l)}
.tbtn.on{background:var(--teal);color:var(--white)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}

/* ---------- TRAIL (price tags on a string) ---------- */
.trail{position:relative;padding:14px 16px 8px;overflow-x:auto;background:linear-gradient(var(--white),var(--teal-l))}
.trail-row{display:flex;gap:10px;min-width:max-content;position:relative;padding-top:6px}
.trail-row::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(90deg,var(--burnt) 0 10px,transparent 10px 16px)}
.tag{position:relative;border:0;background:var(--white);border:2px solid var(--line);border-radius:6px 6px 14px 14px;padding:14px 12px 6px;min-width:108px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.1;color:var(--muted);transform-origin:top center}
.tag::before{content:"";position:absolute;top:-8px;left:50%;width:2px;height:10px;background:var(--burnt)}
.tag::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;border:2px solid var(--burnt);background:var(--white)}
.tag .ico{font-size:20px;display:block}
.tag .st{font-family:var(--body);font-size:11px;font-weight:800;display:block;margin-top:2px}
.tag.locked{opacity:.55;cursor:not-allowed}
.tag.open{border-color:var(--teal);color:var(--ink)}
.tag.done{background:var(--teal);border-color:var(--teal);color:var(--white)}
.tag.now{background:var(--orange);border-color:var(--burnt);color:var(--ink);transform:rotate(-3deg) scale(1.06);box-shadow:0 6px 0 rgba(215,127,40,.35)}

/* ---------- STAGE ---------- */
.stage-wrap{position:relative;min-height:0;display:flex;flex-direction:column}
.awning{height:44px;flex:none;background:repeating-linear-gradient(90deg,var(--teal) 0 44px,var(--white) 44px 88px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;
  background:radial-gradient(circle at 22px 0,var(--teal) 21px,transparent 22px) 0 0/88px 16px repeat-x,
             radial-gradient(circle at 66px 0,#eaf7f8 21px,transparent 22px) 0 0/88px 16px repeat-x}
.awning .title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--white);padding:0 18px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);box-shadow:0 3px 0 var(--teal-d);white-space:nowrap}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:0;padding-top:18px}
.story{border-right:2px dashed var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;background:var(--white)}
.speaker{display:flex;align-items:flex-end;gap:10px}
.speaker .art{width:120px;height:140px;flex:none}
.speaker .who{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.speaker .who small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.bubble{position:relative;background:var(--teal-l);border:3px solid var(--teal);border-radius:18px;padding:12px 14px;font-size:18px;font-weight:700;min-height:92px}
.bubble::before{content:"";position:absolute;top:-14px;left:42px;border:12px solid transparent;border-bottom-color:var(--teal);border-top:0}
.bubble.penny{background:var(--crimson-l);border-color:var(--crimson)}
.bubble.penny::before{border-bottom-color:var(--crimson)}
.bubble.captain{background:var(--orange-l);border-color:var(--burnt)}
.bubble.captain::before{border-bottom-color:var(--burnt)}
.dlg-nav{display:flex;align-items:center;gap:8px}
.dlg-nav button{border:2px solid var(--teal);background:var(--white);border-radius:10px;padding:4px 12px;font-weight:800}
.dlg-nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange)}
.todo{border:3px solid var(--orange);background:var(--orange-l);border-radius:16px;padding:10px 12px}
.todo h4{margin:0 0 6px;font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;align-items:center}
.todo h4 small{font-family:var(--body);font-size:12px;background:var(--white);border-radius:999px;padding:1px 9px;border:2px solid var(--orange)}
.todo ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.todo li button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;border:2px solid transparent;background:var(--white);border-radius:10px;padding:5px 8px;font-weight:800;font-size:14px}
.todo li button:hover{border-color:var(--teal)}
.todo li .ck{width:22px;height:22px;flex:none;border-radius:50%;border:2.5px dashed var(--burnt);display:grid;place-items:center;font-size:13px}
.todo li.done button{background:transparent;color:var(--muted);text-decoration:line-through;cursor:default}
.todo li.done .ck{background:var(--teal);border:2.5px solid var(--teal);color:var(--white)}
.todo li .go{margin-left:auto;color:var(--teal-d);font-size:12px}
.todo.complete{border-color:var(--teal);background:var(--teal-l)}
.todo .earlier{margin-top:8px;padding-top:6px;border-top:2px dashed var(--orange);font-size:13px}
.todo .earlier button{border:0;background:var(--crimson);color:var(--white);border-radius:8px;padding:2px 8px;font-weight:800;font-size:12px;margin:2px 4px 2px 0}
.unlock-banner{display:flex;align-items:center;gap:10px;background:var(--teal);color:var(--white);border-radius:14px;padding:8px 12px;font-family:var(--display);font-weight:800;font-size:17px;animation:pop .4s}
.unlock-banner button{margin-left:auto;border:0;border-radius:10px;background:var(--orange);color:var(--ink);font-weight:800;padding:6px 12px;box-shadow:0 3px 0 var(--burnt)}
.flash{animation:flash 1.6s ease 1;border-radius:12px}
@keyframes flash{0%,60%{box-shadow:0 0 0 5px var(--orange),0 0 0 10px rgba(250,167,28,.35)}100%{box-shadow:none}}
.tag .prog{display:block;height:5px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden}
.tag .prog i{display:block;height:100%;background:var(--orange)}
.cast{margin-top:auto;border-top:2px solid var(--line);padding-top:10px}
.cast h4{margin:0 0 6px;font-family:var(--display);font-size:15px}
.cast-row{display:flex;gap:6px;flex-wrap:wrap}
.cast-row button{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:2px;width:52px;height:60px}
.cast-row button:hover{border-color:var(--orange)}
.cast-row svg{width:100%;height:100%}

.activity{overflow:auto;padding:16px 22px 40px;min-height:0}
.act-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.act-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.act-head .goal{color:var(--muted);font-weight:700}
.card{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px;position:relative}
.card.teal{border-color:var(--teal);background:var(--teal-l)}
.card.orange{border-color:var(--orange);background:var(--orange-l)}
.card.crimson{border-color:var(--crimson);background:var(--crimson-l)}
.card h3{margin:0 0 8px;font-family:var(--display);font-size:21px;line-height:1.15;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--teal);color:var(--white);border-radius:8px;padding:0 8px;font-size:15px}
.card p{margin:.3em 0 .6em;max-width:72ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-family:var(--display);font-size:22px;font-weight:800}
.muted{color:var(--muted)}
.tip{font-size:14px;color:var(--muted);font-weight:700}

/* inputs & answers */
.field{border:2px solid var(--teal);border-radius:10px;padding:8px 10px;background:var(--white);font-weight:700;min-width:0}
textarea.field{width:100%;resize:vertical;min-height:58px}
.ans{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0}
.ans input{border:3px dashed var(--orange);border-radius:10px;padding:6px 8px;text-align:center;font-family:var(--display);font-size:22px;font-weight:800;background:var(--white);height:46px}
.ans .pre,.ans .post{font-family:var(--display);font-size:20px;font-weight:800}
.ans.is-ok input{border-style:solid;border-color:var(--teal);background:var(--teal-l)}
.chk{border:0;background:var(--teal);color:var(--white);font-weight:800;border-radius:10px;padding:10px 14px}
.chk:hover{background:var(--teal-d)}
.ans.is-ok .chk{background:var(--teal-l);color:var(--teal-d)}
.fb{font-weight:800;font-size:15px}
.fb.good{color:var(--teal-d)}
.fb.bad{color:var(--crimson)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tAns{display:none;background:var(--ink);color:var(--orange);border-radius:6px;padding:1px 7px;font-size:13px;font-weight:800}
body.teacher .tAns{display:inline-block}
.choice{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{border:3px solid var(--line);background:var(--white);border-radius:12px;padding:8px 14px;font-weight:800;font-size:16px}
.opt:hover{border-color:var(--orange)}
.opt.right{background:var(--teal);border-color:var(--teal);color:var(--white)}
.opt.wrong{border-color:var(--crimson);background:var(--crimson-l)}
body.teacher .opt.tRight:not(.right){box-shadow:0 0 0 3px var(--ink) inset}
.opt:disabled{cursor:default}

/* coins */
.coin{border:0;background:none;padding:0;display:inline-grid;place-items:center;position:relative;vertical-align:middle}
.coin svg{display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.coin-shelf{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:10px;background:var(--white);border-radius:12px;border:2px dashed var(--line)}
.coin-shelf .coin.picked svg{filter:drop-shadow(0 0 0 var(--teal)) drop-shadow(0 0 6px var(--teal))}
.tray{min-height:84px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:3px dashed var(--teal);border-radius:14px;background:var(--teal-l)}
.tray:empty::before{content:"Tap coins to drop them in the tray";color:var(--muted);font-weight:700}
.ways{display:flex;gap:10px;flex-wrap:wrap}
.way{background:var(--white);border:2px solid var(--teal);border-radius:12px;padding:6px 10px;font-weight:800}
.pocket{border:3px solid var(--burnt);border-radius:10px 10px 40px 40px;background:var(--orange-l);padding:12px;min-height:110px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}

/* market shelf / price tags */
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:18px 10px 12px;background:linear-gradient(transparent calc(100% - 12px),var(--burnt) 0);border-radius:10px}
.item{border:0;background:var(--white);border:2px solid var(--line);border-radius:14px;padding:10px 6px 8px;text-align:center;position:relative}
.item .em{font-size:40px;line-height:1.1;display:block}
.item .nm{font-weight:800;font-size:14px;display:block}
.item .pr{display:inline-block;margin-top:4px;background:var(--orange);color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;padding:0 12px;border-radius:4px 14px 14px 4px;position:relative}
.item .pr::before{content:"";position:absolute;left:-6px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--white);transform:translate(8px,-50%)}
.item.sel{border-color:var(--teal);background:var(--teal-l);box-shadow:0 0 0 3px var(--teal)}
button.item:hover{border-color:var(--orange)}

/* three questions */
.qcard{border:0;border-radius:18px;padding:16px;text-align:left;min-height:190px;color:var(--ink);position:relative;perspective:800px}
.qcard .face{font-size:52px}
.qcard .q{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.qcard .op{font-family:var(--display);font-size:26px;font-weight:800;margin-top:6px}
.qcard .why{font-weight:700;margin-top:4px}
.qcard.c1{background:var(--teal-l);border:3px solid var(--teal)}
.qcard.c2{background:var(--orange-l);border:3px solid var(--orange)}
.qcard.c3{background:var(--crimson-l);border:3px solid var(--crimson)}
.qcard .reveal{display:none}
.qcard.flipped .reveal{display:block;animation:pop .35s}
.qcard .hint{font-size:13px;color:var(--muted);font-weight:800;margin-top:8px}
.qcard.flipped .hint{display:none}
.story-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:2px dashed var(--line)}
.story-row:last-child{border-bottom:0}
.story-row .num{width:30px;height:30px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:800}
.clue{width:9em}

/* freeze */
.freeze{display:grid;place-items:center;text-align:center;min-height:260px;border-radius:22px;background:var(--orange-l);border:4px dashed var(--orange);padding:18px}
.freeze .word{font-family:var(--display);font-size:clamp(48px,9vw,110px);font-weight:800;line-height:1}
.freeze .move{font-size:22px;font-weight:800}
.freeze .fx{font-size:70px}

/* number line */
.nl{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:6px 8px;margin:8px 0}
.nl svg{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair}
.nl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nl-tools button{border:2px solid var(--teal);background:var(--white);border-radius:8px;padding:3px 10px;font-weight:800;font-size:14px}
.hopchips{display:flex;gap:6px;flex-wrap:wrap}
.hopchips b{background:var(--orange);border-radius:999px;padding:1px 10px;font-family:var(--display)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.step{background:var(--white);border:2px solid var(--teal);border-radius:14px;padding:10px 12px;font-weight:700;position:relative;padding-top:26px}
.step::before{counter-increment:s;content:"Step " counter(s);position:absolute;top:-2px;left:-2px;background:var(--teal);color:var(--white);font-family:var(--display);font-weight:800;padding:0 10px;border-radius:12px 0 12px 0;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:6px 12px;font-weight:800}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.tabs button.ok::after{content:" ✓";color:var(--teal)}
.tabs button.on.ok::after{color:var(--orange)}

/* receipts */
.receipt{background:var(--white);border:2px solid var(--line);border-radius:6px;padding:12px 14px 16px;font-family:"Courier New",ui-monospace,monospace;font-weight:700;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x}
.receipt h5{margin:0 0 6px;font-family:var(--display);font-size:17px;text-align:center}
.receipt .ln{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.receipt.flag{background:var(--crimson-l)}
.receipt.okr{background:var(--teal-l)}
.receipt .stamp{position:absolute;right:10px;top:8px;font-family:var(--display);font-size:22px;color:var(--crimson);transform:rotate(12deg)}

/* customers */
.cust{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;background:var(--white);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.cust svg{width:70px;height:82px}
.minishelf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.minishelf .opt{padding:4px 10px;font-size:14px}

/* lightning */
.till{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.till-screen{background:var(--ink);color:var(--orange);border-radius:16px;padding:16px;font-family:var(--display);text-align:center}
.till-screen .t{font-size:54px;line-height:1}
.till-card{border:4px solid var(--teal);border-radius:16px;padding:16px;text-align:center;background:var(--teal-l)}
.till-card .q{font-family:var(--display);font-size:30px;font-weight:800}
.till-card input{font-family:var(--display);font-size:34px;width:3.5em;text-align:center;border:3px dashed var(--orange);border-radius:12px;font-weight:800}
.scores{display:flex;gap:10px;justify-content:center;margin-top:10px}
.scores span{background:var(--white);color:var(--ink);border-radius:10px;padding:4px 12px;font-size:18px}

/* home shop */
.hslot{background:var(--white);border:3px dashed var(--orange);border-radius:16px;padding:12px;text-align:center}
.hslot .em{font-size:46px;display:block}
.emo-row{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.emo-row button{border:0;background:none;font-size:22px;border-radius:8px;padding:2px}
.emo-row button.on{background:var(--orange-l);box-shadow:0 0 0 2px var(--orange)}
.note{border:0;border-radius:8px;padding:10px 16px;font-family:var(--display);font-size:22px;font-weight:800;background:var(--teal);color:var(--white);box-shadow:0 3px 0 var(--teal-d)}
.note.orange{background:var(--orange);color:var(--ink);box-shadow:0 3px 0 var(--burnt)}
.log{font-weight:700}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}

/* vault */
.vault{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.safe{width:230px;height:230px;border-radius:22px;background:#7d8b91;position:relative;box-shadow:inset 0 0 0 10px #5d6a70, 0 8px 0 #3f4a4f;perspective:900px}
.door{position:absolute;inset:14px;border-radius:14px;background:linear-gradient(145deg,#aab6bb,#86949a);transform-origin:left center;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1);display:grid;place-items:center;z-index:2;backface-visibility:hidden}
.door .dial{width:92px;height:92px;border-radius:50%;background:radial-gradient(var(--white) 0 18%,var(--ink) 19% 23%,#c8d1d4 24%);border:6px solid var(--ink);transition:transform 1s}
.safe.open .door{transform:rotateY(-105deg)}
.safe.open .door .dial{transform:rotate(360deg)}
.inside{position:absolute;inset:14px;border-radius:14px;background:var(--ink);display:grid;place-items:center;text-align:center;color:var(--orange);font-family:var(--display);font-weight:800;font-size:18px;z-index:1}
.inside .gold{font-size:64px;line-height:1}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keypad button{height:56px;border:0;border-radius:12px;background:var(--teal-l);font-family:var(--display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--teal)}
.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal)}
.code{display:flex;gap:8px;margin-bottom:10px}
.code b{width:56px;height:66px;border-radius:12px;background:var(--ink);color:var(--orange);display:grid;place-items:center;font-family:var(--display);font-size:38px}
.badge{display:grid;place-items:center;text-align:center;padding:18px;border-radius:50%;width:230px;height:230px;margin:auto;color:var(--white);font-family:var(--display);font-weight:800;box-shadow:0 0 0 8px var(--white),0 0 0 12px var(--orange);animation:pop .6s}
.badge .l1{font-size:15px}.badge .l2{font-size:30px;line-height:1}.badge .l3{font-size:14px}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf button{width:56px;height:56px;border-radius:14px;border:3px solid var(--line);background:var(--white);font-family:var(--display);font-size:26px;font-weight:800}
.conf button.on{background:var(--orange);border-color:var(--burnt)}
.pred{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:2px dashed var(--line)}
.pred:last-child{border-bottom:0}
.pred .pic{font-size:44px;text-align:center}
table.rev{width:100%;border-collapse:collapse}
table.rev th{background:var(--teal);color:var(--white);text-align:left;padding:8px;font-family:var(--display)}
table.rev td{border-bottom:2px dashed var(--line);padding:8px;vertical-align:top}
.reward{border:3px solid var(--line);background:var(--white);border-radius:14px;padding:10px;text-align:left;font-weight:800}
.reward.sel{border-color:var(--orange);background:var(--orange-l)}
.reward .cost{float:right;background:var(--orange);border-radius:999px;padding:0 10px}

/* ---------- FOOTER ---------- */
.foot{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:3px solid var(--line);background:var(--white);flex-wrap:wrap}
.progress{flex:1;display:flex;align-items:center;gap:10px;min-width:220px}
.bar{flex:1;height:14px;background:var(--teal-l);border-radius:999px;overflow:hidden;border:2px solid var(--teal)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--orange) 0 10px,var(--burnt) 10px 20px);transition:width .5s}
.status{font-weight:800}
.navbtn{border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px}
.navbtn.back{background:var(--teal-l);color:var(--ink)}
.navbtn.next{background:var(--orange);color:var(--ink);box-shadow:0 4px 0 var(--burnt)}
.navbtn.next:disabled{background:#eceff0;color:#8a969c;box-shadow:none;cursor:not-allowed}
.navbtn.next.ready{animation:nudge 1.4s infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.navbtn.force{background:var(--ink);color:var(--orange)}

/* ---------- TEACHER PANEL ---------- */
.tpanel{position:fixed;right:14px;top:120px;width:300px;max-height:calc(100% - 140px);overflow:auto;background:var(--ink);color:var(--white);border-radius:16px;padding:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tpanel h4{margin:0 0 8px;font-family:var(--display);font-size:18px;color:var(--orange)}
.tpanel label{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:700;font-size:14px}
.tpanel .tp-btn{display:block;width:100%;margin:6px 0;border:0;border-radius:10px;padding:8px;font-weight:800;background:var(--teal);color:var(--white);text-align:left}
.tpanel .tp-btn.warn{background:var(--crimson)}
.tpanel select{width:100%;border-radius:8px;padding:6px;border:0;color:var(--ink)}
.tpanel .notes{background:#2a2a2a;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.4}
.tpanel .notes b{color:var(--orange)}

/* ---------- WHITEBOARD ---------- */
.wb-fab{border:0;border-radius:12px;padding:10px 18px;background:var(--teal);color:var(--white);font-weight:800;font-size:16px;box-shadow:0 5px 0 var(--teal-d)}
.wb{position:absolute;inset:0;z-index:20}
.wb.board{background:var(--white)}
.wb canvas{position:absolute;inset:0;width:100%;height:100%}
.wb #wbInk{touch-action:none;cursor:crosshair}
.wb-bar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--white);border:3px solid var(--teal);border-radius:16px;padding:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:calc(100% - 16px)}
.wb-bar button{border:2px solid transparent;background:var(--teal-l);border-radius:10px;min-width:38px;height:38px;font-weight:800;font-size:15px;padding:0 8px}
.wb-bar button.on{border-color:var(--ink);background:var(--orange)}
.wb-bar .sw{width:28px;min-width:28px;height:28px;border-radius:50%;padding:0;border:3px solid var(--white);box-shadow:0 0 0 2px var(--line)}
.wb-bar .sw.on{box-shadow:0 0 0 3px var(--ink)}
.wb-bar .sep{width:2px;height:28px;background:var(--line)}
.wb-bar select{border:2px solid var(--teal);border-radius:8px;height:38px;padding:0 6px;font-weight:700}
.wb-text{position:absolute;z-index:4;border:2px dashed var(--orange);background:rgba(255,255,255,.9);font-family:var(--display);font-weight:700;padding:2px 6px;min-width:120px}
.wb-close{background:var(--ink)!important;color:var(--white)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:var(--orange);font-family:var(--display);font-size:28px;font-weight:800;padding:14px 26px;border-radius:18px;z-index:70;animation:pop .4s;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .story{border-right:0;border-bottom:2px dashed var(--line)}
  .speaker .art{width:84px;height:98px}
  .cast{display:none}
  .till{grid-template-columns:1fr}
  .vault{grid-template-columns:1fr;justify-items:center}
  .tpanel{left:10px;right:10px;width:auto}
  .shop-sign{max-width:60vw}
  .stage{overflow:auto;grid-template-rows:auto auto}
  .activity{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">MyMastery<span>Lab</span></div>
    <div class="shop-sign" id="shopSign">The Mystery Math Market</div>

  </header>

  <nav class="trail" aria-label="Lesson stops"><div class="trail-row" id="trail"></div></nav>

  <main class="stage-wrap" id="stageWrap">
    <div class="awning"><div class="title" id="stageTitle">Welcome</div></div>
    <div class="stage">
      <aside class="story">
        <div class="speaker"><div class="art" id="spkArt"></div><div class="who" id="spkName"></div></div>
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <div class="dlg-nav"><button id="dlgPrev" aria-label="Previous story line">◀</button><div class="dots" id="dots"></div><button id="dlgNext" aria-label="Next story line">▶</button></div>
        <div id="unlockBanner"></div><div class="todo" id="todo"></div>
        <div class="cast"><h4>Meet the cast</h4><div class="cast-row" id="cast"></div></div>
      </aside>
      <section class="activity" id="activity"></section>
    </div>
    <div class="wb hidden" id="wb">
      <canvas id="wbBg"></canvas><canvas id="wbInk"></canvas>
      <div class="wb-bar" id="wbBar"></div>
      <input class="wb-text hidden" id="wbText" placeholder="Type, then Enter">
    </div>
  </main>

  <footer class="foot">
    <button class="navbtn back" id="backBtn">◀ Back</button>
    <button class="wb-fab" id="wbFab">✏️ Whiteboard</button>
    <div class="progress"><div class="bar"><i id="barFill" style="width:0"></i></div><span class="status" id="status"></span></div>
    <button class="navbtn force hidden" id="forceBtn">Teacher unlock</button>
    <button class="navbtn next" id="nextBtn">Unlock next stop ▶</button>
  </footer>
</div>


<aside class="tpanel hidden" id="tpanel" aria-label="Teacher controls">
  <h4 style="display:flex;justify-content:space-between;align-items:center">👩‍🏫 Teacher controls <button type="button" id="tpHide" class="mini" aria-label="Hide panel" style="color:#1A1A1A">✕</button></h4>
  <label>Unlocking <select id="optUnlock"><option value="auto">🔓 Auto-unlock when every task is done</option><option value="teacher">👩‍🏫 Teacher unlocks each stop</option></select></label>
  <label><input type="checkbox" id="optStretch"> Stretch mode (within 100, cents/pence)</label>
  <label>Currency <select id="optCur"><option value="US">US ($, ¢)</option><option value="UK">UK (£, p)</option><option value="EU">Euro (€, c)</option></select></label>
  <label>Jump to stop <select id="optJump"></select></label>
  <button class="tp-btn" id="tpComplete">✓ Mark this stop complete</button>
  <button class="tp-btn" id="tpUnlockAll">🔓 Unlock every stop</button>
  <div class="notes" id="tpNotes"></div>
  <button class="tp-btn warn" id="tpReset">↺ Reset the whole lesson</button>
  <p class="tip" style="color:#9fb">Answers show as black tags while teacher mode is on. Shortcut: Shift + T.</p>
</aside>

<script>
/* ================= STATE ================= */
const KEY='mml-mystery-market-v1';
const fresh=()=>({phase:0,unlocked:0,forced:{},ok:{},val:{},coins:0,vault:[null,null,null],shopName:'',learner:'',theme:'',cur:'US',
  conf1:0,conf2:0,preds:['','',''],m10:[],tray:[],hops:{},lt:[],home:[{n:'',e:'🧸',p:''},{n:'',e:'📚',p:''},{n:'',e:'✏️',p:''}],
  hlog:[],rewards:[],badgeColor:'#00A7B2',product:'',unlockMode:'auto',stretch:false,mute:false,dlg:{},wb:{over:{},board:[[]],page:0,bg:'grid'},eTab:0,dTab:0,cFlip:[]});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(fresh(),s)}catch(e){}
if(!Array.isArray(S.lt)||S.lt.some(r=>typeof r!=='object'))S.lt=[];
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM={US:'$',UK:'£',EU:'€'}, SMALL={US:'¢',UK:'p',EU:'c'};
const m=n=>SYM[S.cur]+n;                        // whole amounts
const sm=n=>S.cur==='US'?n+'¢':n+SMALL[S.cur]; // coin amounts
const shop=()=>S.shopName.trim()||'the Mystery Math Market';

/* ================= SOUND ================= */
let ac;function tone(seq){if(S.mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
  seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d*.85})}catch(e){}}
const sGood=()=>tone([[660,.12],[880,.18]]), sBad=()=>tone([[220,.18,'square']]), sCoin=()=>tone([[988,.08],[1319,.2]]),
      sFan=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.35]]), sSquawk=()=>tone([[1200,.06,'sawtooth'],[900,.08,'sawtooth'],[1300,.1,'sawtooth']]);

/* ================= CHARACTERS ================= */
const skin='#E3A777', skin2='#B97A4E', skin3='#F2C9A0';
const CH={
 mo:{name:'Mo',role:'The shopkeeper',cls:'',svg:`<svg viewBox="0 0 120 140" role="img" aria-label="Mo the shopkeeper">
  <path d="M14 140 Q16 96 60 92 Q104 96 106 140Z" fill="#00A7B2"/><path d="M40 98 L60 120 L80 98" fill="#fff"/>
  <rect x="44" y="112" width="32" height="28" rx="4" fill="#FAA71C"/><rect x="50" y="118" width="20" height="10" rx="3" fill="#D77F28"/>
  <circle cx="60" cy="58" r="31" fill="${skin}"/><circle cx="29" cy="62" r="6" fill="${skin}"/><circle cx="91" cy="62" r="6" fill="${skin}"/>
  <path d="M28 46 Q60 6 92 46Z" fill="#FAA71C"/><rect x="24" y="42" width="72" height="9" rx="4.5" fill="#D77F28"/><circle cx="60" cy="22" r="5" fill="#C92426"/>
  <circle cx="49" cy="60" r="4" fill="#1A1A1A"/><circle cx="71" cy="60" r="4" fill="#1A1A1A"/><circle cx="50.5" cy="58.5" r="1.3" fill="#fff"/><circle cx="72.5" cy="58.5" r="1.3" fill="#fff"/>
  <path d="M42 74 Q51 68 60 73 Q69 68 78 74 Q69 80 60 76 Q51 80 42 74Z" fill="#4a2e1a"/><path d="M52 81 Q60 87 68 81" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="70" r="5" fill="#C92426" opacity=".25"/><circle cx="80" cy="70" r="5" fill="#C92426" opacity=".25"/></svg>`},
 penny:{name:'Penny',role:'Mo\'s cheeky parrot',cls:'penny',svg:`<svg viewBox="0 0 120 140" role="img" aria-label="Penny the parrot">
  <path d="M52 112 L40 140 L56 132 L60 140 L66 130 L80 138 L70 110Z" fill="#C92426"/>
  <ellipse cx="62" cy="86" rx="30" ry="36" fill="#00A7B2"/><ellipse cx="66" cy="94" rx="17" ry="24" fill="#32cdc8"/>
  <path d="M34 78 Q24 104 44 120 Q52 100 50 82Z" fill="#FAA71C"/><path d="M36 92 Q34 104 44 114" stroke="#D77F28" stroke-width="3" fill="none"/>
  <circle cx="62" cy="44" r="25" fill="#C92426"/><path d="M52 22 Q48 4 60 12 Q62 0 70 12 Q80 6 74 24Z" fill="#FAA71C"/>
  <circle cx="68" cy="40" r="9" fill="#fff"/><circle cx="70" cy="40" r="4.5" fill="#1A1A1A"/><circle cx="71.5" cy="38.5" r="1.4" fill="#fff"/>
  <path d="M78 46 Q98 46 94 62 Q88 56 80 58Z" fill="#1A1A1A"/><path d="M78 46 Q92 44 94 56" fill="#FAA71C"/>
  <path d="M54 120 v8 M70 120 v8" stroke="#D77F28" stroke-width="4" stroke-linecap="round"/></svg>`},
 captain:{name:'Captain Crumbs',role:'A hungry pirate customer',cls:'captain',svg:`<svg viewBox="0 0 120 140" role="img" aria-label="Captain Crumbs the pirate">
  <path d="M14 140 Q16 98 60 94 Q104 98 106 140Z" fill="#C92426"/><circle cx="60" cy="112" r="3" fill="#FAA71C"/><circle cx="60" cy="126" r="3" fill="#FAA71C"/>
  <circle cx="60" cy="62" r="30" fill="${skin3}"/><path d="M32 70 Q34 104 60 104 Q86 104 88 70 Q74 84 60 82 Q46 84 32 70Z" fill="#D77F28"/>
  <path d="M18 40 Q60 -2 102 40 Q60 30 18 40Z" fill="#1A1A1A"/><rect x="26" y="36" width="68" height="8" rx="4" fill="#C92426"/><circle cx="60" cy="24" r="6" fill="#fff"/>
  <path d="M40 54 L80 50" stroke="#1A1A1A" stroke-width="3"/><ellipse cx="70" cy="58" rx="8" ry="7" fill="#1A1A1A"/><circle cx="49" cy="59" r="4" fill="#1A1A1A"/>
  <path d="M50 80 Q60 88 70 80" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`},
 mia:{name:'Mia',role:'Customer',svg:kid('#5a3a22','#FAA71C',skin3,'bun')},
 max:{name:'Max',role:'Customer',svg:kid('#1A1A1A','#00A7B2',skin2,'short')},
 sophie:{name:'Sophie',role:'Customer',svg:kid('#2b1a10','#C92426',skin,'long')}
};
function kid(hair,shirt,sk,style){
  const h= style==='bun'?`<circle cx="60" cy="22" r="12" fill="${hair}"/><path d="M30 56 Q30 24 60 24 Q90 24 90 56 Q80 38 60 38 Q40 38 30 56Z" fill="${hair}"/>`
         : style==='long'?`<path d="M26 96 Q24 26 60 24 Q96 26 94 96 L84 96 Q86 48 60 40 Q34 48 36 96Z" fill="${hair}"/>`
         :`<path d="M30 54 Q28 24 60 24 Q92 24 90 54 Q76 36 60 40 Q44 36 30 54Z" fill="${hair}"/>`;
  return `<svg viewBox="0 0 120 140" role="img"><path d="M18 140 Q20 100 60 96 Q100 100 102 140Z" fill="${shirt}"/>${style==='long'?h:''}
  <circle cx="60" cy="60" r="29" fill="${sk}"/>${style!=='long'?h:h.replace(/.*/,'')+`<path d="M32 56 Q32 26 60 26 Q88 26 88 56 Q74 38 60 42 Q46 38 32 56Z" fill="${hair}"/>`}
  <circle cx="50" cy="62" r="4" fill="#1A1A1A"/><circle cx="70" cy="62" r="4" fill="#1A1A1A"/><path d="M50 76 Q60 84 70 76" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="42" cy="72" r="5" fill="#C92426" opacity=".22"/><circle cx="78" cy="72" r="5" fill="#C92426" opacity=".22"/></svg>`;
}

/* ================= DATA ================= */
const THEMES={
 toy:{label:'Toy Shop',icon:'🧸',items:[['🚀','Rocket'],['🖍️','Crayons'],['⚽','Football'],['⭐','Stickers'],['🪀','Yo-yo'],['🧩','Puzzle']]},
 sweet:{label:'Sweet Shop',icon:'🍭',items:[['🎂','Cake'],['🍭','Lolly'],['🍫','Chocolate box'],['🍬','Sweets'],['🍩','Doughnut'],['🧁','Cupcakes']]},
 pet:{label:'Pet Shop',icon:'🐾',items:[['🐠','Fish tank'],['🦴','Bone'],['🐾','Dog bed'],['🐟','Fish food'],['🎾','Ball'],['🐹','Hamster wheel']]}
};
const PRICES=[9,4,12,3,5,8];
const items=()=>(THEMES[S.theme]||THEMES.toy).items.map((it,i)=>({e:it[0],n:it[1],p:PRICES[i],i}));
const COINS={
 US:[{v:1,mm:19.05,c:'copper',lab:'1¢'},{v:5,mm:21.2,c:'silver',lab:'5¢'},{v:10,mm:17.9,c:'silver',lab:'10¢'},{v:25,mm:24.3,c:'silver',lab:'25¢'}],
 UK:[{v:1,mm:20.3,c:'copper',lab:'1p'},{v:2,mm:25.9,c:'copper',lab:'2p'},{v:5,mm:18,c:'silver',lab:'5p'},{v:10,mm:24.5,c:'silver',lab:'10p'},{v:20,mm:21.4,c:'silver',lab:'20p',sides:7},{v:50,mm:27.3,c:'silver',lab:'50p',sides:7}],
 EU:[{v:1,mm:16.25,c:'copper',lab:'1c'},{v:2,mm:18.75,c:'copper',lab:'2c'},{v:5,mm:21.25,c:'copper',lab:'5c'},{v:10,mm:19.75,c:'gold',lab:'10c'},{v:20,mm:22.25,c:'gold',lab:'20c'},{v:50,mm:24.25,c:'gold',lab:'50c'}]
};
const COL={copper:['#D77F28','#a85f1c'],silver:['#d5dde0','#9aa7ac'],gold:['#FAA71C','#D77F28']};
function coinSVG(c,scale=3.1){const d=c.mm*scale,r=d/2;const [f,s]=COL[c.c];
  let shape;if(c.sides){const pts=[];for(let k=0;k<c.sides;k++){const a=-Math.PI/2+k*2*Math.PI/c.sides;pts.push((r+r*.96*Math.cos(a)).toFixed(1)+','+(r+r*.96*Math.sin(a)).toFixed(1))}shape=`<polygon points="${pts.join(' ')}" fill="${f}" stroke="${s}" stroke-width="3"/>`}
  else shape=`<circle cx="${r}" cy="${r}" r="${r-2}" fill="${f}" stroke="${s}" stroke-width="3"/><circle cx="${r}" cy="${r}" r="${r-8}" fill="none" stroke="${s}" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  return `<svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" aria-label="${c.lab} coin">${shape}<text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="${Math.max(14,d*.3)}" fill="#1A1A1A">${c.lab}</text></svg>`}

 $$('#vaultMini b').forEach((b,i)=>{b.textContent=S.vault[i]??'?';b.classList.toggle('got',S.vault[i]!==null)});
 const p=P[S.phase],done=p.req.filter(k=>S.ok[k]).length,tot=p.req.length,complete=isDone(S.phase),last=S.phase===P.length-1,teacher=document.body.classList.contains('teacher');
 let justUnlocked=false;if(complete&&!last&&S.unlockMode==='auto'&&S.unlocked<=S.phase){S.unlocked=S.phase+1;S['cel'+S.phase]=true;save();justUnlocked=true}
 $('#barFill').style.width=(complete?100:Math.round(done/tot*100))+'%';
 const nb=$('#nextBtn');
 if(last){nb.textContent=complete?'🎉 Lesson complete!':'Finish the vault';nb.disabled=true;nb.classList.remove('ready')}
 else{nb.textContent=S.phase<S.unlocked?'Next stop ▶':'Unlock next stop ▶';const canUnlock=complete&&teacher;nb.disabled=!(canUnlock||S.phase<S.unlocked);nb.classList.toggle('ready',complete&&S.phase>=S.unlocked)}
 $('#status').textContent=complete?(last?'Market Master! Every task finished.':S.phase<S.unlocked?'Stop complete.':!teacher?'Stop complete! Waiting for your teacher to unlock the next stop.':'Stop complete! Unlock the next stop.'):`${done} of ${tot} tasks done · ${tot-done} to go`;
 $('#forceBtn').classList.toggle('hidden',!teacher||complete||last);
 $('#tpNotes').innerHTML=`<b>${p.title} · ${p.time}</b><br>${p.notes}`;
 $('#optJump').innerHTML=P.map((q,i)=>`<option value="${i}" ${i===S.phase?'selected':''}>${q.ico} ${q.title}</option>`).join('');
 HOOKS.__dtabs&&S.phase===4&&HOOKS.__dtabs();HOOKS.__etabs&&S.phase===5&&HOOKS.__etabs();
 if(justUnlocked){sFan();confetti();toast(`⭐ ${p.title} complete!<br><span style="color:#fff;font-size:20px">🔓 ${P[S.phase+1].title} is unlocked!</span>`,2600);chrome();return}
 if(complete&&!S['cel'+S.phase]){S['cel'+S.phase]=true;save();if(!last){sFan();toast(`⭐ ${p.title} complete!${S.unlockMode==='teacher'?'<br><span style="color:#fff;font-size:18px">Your teacher will unlock the next stop</span>':''}`,2400)}}
 renderTodo();
}
function go(i){ltStop();S.phase=i;S.unlocked=Math.max(S.unlocked,S.phase);save();const p=P[i];$('#stageTitle').textContent=`${p.ico} ${p.title}`;
 HOOKS.__dtabs=HOOKS.__etabs=null;$('#activity').innerHTML=p.render();p.mount&&p.mount();$('#activity').scrollTop=0;renderStory();chrome();if(wbOpen)wbResize()}
$('#nextBtn').onclick=()=>{if(S.phase>=P.length-1)return;if(S.phase>=S.unlocked){S.unlocked=S.phase+1;sFan();confetti()}go(S.phase+1)};
$('#backBtn').onclick=()=>{if(S.phase>0)go(S.phase-1)};
$('#forceBtn').onclick=()=>{S.forced[S.phase]=true;S.unlocked=Math.max(S.unlocked,S.phase+1);save();chrome()};
$('#coinPlus').onclick=()=>{S.coins++;save();chrome();sCoin();const r=$('#rCoins');if(r)r.textContent=S.coins};
$('#coinMinus').onclick=()=>{S.coins=Math.max(0,S.coins-1);save();chrome();const r=$('#rCoins');if(r)r.textContent=S.coins};
$('#muteBtn').onclick=()=>{S.mute=!S.mute;$('#muteBtn').textContent=S.mute?'🔇':'🔊';save()};

/* teacher */
function setTeacher(on){document.body.classList.toggle('teacher',on);$('#teacherBtn').classList.toggle('on',on);$('#tpanel').classList.toggle('hidden',!on);chrome()}
$('#tpHide').onclick=()=>$('#tpanel').classList.add('hidden');
$('#teacherBtn').onclick=()=>{const on=document.body.classList.contains('teacher');if(on&&$('#tpanel').classList.contains('hidden')){$('#tpanel').classList.remove('hidden');return}setTeacher(!on)};
document.addEventListener('keydown',e=>{if(e.shiftKey&&(e.key==='T'||e.key==='t')&&!e.target.closest('input,textarea')){e.preventDefault();$('#teacherBtn').click()}});
$('#optUnlock').value=S.unlockMode;$('#optUnlock').onchange=e=>{S.unlockMode=e.target.value;save();chrome()};
$('#optStretch').checked=S.stretch;$('#optStretch').onchange=e=>{S.stretch=e.target.checked;save();if(S.phase===4)go(4)};
$('#optCur').value=S.cur;$('#optCur').onchange=e=>{S.cur=e.target.value;S.tray=[];save();go(S.phase)};
$('#optJump').onchange=e=>go(+e.target.value);
$('#tpComplete').onclick=()=>{S.forced[S.phase]=true;S.unlocked=Math.max(S.unlocked,S.phase+1);save();chrome()};
$('#tpUnlockAll').onclick=()=>{S.unlocked=P.length-1;save();chrome()};
$('#tpReset').onclick=()=>{if(confirm('Reset the whole lesson? All answers, coins and drawings will be cleared.')){const keep={mute:S.mute};S=Object.assign(fresh(),keep);save();go(0);setTeacher(true)}};

/* ================= TIMER ================= */
const timer=(()=>{let len=60,left=60,iv=null;const txt=()=>{const m=Math.floor(left/60),s=left%60;$('#timerTxt').textContent=m+':'+String(s).padStart(2,'0')};
 const stop=()=>{clearInterval(iv);iv=null;$('#timerGo').textContent='▶'};
 const start=()=>{if(iv)return;if(left<=0)left=len;$('#timerTxt').classList.remove('alarm');$('#timerGo').textContent='⏸';iv=setInterval(()=>{left--;txt();if(left<=0){stop();$('#timerTxt').classList.add('alarm');tone([[880,.2],[660,.2],[880,.3]])}},1000)};
 txt();return{set(n){stop();len=left=n;txt()},start,toggle(){iv?stop():start()},cycle(){const o=[30,45,60,120,300];const i=(o.indexOf(len)+1)%o.length;this.set(o[i])}}})();
$('#timerGo').onclick=()=>timer.toggle();$('#timerSet').onclick=()=>timer.cycle();

/* ================= WHITEBOARD ================= */
let wbOpen=false,tool='pen',color='#1A1A1A',size=4,cur=null,redo=[];
const bgC=$('#wbBg'),inkC=$('#wbInk'),bx=bgC.getContext('2d'),ix=inkC.getContext('2d');
const TOOLS=[['pen','✏️','Pen'],['hl','🖍️','Highlighter'],['line','📏','Straight line'],['arrow','➡️','Arrow'],['nl','🔢','Number line (drag)'],['text','🔤','Text'],['erase','🧽','Eraser']];
const COLORS=['#1A1A1A','#00A7B2','#FAA71C','#D77F28','#C92426','#00928e','#FFFFFF'];
function wbBar(){const mode=S.wb.mode||'over';$('#wbBar').innerHTML=
 `<button type="button" data-wm="over" class="${mode==='over'?'on':''}" title="Draw over the lesson">🪟 Over lesson</button><button type="button" data-wm="board" class="${mode==='board'?'on':''}" title="Blank board">⬜ Board</button><span class="sep"></span>`+
 TOOLS.map(t=>`<button type="button" data-tool="${t[0]}" class="${tool===t[0]?'on':''}" title="${t[2]}" aria-label="${t[2]}">${t[1]}</button>`).join('')+'<span class="sep"></span>'+
 COLORS.map(c=>`<button type="button" class="sw ${color===c?'on':''}" data-col="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')+'<span class="sep"></span>'+
 `<select id="wbSize" aria-label="Pen size">${[[2,'Fine'],[4,'Medium'],[8,'Thick'],[14,'Marker']].map(s=>`<option value="${s[0]}" ${size==s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>`+
 (mode==='board'?`<select id="wbBgSel" aria-label="Background">${[['plain','Plain'],['grid','Grid'],['lines','Lines'],['nl20','Number line 0–20'],['nl100','Number line 0–100']].map(b=>`<option value="${b[0]}" ${S.wb.bg===b[0]?'selected':''}>${b[1]}</option>`).join('')}</select><button type="button" id="wbPrev" title="Previous page">◀</button><b>${S.wb.page+1}/${S.wb.board.length}</b><button type="button" id="wbNextP" title="Next or new page">▶</button>`:'')+
 `<span class="sep"></span><button type="button" id="wbUndo" title="Undo">↶</button><button type="button" id="wbRedo" title="Redo">↷</button><button type="button" id="wbClear" title="Clear this page">🗑️</button><button type="button" class="wb-close" id="wbClose">✕ Close</button>`;
 $$('[data-wm]').forEach(b=>b.onclick=()=>{S.wb.mode=b.dataset.wm;save();applyMode()});
 $$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;wbBar()});
 $$('[data-col]').forEach(b=>b.onclick=()=>{color=b.dataset.col;if(tool==='erase')tool='pen';wbBar()});
 $('#wbSize').onchange=e=>size=+e.target.value;
 if($('#wbBgSel'))$('#wbBgSel').onchange=e=>{S.wb.bg=e.target.value;save();drawBg()};
 if($('#wbPrev'))$('#wbPrev').onclick=()=>{if(S.wb.page>0){S.wb.page--;save();wbBar();redraw()}};
 if($('#wbNextP'))$('#wbNextP').onclick=()=>{S.wb.page++;if(!S.wb.board[S.wb.page])S.wb.board.push([]);save();wbBar();redraw()};
 $('#wbUndo').onclick=()=>{const L=layer();if(L.length){redo.push(L.pop());save();redraw()}};
 $('#wbRedo').onclick=()=>{if(redo.length){layer().push(redo.pop());save();redraw()}};
 $('#wbClear').onclick=()=>{const L=layer();if(L.length&&confirm('Clear everything on this page?')){L.length=0;save();redraw()}};
 $('#wbClose').onclick=()=>toggleWB(false)}
function layer(){if((S.wb.mode||'over')==='board'){return S.wb.board[S.wb.page]=S.wb.board[S.wb.page]||[]}return S.wb.over[S.phase]=S.wb.over[S.phase]||[]}
function applyMode(){$('#wb').classList.toggle('board',S.wb.mode==='board');redo=[];wbBar();wbResize()}
function toggleWB(on){wbOpen=on;$('#wb').classList.toggle('hidden',!on);$('#wbFab').textContent=on?'✕ Close board':'✏️ Whiteboard';if(on){if(!S.wb.mode)S.wb.mode='over';applyMode()}}
$('#wbFab').onclick=()=>toggleWB(!wbOpen);
function wbResize(){const r=$('#wb').getBoundingClientRect(),d=devicePixelRatio||1;[bgC,inkC].forEach(c=>{c.width=r.width*d;c.height=r.height*d});bx.setTransform(d,0,0,d,0,0);ix.setTransform(d,0,0,d,0,0);drawBg();redraw()}
addEventListener('resize',()=>{if(wbOpen)wbResize()});
function W(){return inkC.width/(devicePixelRatio||1)}function H(){return inkC.height/(devicePixelRatio||1)}
function drawBg(){const w=W(),h=H();bx.clearRect(0,0,w,h);if(S.wb.mode!=='board')return;bx.fillStyle='#fff';bx.fillRect(0,0,w,h);const bg=S.wb.bg;
 if(bg==='grid'){bx.strokeStyle='#E6F7F8';bx.lineWidth=1.5;for(let x=0;x<w;x+=32){bx.beginPath();bx.moveTo(x,0);bx.lineTo(x,h);bx.stroke()}for(let y=0;y<h;y+=32){bx.beginPath();bx.moveTo(0,y);bx.lineTo(w,y);bx.stroke()}}
 if(bg==='lines'){bx.strokeStyle='#cfe9ec';bx.lineWidth=2;for(let y=90;y<h;y+=46){bx.beginPath();bx.moveTo(0,y);bx.lineTo(w,y);bx.stroke()}bx.strokeStyle='#f6c3c3';bx.beginPath();bx.moveTo(70,0);bx.lineTo(70,h);bx.stroke()}
 if(bg==='nl20'||bg==='nl100')nlDraw(bx,.05*w,h*.72,.95*w,h*.72,bg==='nl20'?20:100,'#1A1A1A',3)}
function nlDraw(c,x1,y1,x2,y2,max=20,col='#1A1A1A',lw=3){const len=Math.hypot(x2-x1,y2-y1);if(len<30)return;c.save();c.translate(x1,y1);c.rotate(Math.atan2(y2-y1,x2-x1));c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';
 c.beginPath();c.moveTo(0,0);c.lineTo(len,0);c.stroke();const n=max===20?20:20,step=max/n;c.font='700 16px "Baloo 2",sans-serif';c.textAlign='center';
 for(let k=0;k<=n;k++){const px=k/n*len;const big=k%5===0;c.beginPath();c.moveTo(px,-(big?12:7));c.lineTo(px,big?12:7);c.stroke();if(max===20||big)c.fillText(Math.round(k*step),px,32)}c.restore()}
function drawStroke(c,s){const w=W(),h=H(),P2=s.pts.map(p=>[p[0]*w,p[1]*h]);c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;c.lineWidth=s.w;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=s.w*4}
 if(s.t==='erase'){c.globalCompositeOperation='destination-out';c.lineWidth=s.w*5}
 if(s.t==='pen'||s.t==='hl'||s.t==='erase'){c.beginPath();P2.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(P2.length===1)c.lineTo(P2[0][0]+.1,P2[0][1]);c.stroke()}
 else if(s.t==='line'||s.t==='arrow'){const [a,b]=[P2[0],P2[P2.length-1]];c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();if(s.t==='arrow'){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=12+s.w*2.5;c.beginPath();c.moveTo(b[0],b[1]);c.lineTo(b[0]-L*Math.cos(ang-.45),b[1]-L*Math.sin(ang-.45));c.lineTo(b[0]-L*Math.cos(ang+.45),b[1]-L*Math.sin(ang+.45));c.closePath();c.fill()}}
 else if(s.t==='nl'){const [a,b]=[P2[0],P2[P2.length-1]];nlDraw(c,a[0],a[1],b[0],b[1],20,s.c,Math.max(2,s.w*.8))}
 else if(s.t==='text'){c.font=`700 ${12+s.w*3}px "Baloo 2",sans-serif`;c.textBaseline='top';c.fillText(s.text,P2[0][0],P2[0][1])}
 c.restore()}
function redraw(){ix.clearRect(0,0,W(),H());layer().forEach(s=>drawStroke(ix,s));if(cur)drawStroke(ix,cur)}
const norm=e=>{const r=inkC.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
inkC.addEventListener('pointerdown',e=>{if(tool==='text'){placeText(e);return}inkC.setPointerCapture(e.pointerId);cur={t:tool,c:color,w:size,pts:[norm(e)]};redraw()});
inkC.addEventListener('pointermove',e=>{if(!cur)return;const p=norm(e);if(['line','arrow','nl'].includes(cur.t))cur.pts[1]=p;else cur.pts.push(p);redraw()});
const endStroke=()=>{if(!cur)return;layer().push(cur);cur=null;redo=[];save();redraw()};
inkC.addEventListener('pointerup',endStroke);inkC.addEventListener('pointercancel',endStroke);
function placeText(e){const t=$('#wbText'),r=$('#wb').getBoundingClientRect();const p=norm(e);t.classList.remove('hidden');t.style.left=(e.clientX-r.left)+'px';t.style.top=(e.clientY-r.top)+'px';t.style.fontSize=(12+size*3)+'px';t.style.color=color;t.value='';setTimeout(()=>t.focus(),0);
 t.onkeydown=ev=>{if(ev.key==='Enter'){if(t.value.trim()){layer().push({t:'text',c:color,w:size,pts:[p],text:t.value});save();redraw()}t.classList.add('hidden')}if(ev.key==='Escape')t.classList.add('hidden')};t.onblur=()=>{setTimeout(()=>t.classList.add('hidden'),100)}}

document.addEventListener('keydown',e=>HOOKS.__vkey&&HOOKS.__vkey(e));
/* ================= START ================= */
$('#muteBtn').textContent=S.mute?'🔇':'🔊';
go(S.phase);
</script>
