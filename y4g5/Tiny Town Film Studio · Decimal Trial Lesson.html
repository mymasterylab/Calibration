<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Town Film Studio · MyMasteryLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00A7B2; --teal-d:#00928e; --teal-l:#E3F6F7; --cyan:#21DED7;
  --orange:#FAA71C; --orange-l:#FEF1DA; --burnt:#D77F28; --crimson:#C92426; --crimson-l:#FBE3E3;
  --ink:#1A1A1A; --paper:#FFFFFF; --muted:#56646b; --line:#d5e2e5;
  --set:#00A7B2; --set-ink:#FFFFFF;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Outfit', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#F4F7F8; --paper:#0f2a2d; --muted:#b9c7cb; --line:#2c4a4e; --teal-l:#123c40; --orange-l:#3a2c12; --crimson-l:#3d1717; }
}
:root[data-theme="dark"]{ --ink:#F4F7F8; --paper:#0f2a2d; --muted:#b9c7cb; --line:#2c4a4e; --teal-l:#123c40; --orange-l:#3a2c12; --crimson-l:#3d1717; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:3px solid var(--ink)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--teal);letter-spacing:-.01em;white-space:nowrap}
.clapper-title{display:flex;align-items:center;gap:10px;min-width:0}
.clapper-title svg{flex:none}
.clapper-title .t{font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);font-weight:700;background:var(--orange-l);white-space:nowrap}
.pill.time{background:var(--teal-l)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.iconbtn.on{background:var(--teal);color:#fff}
@media (max-width:760px){.top{flex-wrap:wrap}.clapper-title .t{max-width:60vw}.iconbtn .lbl{display:none}}

/* ---------- filmstrip ---------- */
.filmstrip{position:relative;background:var(--teal-d);padding:22px 14px}
.filmstrip::before,.filmstrip::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.92) 10px 24px,transparent 24px 34px)}
.filmstrip::before{top:6px}.filmstrip::after{bottom:6px}
.frames{display:flex;gap:12px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
.frame{flex:none;width:156px;border:0;border-radius:8px;background:#fff;color:#1A1A1A;padding:0;cursor:pointer;text-align:left;overflow:hidden;position:relative;transition:transform .2s}
.frame .band{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:var(--display);font-weight:800;font-size:.95rem}
.frame .band .emo{font-size:1.5rem}
.frame .nm{display:block;padding:7px 10px 9px;font-weight:600;font-size:.86rem;line-height:1.2;min-height:44px}
.frame.locked{filter:grayscale(1);opacity:.55}
.frame.locked::after{content:"🔒";position:absolute;right:8px;bottom:6px;font-size:1rem}
.frame.done::after{content:"✔";position:absolute;right:8px;bottom:6px;color:var(--teal);font-weight:800}
.frame.current{outline:4px solid var(--orange);transform:translateY(-3px)}

/* ---------- stage ---------- */
.stage{background-color:var(--set);color:var(--set-ink);background-image:radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 1.8px);background-size:20px 20px;padding:26px 22px 30px;transition:background-color .5s}
.stage-in{max-width:1180px;margin:0 auto}
.scene-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;margin-bottom:16px}
.scene-head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.4vw,3.3rem);line-height:1;margin:0;letter-spacing:-.02em}
.scene-head .sub{font-weight:600;opacity:.9}
.dialogue{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:end}
.portrait{width:150px;height:150px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.portrait svg{width:128px;height:128px}
.bubble{position:relative;background:#fff;color:#1A1A1A;border:3px solid var(--ink);border-radius:22px;padding:16px 20px 12px;box-shadow:6px 6px 0 rgba(26,26,26,.85);min-height:118px;display:flex;flex-direction:column}
.bubble::before{content:"";position:absolute;left:-17px;bottom:26px;border:14px solid transparent;border-right-color:var(--ink)}
.bubble::after{content:"";position:absolute;left:-11px;bottom:28px;border:12px solid transparent;border-right-color:#fff}
.who{font-family:var(--display);font-weight:800;font-size:1rem;margin-bottom:4px}
.line{font-size:1.18rem;flex:1}
.beat-nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.beat-nav .dots{display:flex;gap:5px;flex:1}
.beat-nav .dots i{width:9px;height:9px;border-radius:50%;background:#cfd9dc}
.beat-nav .dots i.on{background:var(--teal)}
.navbtn{border:2px solid var(--ink);background:var(--orange);border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer}
.navbtn:disabled{opacity:.35;cursor:default}
@media (max-width:640px){.dialogue{grid-template-columns:1fr}.portrait{width:96px;height:96px}.portrait svg{width:82px;height:82px}.bubble::before,.bubble::after{display:none}}

/* ---------- tasks ---------- */
.tasks{max-width:1180px;margin:0 auto;padding:26px 18px 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:860px){.tasks{grid-template-columns:1fr}}
.card{background:#fff;color:#1A1A1A;border:3px solid var(--ink);border-radius:20px;padding:18px 20px 16px;box-shadow:7px 7px 0 var(--set);min-width:0}
.card.wide{grid-column:1/-1}
.card.wide .rows{max-width:780px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-head .mini{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--teal-l);display:grid;place-items:center;overflow:hidden}
.card-head .mini svg{width:42px;height:42px}
.card h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;line-height:1.1}
.card .intro{margin:4px 0 12px;color:#39454b}
.optional{font-size:.8rem;font-weight:600;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:12px;background:#f6fafb}
.row.is-ok{background:var(--teal-l)}
.row .q{font-weight:500}
.ans-wrap{display:inline-flex;align-items:center;gap:6px}
.ans{width:128px;font-size:1.15rem;font-weight:700;padding:7px 10px;border:2.5px dashed var(--teal);border-radius:10px;background:#fff;color:#1A1A1A;text-align:center}
.ans.wide-in{width:220px;text-align:left}
select.ans{width:170px;text-align:left;cursor:pointer}
.ans.ok{border-style:solid;border-color:var(--teal);background:#fff}
.ans.bad{border-style:solid;border-color:var(--crimson);background:var(--crimson-l);animation:shake .4s}
.unit{font-weight:700;color:var(--muted)}
.mark{width:22px;text-align:center;font-weight:800}
.row.is-ok .mark::before{content:"✔";color:var(--teal)}
.hint{grid-column:1/-1;font-size:.92rem;color:var(--crimson);font-weight:600}
.star-tag{display:inline-block;background:var(--orange);color:#1A1A1A;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800;font-size:.85rem}
.card-foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.fb{font-weight:600}
.fb.good{color:var(--teal-d)}.fb.bad{color:var(--crimson)}
.btn{border:2.5px solid var(--ink);background:var(--teal);color:#fff;font-weight:700;border-radius:999px;padding:9px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-size:1rem}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--orange);color:#1A1A1A}
.btn.red{background:var(--crimson)}
.btn.ghost{background:#fff;color:#1A1A1A}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:10px 14px;font-weight:600;cursor:pointer;text-align:left;max-width:100%}
.opt:hover:not(:disabled){background:var(--orange-l)}
.opt.ok{background:var(--teal);color:#fff}
.opt.no{background:var(--crimson-l);border-color:var(--crimson);animation:shake .4s}
.opt:disabled{cursor:default}
.brow .opts{justify-content:flex-end}
.brow .opt{padding:6px 14px}
textarea.say{width:100%;min-height:78px;border:2.5px dashed var(--teal);border-radius:12px;padding:10px;font-size:1.05rem;resize:vertical;background:#fff;color:#1A1A1A}
textarea.say.ok{border-style:solid;background:var(--teal-l)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* to-do dock + card status */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(1100px,94vw);background:#fff;color:#1A1A1A;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--set);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.dock .lbl{font-family:var(--display);font-weight:800;white-space:nowrap}
.dock .bar{flex:0 0 160px;height:12px;border-radius:999px;background:#e7eff1;border:2px solid var(--ink);overflow:hidden}
.dock .bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.dock .todo{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.dock .todo button{border:2px solid var(--ink);background:var(--orange-l);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.88rem;cursor:pointer;color:#1A1A1A}
.dock .todo button:hover{background:var(--orange)}
.dock .go{margin-left:auto}
.chip{margin-left:auto;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--ink);white-space:nowrap}
.chip.todo-c{background:var(--orange-l)}
.chip.done-c{background:var(--teal);color:#fff}
.card.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{outline:0 solid transparent}20%,60%{outline:5px solid var(--orange);outline-offset:4px}}
.tasks{padding-bottom:150px}
/* scene complete */
.wrapbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--orange);color:#1A1A1A;border:3px solid var(--ink);border-radius:20px;padding:16px 20px;box-shadow:7px 7px 0 var(--ink)}
.wrapbar h3{font-family:var(--display);font-size:1.5rem;margin:0}
.wrapbar p{margin:0;flex:1;min-width:200px;font-weight:600}
.progressline{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--muted)}
.progressline .bar{flex:1;height:12px;border-radius:999px;background:#e7eff1;border:2px solid var(--ink);overflow:hidden}
.progressline .bar i{display:block;height:100%;background:var(--teal);transition:width .4s}

/* illustrations */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.notes{grid-template-columns:1fr}}
.note{background:var(--orange-l);border:2.5px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;transform:rotate(-.6deg)}
.note:nth-child(2){transform:rotate(.7deg);background:var(--teal-l)}
.note:nth-child(3){transform:rotate(-.3deg);background:#fff4f4}
.note h3{font-family:var(--display);margin:0;font-size:1.1rem}
.note svg{width:100%;height:120px}
.note input{width:100%}
.storyboard{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sticky{background:#fff38a;border:2px solid var(--ink);padding:8px 10px;border-radius:4px;transform:rotate(-2deg);font-weight:600;max-width:240px;box-shadow:3px 3px 0 rgba(0,0,0,.2);color:#1A1A1A}
.sticky:nth-child(2){transform:rotate(1.5deg);background:#bff4f1}
.sticky:nth-child(3){transform:rotate(-1deg);background:#ffd7a8}
.cast{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.cast .fields{display:grid;gap:10px}
.cast label{display:grid;gap:4px;font-weight:600}
.cast input{width:100%;text-align:left}
@media (max-width:560px){.cast{grid-template-columns:1fr}}

/* zoom */
.zoom-levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.zoom-levels button.seen{background:var(--teal-l)}
.zoom-levels button.cur{background:var(--teal);color:#fff}
.zoombox svg{width:100%;height:auto;display:block}
.zcap{font-weight:600;margin-top:8px;min-height:2.6em}

/* place-value table */
.pvt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin-top:8px}
.pvt th{font-size:.78rem;font-weight:700;color:#fff;background:var(--teal);border-radius:8px;padding:6px 2px}
.pvt th.dec{background:var(--orange);color:#1A1A1A}
.pvt td{text-align:center;font-family:var(--display);font-size:1.8rem;font-weight:800;background:#f3f8f9;border:2px solid var(--ink);border-radius:10px;height:56px}
.pvt td.pt{background:transparent;border:0;color:var(--crimson);font-size:2.2rem;width:22px}
.pvt th.ptc{background:transparent;width:22px}
.pvt .u{display:block;font-weight:600;font-size:.7rem;opacity:.9}

/* tripod */
.tri{position:relative;height:190px;margin-top:6px}
.tri .col{position:absolute;top:0;height:28px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;background:var(--teal);border-radius:8px;text-align:center;line-height:1.05;padding:0 2px}
.tri .col.dec{background:var(--orange);color:#1A1A1A}
.tri .slot{position:absolute;top:36px;height:70px;border:2px dashed #b8c9cd;border-radius:12px}
.tri .tile{position:absolute;top:40px;height:62px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.3rem;background:var(--crimson);color:#fff;border:3px solid var(--ink);border-radius:12px;transition:left .8s cubic-bezier(.5,-0.3,.3,1.3);z-index:2}
.tri .tile.ghost{background:#fff;color:#8ea0a5;border-style:dashed;z-index:1;transition:left .8s, opacity .4s}
.tri .pointer{position:absolute;top:36px;width:0;height:150px;z-index:3}
.tri .pointer .dot{position:absolute;left:-11px;top:48px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
.tri .pointer svg{position:absolute;left:-30px;top:72px;width:60px;height:80px}
.tri-ops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.tri-ops .btn{padding:7px 14px}
.trilog{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-top:10px;min-height:1.6em}
.walk{font-weight:700;color:var(--crimson);min-height:1.4em}
@media (max-width:560px){.tri .tile{font-size:1.5rem}.tri .col{font-size:.55rem}}

/* skyline, plank, garden */
.skyline svg,.plank svg,.garden svg{width:100%;height:auto;display:block}
.garden{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;margin-top:10px}
@media (max-width:560px){.garden{grid-template-columns:1fr}}

/* speed */
.speed{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.speed{grid-template-columns:1fr}}
.take{border:3px solid var(--ink);border-radius:18px;padding:14px;background:#fbfeff}
.take h3{font-family:var(--display);margin:0 0 8px;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.clapq{background:var(--ink);color:#fff;border-radius:14px;padding:18px 14px;text-align:center;font-family:var(--display);font-weight:800;font-size:2.2rem;position:relative;margin:8px 0}
.clapq::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(135deg,#fff 0 14px,var(--ink) 14px 28px);border:2px solid var(--ink)}
.timebar{height:12px;border-radius:999px;border:2px solid var(--ink);overflow:hidden;background:#eef4f5}
.timebar i{display:block;height:100%;background:var(--orange);transition:width 1s linear}
.speed-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.speed-row .ans{flex:1}
.res{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.95rem;margin-top:8px}
.res .y{color:var(--teal-d);font-weight:700}.res .n{color:var(--crimson);font-weight:700}
.compare{grid-column:1/-1;display:grid;gap:8px;margin-top:4px}
.cbar{display:grid;grid-template-columns:70px 1fr 50px;align-items:center;gap:10px;font-weight:700}
.cbar .b{height:22px;border-radius:8px;border:2px solid var(--ink);background:#eef4f5;overflow:hidden}
.cbar .b i{display:block;height:100%;transition:width 1s}

/* credits */
.premiere{position:relative;overflow:hidden}
.spot{position:absolute;top:-30%;width:40%;height:160%;background:conic-gradient(from 180deg at 50% 0%,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);animation:sweep 5s ease-in-out infinite alternate;pointer-events:none}
.spot.l{left:-5%}.spot.r{right:-5%;animation-delay:-2.5s}
@keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.award{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
@media (max-width:760px){.award{grid-template-columns:1fr}}
.trophy{animation:pop 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.medal-name{display:inline-block;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin:0 0 10px;color:#1A1A1A;padding:4px 14px;border:3px solid var(--ink);border-radius:14px}
.letter{background:#fffdf6;border:3px solid var(--ink);border-radius:18px;padding:18px 22px;font-size:1.12rem;line-height:1.6;box-shadow:6px 6px 0 var(--orange);color:#1A1A1A}
.letter .sig{font-family:var(--display);font-weight:700;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:3px solid var(--ink);border-radius:16px;padding:12px;background:var(--teal-l);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.rollbox{height:260px;overflow:hidden;background:#1A1A1A;border-radius:18px;border:3px solid var(--ink);position:relative;color:#fff;text-align:center}
.roll{position:absolute;left:0;right:0;top:100%;animation:roll 22s linear infinite}
.roll p{margin:0 0 4px;opacity:.75;font-size:.9rem}
.roll h4{margin:0 0 18px;font-family:var(--display);font-size:1.35rem;color:var(--orange)}
@keyframes roll{to{transform:translateY(-100%) translateY(-280px)}}
.mentor-only{display:none}
body.mentor .mentor-only{display:block}

/* mentor drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--paper);color:var(--ink);border-left:3px solid var(--ink);z-index:60;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
@media (min-width:1000px){body.mentor .filmstrip,body.mentor main{margin-right:min(380px,92vw);transition:margin .3s}}
.drawer header{background:var(--teal);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.drawer header .iconbtn{color:#1A1A1A;background:#fff}
.drawer header h2{margin:0;font-family:var(--display);font-size:1.2rem;flex:1}
.drawer .body{overflow:auto;padding:14px 16px 30px;display:grid;gap:14px}
.drawer h3{margin:0 0 6px;font-family:var(--display);font-size:1rem}
.drawer ul{margin:0;padding-left:18px}
.drawer li{margin-bottom:4px;font-size:.93rem}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:8px;font-weight:700;cursor:pointer;color:#1A1A1A}
.seg button.on{background:var(--orange)}
.mbtns{display:flex;flex-wrap:wrap;gap:8px}
.mbtns .btn{font-size:.88rem;padding:7px 12px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 10px;cursor:pointer;font-weight:700;color:#1A1A1A}
.key{background:var(--orange-l);border-radius:12px;padding:10px 12px;font-size:.9rem;color:#1A1A1A}
.debrief{border:3px dashed var(--teal);border-radius:16px;padding:14px 18px;background:#fff;color:#1A1A1A}
.debrief h3{font-family:var(--display);margin:0 0 6px}

/* whiteboard */
.wb{position:fixed;inset:0;z-index:80;display:none}
.wb.open{display:block}
.wb.blank{background:#fff}
.wb.grid{background-color:#fff;background-image:linear-gradient(#dcebee 1px,transparent 1px),linear-gradient(90deg,#dcebee 1px,transparent 1px);background-size:32px 32px}
.wb.overlay{background:rgba(255,255,255,.02)}
.wb canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wbbar{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:5px 5px 0 var(--teal);max-width:96vw;z-index:2;color:#1A1A1A}
.wbbar button{border:2px solid var(--ink);background:#fff;border-radius:10px;min-width:38px;height:38px;padding:0 8px;cursor:pointer;font-weight:700;color:#1A1A1A}
.wbbar button.on{background:var(--orange)}
.wbbar .sw{width:30px;min-width:30px;height:30px;border-radius:50%;padding:0}
.wbbar .sw.on{outline:3px solid var(--ink);outline-offset:2px}
.wbbar .sep{width:2px;height:28px;background:var(--line)}
.wb .txt{position:absolute;z-index:3;border:2px dashed var(--teal);background:#fff;font-size:22px;padding:2px 6px;min-width:140px;color:#1A1A1A}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:90;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <span class="brand">MyMasteryLab</span>
  <span class="clapper-title" id="movieTitle"></span>
  <span class="spacer"></span>
  <span class="pill" title="Stars earned">⭐ <span id="stars">0</span></span>
  <span class="pill time" title="Scene time">⏱ <span id="clock">0:00</span></span>
  <button class="iconbtn" id="sndBtn" aria-label="Sound on or off">🔊<span class="lbl"> Sound</span></button>
  <button class="iconbtn" id="wbBtn" aria-label="Open whiteboard (W)">✏️<span class="lbl"> Board</span></button>
  <button class="iconbtn" id="mentorBtn" aria-label="Mentor controls (M)">🎬<span class="lbl"> Mentor</span></button>
</header>

<nav class="filmstrip" aria-label="Scenes"><div class="frames" id="frames"></div></nav>

<main>
  <section class="stage" id="stage"><div class="stage-in">
    <div class="scene-head"><h1 id="sceneTitle"></h1><span class="sub" id="sceneSub"></span></div>

          <button class="navbtn" id="nextBeat" aria-label="Next line">Next ▶</button></div>
      </div>
    </div>
  </div></section>
  <section class="tasks" id="tasks"></section>
</main>

<aside class="drawer" id="drawer" aria-label="Mentor controls">
  <header><h2>Mentor controls</h2><button class="iconbtn" id="closeDrawer" aria-label="Close">✕</button></header>
  <div class="body" id="drawerBody"></div>
</aside>

<div class="wb" id="wb">
  <canvas id="wbc"></canvas>
  <div class="wbbar" id="wbbar"></div>
</div>
<canvas id="confetti"></canvas>
<div class="dock hidden" id="dock" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   STATE
========================================================= */
const KEY='mml-tiny-town-v1';
const fresh=()=>({name:'',title:'',path:'full',unlocked:1,current:1,beat:{},done:{},vals:{},scored:{},wrong:{},stars:0,firstTry:0,sceneDone:{},elapsed:{},speed:{t1:null,t2:null},award:null,sound:true,celebrated:false,autoUnlock:true});
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=(q,el=document)=>el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const full=()=>S.path==='full';
const NAME=()=>esc(S.name||'Junior Model Engineer');
const TITLE=()=>esc(S.title||'our movie');
let mentor=false;

/* =========================================================
   SOUND (Web Audio, no files)
========================================================= */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,d,type='triangle',g=.18,f2){const a=ac(); if(!a||!S.sound) return; const o=a.createOscillator(), v=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d); v.gain.setValueAtTime(0,a.currentTime+t0); v.gain.linearRampToValueAtTime(g,a.currentTime+t0+.02); v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d); o.connect(v).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.05);}
function noise(t0,d,g=.2,filt=1800,sweep){const a=ac(); if(!a||!S.sound) return; const n=a.sampleRate*d, b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(filt,a.currentTime+t0); if(sweep) f.frequency.exponentialRampToValueAtTime(sweep,a.currentTime+t0+d); const v=a.createGain(); v.gain.setValueAtTime(g,a.currentTime+t0); v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d); s.connect(f).connect(v).connect(a.destination); s.start(a.currentTime+t0);}
const sfx={
  click(){tone(880,0,.06,'sine',.08)},
  correct(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.08,.28,'triangle',.16)); tone(2093,.32,.3,'sine',.05)},
  tick(){tone(1320,0,.08,'square',.05)},
  wrong(){tone(233,0,.28,'sawtooth',.09,196); tone(185,.3,.5,'sawtooth',.09,110)},
  miss(){tone(196,0,.22,'square',.07,150)},
  clap(){noise(0,.09,.5,2500); noise(.02,.05,.3,5000)},
  whoosh(){noise(0,.55,.18,400,3500)},
  wrap(){this.clap(); [392,523.25,659.25].forEach((f,i)=>tone(f,.12+i*.1,.5,'triangle',.14)); tone(783.99,.45,.8,'triangle',.14)},
  unlock(){[392,392,523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.12,i===4?.9:.18,'square',.07)); [523.25,659.25,783.99].forEach(f=>tone(f,.6,1,'triangle',.08))},
  grand(){ for(let i=0;i<16;i++) noise(i*.06,.07,.18+(i/16)*.2,900); noise(1,.6,.5,300); const seq=[[523.25,0],[659.25,.18],[783.99,.36],[1046.5,.54],[783.99,.8],[1046.5,1]]; seq.forEach(([f,t])=>{tone(f,1+t,.4,'square',.07);tone(f/2,1+t,.4,'triangle',.08)}); [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,2.3,1.8,'triangle',.08)); for(let i=0;i<10;i++) tone(1500+Math.random()*1500,2.4+i*.12,.25,'sine',.04) }
};

/* =========================================================
   CONFETTI
========================================================= */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], raf=null;
function sizeConf(){cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',sizeConf); sizeConf();
const CCOL=['#00A7B2','#FAA71C','#D77F28','#C92426','#21DED7','#ffffff'];
function burst(n=120,x=innerWidth/2,y=innerHeight/3){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) n=Math.min(n,25); for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, v=4+Math.random()*9; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CCOL[i%CCOL.length],life:160+Math.random()*80,star:Math.random()<.18});} if(!raf) loopConf();}
function loopConf(){cx.clearRect(0,0,innerWidth,innerHeight); parts.forEach(p=>{p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--; cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c; if(p.star){cx.font='16px serif';cx.fillText('⭐',-8,8)} else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();}); parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40); if(parts.length) raf=requestAnimationFrame(loopConf); else {raf=null;cx.clearRect(0,0,innerWidth,innerHeight)}}

function toast(msg){const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600)}

/* =========================================================
   CHARACTERS (SVG)
========================================================= */
function mouth(m){return m==='oops'||m==='sad'?'M48 84 Q60 76 72 84':m==='wow'?'M54 80 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0':'M46 78 Q60 92 74 78'}
const CH={
 olivia:{name:'Director Olivia Grant',color:'#C92426',svg:(m='happy')=>`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="22" y="96" width="76" height="30" rx="16" fill="#00A7B2"/><path d="M28 62 Q26 26 60 24 Q94 26 92 62 L92 86 Q84 80 80 70 L40 70 Q36 80 28 86Z" fill="#3b2a24"/><circle cx="60" cy="64" r="27" fill="#F2C9A5"/><path d="M34 52 Q40 36 60 36 Q80 36 86 52 Q70 44 60 46 Q48 44 34 52Z" fill="#3b2a24"/><ellipse cx="66" cy="30" rx="30" ry="11" fill="#C92426" transform="rotate(-10 66 30)"/><circle cx="84" cy="22" r="4" fill="#C92426"/><circle cx="50" cy="63" r="3.4" fill="#1A1A1A"/><circle cx="70" cy="63" r="3.4" fill="#1A1A1A"/><circle cx="44" cy="72" r="4" fill="#f4a1a1" opacity=".6"/><circle cx="76" cy="72" r="4" fill="#f4a1a1" opacity=".6"/><path d="${mouth(m)}" stroke="#1A1A1A" stroke-width="3" fill="${m==='wow'?'#1A1A1A':'none'}" stroke-linecap="round"/><g transform="translate(86 86) rotate(-20)"><path d="M0 6 L22 -6 L22 22 L0 12Z" fill="#FAA71C" stroke="#1A1A1A" stroke-width="2"/><rect x="-6" y="5" width="8" height="8" rx="2" fill="#1A1A1A"/></g></svg>`},
 theo:{name:'Theo Walsh · Chief Model Maker',color:'#D77F28',svg:(m='happy')=>`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="22" y="96" width="76" height="30" rx="16" fill="#D77F28"/><rect x="48" y="94" width="24" height="26" fill="#FAA71C"/><circle cx="60" cy="62" r="27" fill="#E8B894"/><path d="M34 54 Q34 40 44 40 L50 34 L56 40 L62 33 L68 40 L76 36 L84 46 Q88 52 86 56 Q74 46 60 46 Q44 46 34 54Z" fill="#D77F28"/><path d="M28 42 Q60 12 92 42 L96 46 L24 46Z" fill="#FAA71C" stroke="#1A1A1A" stroke-width="2"/><rect x="54" y="22" width="12" height="10" rx="3" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="49" cy="62" r="8" fill="#fff" stroke="#1A1A1A" stroke-width="2.5"/><circle cx="71" cy="62" r="8" fill="#fff" stroke="#1A1A1A" stroke-width="2.5"/><path d="M57 62 L63 62" stroke="#1A1A1A" stroke-width="2.5"/><circle cx="49" cy="62" r="3" fill="#1A1A1A"/><circle cx="71" cy="62" r="3" fill="#1A1A1A"/><path d="${mouth(m)}" stroke="#1A1A1A" stroke-width="3" fill="${m==='wow'?'#1A1A1A':'none'}" stroke-linecap="round"/><rect x="86" y="46" width="4" height="22" fill="#C92426" transform="rotate(25 88 57)"/></svg>`},
 scaley:{name:'Scaley · the 3D Printer',color:'#00A7B2',svg:(m='proud')=>{const eyes=m==='oops'?`<path d="M42 50 l10 10 m0 -10 l-10 10 M68 50 l10 10 m0 -10 l-10 10" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>`:m==='sad'?`<path d="M42 58 q5 -6 10 0 M68 58 q5 -6 10 0" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>`:m==='sneaky'?`<rect x="41" y="54" width="12" height="5" rx="2" fill="#1A1A1A"/><rect x="67" y="54" width="12" height="5" rx="2" fill="#1A1A1A"/>`:`<circle cx="47" cy="55" r="6" fill="#1A1A1A"/><circle cx="73" cy="55" r="6" fill="#1A1A1A"/><circle cx="49" cy="53" r="2" fill="#fff"/><circle cx="75" cy="53" r="2" fill="#fff"/>`; const mo=m==='oops'||m==='sad'?'M50 72 Q60 66 70 72':m==='sneaky'?'M50 70 Q62 76 72 68':'M48 68 Q60 78 72 68'; return `<svg viewBox="0 0 120 120" aria-hidden="true"><line x1="60" y1="8" x2="60" y2="22" stroke="#1A1A1A" stroke-width="3"/><circle cx="60" cy="8" r="5" fill="#C92426"/><rect x="18" y="22" width="84" height="76" rx="14" fill="#00A7B2" stroke="#1A1A1A" stroke-width="3"/><rect x="30" y="36" width="60" height="44" rx="8" fill="#E3F6F7" stroke="#1A1A1A" stroke-width="2.5"/>${eyes}<path d="${mo}" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="50" y="98" width="20" height="8" fill="#1A1A1A"/><path d="M55 106 L65 106 L60 114Z" fill="#FAA71C" stroke="#1A1A1A" stroke-width="2"/><circle cx="92" cy="30" r="3.5" fill="#FAA71C"/><rect x="8" y="104" width="30" height="12" rx="2" fill="#D77F28"/><rect x="84" y="100" width="26" height="16" rx="2" fill="#FAA71C"/></svg>`}},
 you:{name:'You',color:'#FAA71C',svg:()=>clapSVG(110)}
};
function clapSVG(w=46,label){return `<svg width="${w}" height="${w*0.82}" viewBox="0 0 110 90" aria-hidden="true"><g transform="rotate(-12 10 30)"><rect x="6" y="18" width="96" height="16" rx="3" fill="#fff" stroke="#1A1A1A" stroke-width="3"/><path d="M18 18 l12 16 M42 18 l12 16 M66 18 l12 16 M90 18 l10 14" stroke="#1A1A1A" stroke-width="7"/></g><rect x="6" y="36" width="98" height="50" rx="5" fill="#1A1A1A"/><rect x="6" y="36" width="98" height="10" fill="#fff" stroke="#1A1A1A" stroke-width="3"/><path d="M18 36 l12 10 M42 36 l12 10 M66 36 l12 10 M90 36 l10 9" stroke="#1A1A1A" stroke-width="7"/>${(label===undefined?'YOU':label)?`<text x="55" y="74" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="#FAA71C">${esc(label===undefined?'YOU':label)}</text>`:''}</svg>`}
function mini(who,m){return `<span class="mini">${CH[who].svg(m)}</span>`}

/* =========================================================
   SCENES: meta + story beats
========================================================= */
const SC=[null,
 {t:'Lights, Camera, Shrink!',emo:'🎬',c:'#00A7B2',ink:'#fff',sub:'Scene 1 · the studio opens',target:5},
 {t:'The Tape Measure Secret',emo:'📏',c:'#FAA71C',ink:'#1A1A1A',sub:'Scene 2 · metres, tenths, hundredths, thousandths',target:6},
 {t:'The Scale Dial',emo:'🎛️',c:'#C92426',ink:'#fff',sub:'Scene 3 · does the point really move?',target:10},
 {t:'Building the Set',emo:'🏙️',c:'#D77F28',ink:'#fff',sub:'Scene 4 · compare, round, add, subtract',target:8},
 {t:'Studio Shortcuts',emo:'⚡',c:'#21DED7',ink:'#1A1A1A',sub:'Scene 5 · smart tricks + Beat the Clapperboard',target:7},
 {t:"That's a Wrap!",emo:'🎞️',c:'#00928e',ink:'#fff',sub:'Scene 6 · fix the Storyboard + final check',target:5},
 {t:'Premiere Night',emo:'🏆',c:'#00A7B2',ink:'#fff',sub:'The grand premiere · awards · credits',target:4}
];
function towers(){return full()?{A:1.5,B:1.45,C:1.405}:{A:1.5,B:1.45,C:1.4}}
function BEATS(i){const T=towers(); return ({
 1:[['olivia','happy',`Welcome to the studio, ${NAME()}! I'm Director Olivia Grant. Our movie has a giant wave crashing into a city.`],
    ['olivia','wow',`We can't flood a real city… so we're building a TINY one and filming it up close. Real filmmakers do this all the time!`],
    ['theo','happy',`I'm Theo, the chief model maker. You're our new Junior Model Engineer. Every model must be exactly the right size, or the shot is ruined.`],
    ['scaley','proud',`BEEP! I am Scaley, the smartest 3D printer ever built. I know ALL the rules. I never make mistakes. BOOP.`],
    ['olivia','oops',`Hmm. Scaley made three mistakes this morning. Sign your contract, then read my Director's Notes and pin your best guesses to the Storyboard.`]],
 2:[['theo','happy',`Every model maker's best friend is the tape measure. Let's zoom in and find its secret.`],
    ['theo','wow',`Stand up for the Body Ruler! Arms wide is about 1 metre. A hand is about 10 cm. A tiny pinch is 1 cm… and nearly touching is 1 mm!`],
    ['olivia','happy',`Notice something? Every time we zoom in, the piece splits into 10. The decimal point sits between whole metres and parts of a metre, like a camera on a tripod.`],
    ['scaley','sneaky',`Zeros are zeros! 0.5 m, 0.05 m, 0.500 m — all the same size. BEEP.`],
    ['theo','oops',`Are they, Scaley? ${NAME()}, please inspect Scaley's zeros.`]],
 3:[['olivia','happy',`Close-up time! The model car is 0.42 m long. We need a hero car 10 times bigger.`],
    ['scaley','proud',`Easy! 0.42 × 10 = 0.420. Just add a zero! BEEP BOOP.`],
    ['theo','oops',`Hmm… would 0.420 m look any bigger on camera? Let's build it with the metre stick and find out.`],
    ['olivia','wow',`Now watch the Tripod Chart. The decimal point is our camera on its tripod. Does it move… or do the actors?`],
    ['theo','happy',`Brilliant! Now scale the rest of the props for the set.`]],
 4:[['olivia','happy',`The set is going up! The tallest tower must stand in the centre of the shot.`],
    ['scaley','proud',full()?`Tower C is ${T.C} m. It has the most digits, so it's the tallest! BEEP.`:`Tower B is ${T.B} m. It has the most digits, so it's the tallest! BEEP.`],
    ['theo','oops',`Bad news: our studio saw only cuts to the nearest ${full()?'tenth of a metre (10 cm)':'whole metre'}.`],
    ['scaley','proud',`I added up the wood for the model park. Total: 5.40 m. I am never wrong.`],
    ['olivia','oops',`${NAME()}, please check everything before we build!`]],
 5:[['olivia','happy',`Film sets run on tight schedules. Time for Studio Shortcuts!`],
    ['theo','wow',`Every shortcut works because of the place value you discovered. No magic — just thinking.`],
    ['olivia','happy',`Then… Beat the Clapperboard! Do Take 1, learn from it, then show me a better Take 2.`]],
 6:[['olivia','happy',`That's almost a wrap on ${TITLE()}! Let's check this morning's Storyboard.`],
    ['scaley','sad',`Did I… make mistakes? BEEP… boop.`],
    ['theo','happy',`You caught every one, ${NAME()}. One final check before the premiere.`]],
 7:[['olivia','wow',`Ladies and gentlemen… welcome to the world premiere of ${TITLE()}!`],
    ['theo','happy',`Every model was the perfect size — thanks to our Junior Model Engineer, ${NAME()}.`],
    ['scaley','happy',`BEEP! I learned something: the decimal point never moves. The digits do! Thank you, ${NAME()}.`]]
})[i];}

/* =========================================================
   ANSWER CHECKING
========================================================= */
function norm(v){return String(v).toLowerCase().replace(/[\s,]/g,'').replace(/(metres|metre|meters|meter|m²|m2|mm|cm|m|s|sec)$/,'')}
function isRight(v,a,alt){ const n=norm(v); if(alt && alt.split('|').some(x=>norm(x)===n)) return true; const na=norm(a);
  if(/^[-+]?\d*\.?\d+$/.test(n) && /^[-+]?\d*\.?\d+$/.test(na)) return Math.abs(parseFloat(n)-parseFloat(na))<1e-9; return n===na; }
function addStars(n){S.stars+=n; $('#stars').textContent=S.stars; const p=$('#stars').parentElement; p.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350});}
function score(id,firstTry){ if(S.scored[id]) return; S.scored[id]=firstTry?'first':'retry'; if(firstTry) S.firstTry++; addStars(1); }
function accuracy(){const k=Object.keys(S.scored); return k.length? S.firstTry/k.length : 0}

/* =========================================================
   TASK BUILDERS

const REG={}; // choice/row data
function head(t){return `<div class="card-head">${t.who?mini(t.who,t.mood):''}<h2>${t.title}</h2>${t.optional?'<span class="optional">optional</span>':''}</div>${t.intro?`<p class="intro">${t.intro}</p>`:''}`}
function numGroup(g){
  const rows=g.rows.filter(r=>!r.star||full());
  return `<section class="card ${g.wide?'wide':''}" data-group="${g.id}">${head(g)}
   <div class="rows">${rows.map(r=>{const d=S.done[r.id]; const v=esc(S.vals[r.id]||'');
     const field = r.opts ? `<select class="ans ${d?'ok':''}" data-req="${r.id}" data-a="${esc(r.a)}" ${d?'disabled':''}><option value="">choose…</option>${r.opts.map(o=>`<option ${S.vals[r.id]===o?'selected':''}>${o}</option>`).join('')}</select>`
       : `<input class="ans ${r.wideIn?'wide-in':''} ${d?'ok':''}" data-req="${r.id}" data-a="${esc(r.a)}" data-alt="${esc(r.alt||'')}" inputmode="${r.im||'decimal'}" autocomplete="off" aria-label="${esc(r.q.replace(/<[^>]+>/g,''))}" value="${v}" ${d?'readonly':''}>`;
     return `<div class="row ${d?'is-ok':''}" data-row="${r.id}"><span class="q">${r.star?'<span class="star-tag">★</span>':''}${r.q}</span><span class="ans-wrap">${field}${r.unit?`<span class="unit">${r.unit}</span>`:''}<span class="mark"></span></span><span class="hint" hidden>${r.hint||g.hint||'Look again — which place does each digit belong in?'}</span></div>`}).join('')}</div>
   <div class="card-foot"><button class="btn" data-check="${g.id}">Check answers</button><span class="fb"></span></div>${g.after||''}</section>`;
}
function btnRows(g){
  const rows=g.rows.filter(r=>!r.star||full());
  rows.forEach(r=>REG[r.id]=r);
  return `<section class="card ${g.wide?'wide':''}">${head(g)}<div class="rows">${rows.map(r=>{const d=S.done[r.id];
   return `<div class="row brow ${d?'is-ok':''}"><span class="q">${r.star?'<span class="star-tag">★</span>':''}${r.q}</span><span class="opts">${r.opts.map((o,i)=>`<button class="opt ${d&&(r.c===i||S.vals[r.id]==i)?'ok':''}" data-brow="${r.id}" data-i="${i}" data-req="${r.id}" ${d?'disabled':''}>${o}</button>`).join('')}</span><span class="hint" hidden>${r.why||''}</span></div>`}).join('')}</div>${g.after||''}</section>`;
}
function choice(t){
  if(t.star&&!full()) return ''; REG[t.id]=t; const d=S.done[t.id];
  return `<section class="card ${t.wide?'wide':''}">${head(t)}<p style="font-weight:600;margin:4px 0 10px">${t.q}</p><div class="opts">${t.opts.map((o,i)=>`<button class="opt ${d&&i===t.c?'ok':''}" data-choice="${t.id}" data-i="${i}" data-req="${t.id}" ${d?'disabled':''}>${o}</button>`).join('')}</div><p class="fb good" style="margin:10px 0 0">${d&&t.why?t.why:''}</p></section>`;
}
function textTask(t){const d=S.done[t.id];
  return `<section class="card ${t.wide?'wide':''}">${head(t)}<textarea class="say ${d?'ok':''}" data-say="${t.id}" data-req="${t.id}" placeholder="${esc(t.ph||'Type here…')}">${esc(S.vals[t.id]||'')}</textarea><div class="card-foot"><button class="btn alt" data-saysave="${t.id}">${t.btn||'Save my answer'}</button><span class="fb"></span></div></section>`;
}

   ${tools.map(t=>`<button data-tool="${t[0]}" class="${WB.tool===t[0]?'on':''}">${t[1]}</button>`).join('')}<span class="sep"></span>
   ${WCOL.map(c=>`<button class="sw ${WB.color===c?'on':''}" data-col="${c}" style="background:${c}" aria-label="colour ${c}"></button>`).join('')}<span class="sep"></span>
   ${[2,4,8,14].map(s=>`<button data-size="${s}" class="${WB.size===s?'on':''}" aria-label="size ${s}"><span style="display:inline-block;width:${s+4}px;height:${s+4}px;border-radius:50%;background:#1A1A1A;vertical-align:middle"></span></button>`).join('')}<span class="sep"></span>
   ${stamps.map(s=>`<button data-tool="stamp:${s[0]}" class="${WB.tool==='stamp:'+s[0]?'on':''}">${s[1]}</button>`).join('')}<span class="sep"></span>
   <button id="wbUndo">↶ Undo</button><button id="wbClear">Clear</button><button id="wbClose" style="background:#C92426;color:#fff">✕ Close</button>`;
  $$('[data-mode]',$('#wbbar')).forEach(b=>b.onclick=()=>{WB.mode=b.dataset.mode; applyMode(); buildBar()});
  $$('[data-tool]',$('#wbbar')).forEach(b=>b.onclick=()=>{WB.tool=b.dataset.tool; buildBar()});
  $$('[data-col]',$('#wbbar')).forEach(b=>b.onclick=()=>{WB.color=b.dataset.col; buildBar()});
  $$('[data-size]',$('#wbbar')).forEach(b=>b.onclick=()=>{WB.size=+b.dataset.size; buildBar()});
  $('#wbUndo').onclick=()=>{WB.objs.pop(); redraw()}; $('#wbClear').onclick=()=>{WB.objs=[]; redraw()}; $('#wbClose').onclick=toggleWB;
}
function applyMode(){const w=$('#wb'); w.classList.remove('overlay','blank','grid'); w.classList.add(WB.mode);}
function sizeWB(){wbc.width=innerWidth*devicePixelRatio; wbc.height=innerHeight*devicePixelRatio; wx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); redraw();}
function toggleWB(){WB.open=!WB.open; $('#wb').classList.toggle('open',WB.open); $('#wbBtn').classList.toggle('on',WB.open); if(WB.open){applyMode(); buildBar(); sizeWB();} sfx.click();}
function drawObj(o){
  wx.save(); wx.lineCap='round'; wx.lineJoin='round'; wx.strokeStyle=o.color; wx.fillStyle=o.color; wx.lineWidth=o.size;
  if(o.type==='path'){ if(o.tool==='hl'){wx.globalAlpha=.35; wx.lineWidth=o.size*5;} if(o.tool==='eraser'){wx.globalCompositeOperation='destination-out'; wx.lineWidth=o.size*6;} wx.beginPath(); o.pts.forEach((p,k)=>k?wx.lineTo(p[0],p[1]):wx.moveTo(p[0],p[1])); if(o.pts.length===1) wx.lineTo(o.pts[0][0]+.1,o.pts[0][1]); wx.stroke(); }
  else if(o.type==='line'||o.type==='arrow'){ wx.beginPath(); wx.moveTo(o.a[0],o.a[1]); wx.lineTo(o.b[0],o.b[1]); wx.stroke(); if(o.type==='arrow'){const an=Math.atan2(o.b[1]-o.a[1],o.b[0]-o.a[0]), L=12+o.size*2; wx.beginPath(); wx.moveTo(o.b[0],o.b[1]); wx.lineTo(o.b[0]-L*Math.cos(an-.45),o.b[1]-L*Math.sin(an-.45)); wx.lineTo(o.b[0]-L*Math.cos(an+.45),o.b[1]-L*Math.sin(an+.45)); wx.closePath(); wx.fill();} }
  else if(o.type==='rect'){ wx.strokeRect(o.a[0],o.a[1],o.b[0]-o.a[0],o.b[1]-o.a[1]); }
  else if(o.type==='text'){ wx.font=`700 ${14+o.size*3}px Outfit, sans-serif`; wx.fillText(o.text,o.x,o.y); }
  else if(o.type==='stamp') stamp(o);
  wx.restore();
}
function stamp(o){const {x,y,kind,color}=o; wx.lineWidth=2.5; wx.strokeStyle='#1A1A1A'; wx.font='700 14px Outfit, sans-serif'; wx.textAlign='center';
  if(kind==='pv'){const heads=['Tens','Ones','•','Tenths','Hundredths','Thousandths']; let cx=x; heads.forEach(h=>{const w=h==='•'?24:96; if(h!=='•'){wx.fillStyle=['Tenths','Hundredths','Thousandths'].includes(h)?'#FAA71C':'#00A7B2'; wx.fillRect(cx,y,w,30); wx.strokeRect(cx,y,w,30); wx.fillStyle=['Tenths','Hundredths','Thousandths'].includes(h)?'#1A1A1A':'#fff'; wx.fillText(h,cx+w/2,y+20); wx.fillStyle='#fff'; wx.fillRect(cx,y+30,w,66); wx.strokeRect(cx,y+30,w,66);} else {wx.fillStyle='#C92426'; wx.beginPath(); wx.arc(cx+12,y+64,7,0,7); wx.fill();} cx+=w;});}
  if(kind==='stick'){const w=500; for(let k=0;k<10;k++){wx.fillStyle=k%2?'#21DED7':'#00A7B2'; wx.fillRect(x+k*w/10,y,w/10,40); wx.strokeRect(x+k*w/10,y,w/10,40); wx.fillStyle='#1A1A1A'; wx.fillText((k+1)/10,x+(k+1)*w/10,y+60);} wx.fillText('0',x,y+60); wx.fillText('1 metre = 10 × 0.1 m',x+w/2,y-10);}
  if(kind==='hop'){wx.strokeStyle=color; wx.lineWidth=4; wx.beginPath(); wx.moveTo(x+90,y+30); wx.quadraticCurveTo(x+45,y-30,x,y+30); wx.stroke(); wx.fillStyle=color; wx.beginPath(); wx.moveTo(x,y+30); wx.lineTo(x+4,y+12); wx.lineTo(x+16,y+24); wx.fill(); wx.font='800 18px Outfit'; wx.fillText('×10',x+45,y-6);}
  if(kind==='tripod'){wx.fillStyle='#C92426'; wx.fillRect(x-16,y-30,32,20); wx.strokeRect(x-16,y-30,32,20); wx.fillStyle='#1A1A1A'; wx.beginPath(); wx.arc(x,y,9,0,7); wx.fill(); wx.beginPath(); wx.moveTo(x,y-10); wx.lineTo(x-26,y+60); wx.moveTo(x,y-10); wx.lineTo(x+26,y+60); wx.moveTo(x,y-10); wx.lineTo(x,y+60); wx.stroke(); wx.fillText('the point stays',x,y+80);}
  wx.textAlign='start';
}
function redraw(){wx.clearRect(0,0,innerWidth,innerHeight); WB.objs.forEach(drawObj); if(WB.cur) drawObj(WB.cur);}
function pos(e){const r=wbc.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]}
wbc.addEventListener('pointerdown',e=>{const p=pos(e); const t=WB.tool;
  if(t==='text'){ const inp=document.createElement('input'); inp.className='txt'; inp.style.left=p[0]+'px'; inp.style.top=(p[1]-20)+'px'; inp.style.color=WB.color; $('#wb').appendChild(inp); setTimeout(()=>inp.focus(),0); const commit=()=>{ if(inp.value.trim()) WB.objs.push({type:'text',x:p[0],y:p[1]+8,text:inp.value,color:WB.color,size:WB.size}); inp.remove(); redraw();}; inp.onkeydown=ev=>{if(ev.key==='Enter') inp.blur(); ev.stopPropagation()}; inp.onblur=commit; return; }
  if(t.startsWith('stamp:')){WB.objs.push({type:'stamp',kind:t.split(':')[1],x:p[0],y:p[1],color:WB.color}); redraw(); sfx.click(); return;}
  wbc.setPointerCapture(e.pointerId);
  if(['pen','hl','eraser'].includes(t)) WB.cur={type:'path',tool:t,color:WB.color,size:WB.size,pts:[p]};
  else WB.cur={type:t,a:p,b:p,color:WB.color,size:WB.size};
  redraw();});
wbc.addEventListener('pointermove',e=>{if(!WB.cur) return; const p=pos(e); if(WB.cur.type==='path') WB.cur.pts.push(p); else WB.cur.b=p; redraw();});
const endDraw=()=>{if(WB.cur){WB.objs.push(WB.cur); WB.cur=null; redraw();}};
wbc.addEventListener('pointerup',endDraw); wbc.addEventListener('pointercancel',endDraw);
addEventListener('resize',()=>{if(WB.open) sizeWB()});

/* =========================================================
   GLOBAL EVENTS
========================================================= */
$('#frames').addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) goTo(+b.dataset.go)});
$('#tasks').addEventListener('click',e=>{const b=e.target.closest('.wrapbar [data-go]'); if(b) goTo(+b.dataset.go)});
$('#prevBeat').onclick=()=>{S.beat[S.current]=Math.max(0,(S.beat[S.current]||0)-1); sfx.click(); renderBeat(); save()};
$('#nextBeat').onclick=()=>{const n=BEATS(S.current).length; S.beat[S.current]=Math.min(n-1,(S.beat[S.current]||0)+1); sfx.click(); renderBeat(); save()};
function setMentor(on){mentor=on; document.body.classList.toggle('mentor',on); $('#drawer').classList.toggle('open',on); $('#mentorBtn').classList.toggle('on',on); renderFrames(); updateProgress(); renderDrawer();}
$('#mentorBtn').onclick=()=>{setMentor(!mentor); sfx.click()}; $('#closeDrawer').onclick=()=>setMentor(false);
$('#wbBtn').onclick=toggleWB;
$('#sndBtn').onclick=()=>{S.sound=!S.sound; $('#sndBtn').firstChild.textContent=S.sound?'🔊':'🔇'; save(); if(S.sound) sfx.click();};
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName); if(typing) return;
  if(e.key==='m'||e.key==='M') setMentor(!mentor);
  else if(e.key==='w'||e.key==='W') toggleWB();
  else if(e.key==='Escape'){ if(WB.open) toggleWB(); else if(mentor) setMentor(false); }
  else if(e.key==='ArrowRight'&&!WB.open) $('#nextBeat').click();
  else if(e.key==='ArrowLeft'&&!WB.open) $('#prevBeat').click();});
addEventListener('pointerdown',()=>ac(),{once:true});
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
setInterval(()=>{ if(document.hidden) return; const i=S.current; S.elapsed[i]=(S.elapsed[i]||0)+1; const e=S.elapsed[i]; const c=$('#clock'); c.textContent=fmt(e); c.parentElement.style.background= e>SC[i].target*60 ? 'var(--orange)':''; const m=$('#mEl'); if(m) m.textContent=fmt(e); if(e%15===0) save(); },1000);

$('#sndBtn').firstChild.textContent=S.sound?'🔊':'🔇';
render();
</script>
</body>
