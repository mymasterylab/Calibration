<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraction Face-Off: The Great Pizza Trap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F7F8; --bg2:#D3F0F1; --card:#FFFFFF; --ink:#1C2340; --muted:#56607E; --line:#CFE3E6;
  --teal:#00A7B2; --sun:#FAA71C; --tomato:#E8452C; --basil:#2FA84F; --grape:#7B5CE6; --gum:#FF6FAE; --sky:#3B9BFF;
  --ok:#2FA84F; --bad:#E8452C; --paper:#FFFDF7; --board:#FFFFFF; --shadow:0 3px 0 rgba(28,35,64,.12);
  --head:'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#122029; --bg2:#0E1A22; --card:#1B2B36; --ink:#F1F6FA; --muted:#A9BAC8; --line:#2C4250; --paper:#20313D; --board:#FDFDFB; --shadow:0 3px 0 rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ --bg:#122029; --bg2:#0E1A22; --card:#1B2B36; --ink:#F1F6FA; --muted:#A9BAC8; --line:#2C4250; --paper:#20313D; --board:#FDFDFB; --shadow:0 3px 0 rgba(0,0,0,.35); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;flex-direction:column;height:100%}
/* Header */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--teal);display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:18px}
.brand h1{font-family:var(--head);font-size:22px;line-height:1.05;margin:0;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:13px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bg);font-weight:700;font-size:15px;white-space:nowrap}
.chip.stars{background:#FFF1CC;color:#7A4B00}
.chip.time.over{background:#FFE1D6;color:#A12A12}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* Story road */
.road{position:relative;padding:12px 18px 8px;overflow-x:auto;background:linear-gradient(var(--bg2),var(--bg))}
.road ol{list-style:none;display:flex;gap:0;margin:0;padding:0;min-width:900px;position:relative}
.road ol::before{content:"";position:absolute;left:30px;right:30px;top:27px;height:8px;border-radius:8px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 30px),#9FB4BC;opacity:.9}
.stop{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;background:none;border:0;padding:0;color:var(--ink)}
.stop .tok{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--card);border:4px solid #B9C8CE;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.stop .lbl{font-family:var(--head);font-weight:700;font-size:13.5px;line-height:1.1;text-align:center;max-width:96px}
.stop.locked .tok{filter:grayscale(1);opacity:.55}
.stop.locked .tok::after{content:"🔒";position:absolute;right:-6px;bottom:-6px;font-size:18px}
.stop.locked{cursor:not-allowed}
.stop.done .tok{border-color:var(--basil)}
.stop.done .tok::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--basil);color:#fff;font-size:15px;display:grid;place-items:center;font-weight:800}
.stop.cur .tok{border-color:var(--c,var(--teal));transform:scale(1.12);box-shadow:0 0 0 6px color-mix(in srgb,var(--c,var(--teal)) 30%,transparent)}

/* Main */
.main{flex:1;display:flex;min-height:0;position:relative}
.stageWrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.stage{flex:1;overflow-y:auto;padding:18px 22px 30px}
.inner{max-width:1180px;margin:0 auto}
.foot{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--card);border-top:2px solid var(--line);flex-wrap:wrap}
.foot .status{flex:1;font-weight:700;color:var(--muted);min-width:200px}
.foot .status.ready{color:var(--basil)}
.big{border:0;border-radius:16px;padding:12px 22px;font-family:var(--head);font-weight:800;font-size:19px;background:var(--teal);color:#fff;box-shadow:0 4px 0 #007A83}
.big:disabled{background:#B6C4C9;box-shadow:0 4px 0 #8E9DA3;cursor:not-allowed}
.big.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.big.go{background:var(--basil);box-shadow:0 4px 0 #1E7A37;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:translateY(-2px)}}

/* Chapter header */
.chap{border-radius:24px;padding:18px 22px;color:#fff;background:var(--c);display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.chap::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.chap .em{font-size:48px;line-height:1}
.chap h2{font-family:var(--head);font-size:32px;line-height:1;margin:0;font-weight:800}
.chap p{margin:4px 0 0;font-size:17px;opacity:.95;max-width:60ch}
.chap .num{font-family:var(--head);font-weight:700;opacity:.9;font-size:16px}

/* Story strip */
.story{display:flex;gap:16px;align-items:flex-end;margin:16px 0 18px;flex-wrap:wrap}
.cast{display:flex;gap:6px}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--head);font-weight:700;font-size:14px;opacity:.45;transition:opacity .2s,transform .2s}
.av.on{opacity:1;transform:translateY(-4px)}
.av svg{width:78px;height:78px}
.bubble{flex:1;min-width:260px;position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 18px 12px;font-size:20px;box-shadow:var(--shadow)}
.bubble b.who{font-family:var(--head);display:block;font-size:15px;color:var(--c,var(--teal))}
.bubble .nav{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;align-items:center;font-size:14px;color:var(--muted)}
.bubble .nav button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:3px 12px;font-weight:700}

/* Generic blocks */
.panel{background:var(--card);border-radius:22px;padding:18px 20px;border:2px solid var(--line);margin-bottom:16px}
.panel h3{font-family:var(--head);font-size:23px;margin:0 0 4px;line-height:1.15}
.panel .hint{color:var(--muted);margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--head);font-weight:800;line-height:.95;vertical-align:middle;margin:0 3px}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.fr.lg{font-size:34px}
.fr.xl{font-size:48px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700;font-size:17px;box-shadow:var(--shadow);transition:transform .1s}
.opt:hover{transform:translateY(-1px)}
.opt.sel{border-color:var(--grape);background:color-mix(in srgb,var(--grape) 14%,var(--card))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card));animation:shake .35s}
.sym{min-width:52px;font-family:var(--head);font-size:26px;padding:2px 12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
input.box{width:60px;height:52px;text-align:center;font-family:var(--head);font-size:26px;font-weight:800;border:3px dashed var(--grape);border-radius:12px;background:var(--paper)}
input.box.wide{width:140px;font-size:22px}
input.box.ok,textarea.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
input.box.bad{border-style:solid;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
textarea.note{width:100%;min-height:92px;border:3px dashed var(--grape);border-radius:14px;padding:10px 12px;background:var(--paper);font-size:18px;resize:vertical}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--card)}
.btn.teal{background:var(--teal);color:#fff}.btn.sun{background:var(--sun);color:#3A2400}.btn.grape{background:var(--grape);color:#fff}.btn.soft{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.fb{font-weight:700;margin-top:8px;min-height:1.4em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px}
.card.pick{text-align:center}
.item{font-size:52px;line-height:1}
.q{font-size:18px;font-weight:700;margin:6px 0}
.samsays{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px;color:var(--muted);justify-content:center}
.samsays svg{width:34px;height:34px}

/* Prediction rows */
.pred{display:grid;grid-template-columns:auto auto auto;gap:10px 18px;align-items:center;justify-content:center}
.prow{display:contents}
.pcell{display:flex;gap:6px;justify-content:center}
.meter{display:flex;gap:8px;flex-wrap:wrap}
.meter .opt{font-size:26px;padding:4px 10px;display:flex;flex-direction:column;align-items:center}
.meter .opt small{font-size:12px}

/* Strips */
.strip{margin-bottom:14px}
.strip svg{width:100%;height:auto;display:block}
.strip rect.pc{cursor:pointer;transition:fill .15s}
.strip .top{padding:0;background:none;border:0;display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}

/* Buckets */
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px}
.fcard{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 14px;box-shadow:var(--shadow);font-size:22px}
.fcard.sel{border-color:var(--grape);transform:translateY(-4px) rotate(-3deg)}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.bucket{border:3px dashed var(--c);border-radius:20px;min-height:130px;padding:10px;background:color-mix(in srgb,var(--c) 10%,var(--card));text-align:center}
.bucket h4{margin:0 0 8px;font-family:var(--head);font-size:19px;color:var(--c)}
.bucket .cards{min-height:50px}
.bucket.target{cursor:pointer;outline:3px solid var(--c)}

/* Butterfly */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs .opt small{font-weight:400}

/* Case files */
.case{background:#FFF6DC;border:2px solid #F2D58F;border-radius:6px 20px 20px 20px;padding:14px;position:relative;color:#3A2A00}
.case::before{content:"CASE FILE";position:absolute;top:-12px;left:14px;background:#F2B233;color:#3A2400;font-size:11px;font-weight:800;padding:2px 10px;border-radius:6px;letter-spacing:.06em}
.case .quote{font-size:19px;font-weight:700;margin:6px 0 10px}

/* Certificate */
.cert{border:6px double var(--sun);border-radius:26px;padding:26px;text-align:center;background:radial-gradient(circle at 50% 0,#FFF3CF,var(--card) 60%)}
.cert h3{font-family:var(--head);font-size:34px;margin:6px 0}
.chart{display:flex;gap:26px;align-items:flex-end;justify-content:center;height:180px;margin:10px 0}
.bar{width:84px;border-radius:14px 14px 4px 4px;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-family:var(--head);font-weight:800;font-size:24px;padding-top:6px;transition:height .6s}
.barwrap{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}

/* Teacher drawer */
.drawer{width:360px;max-width:92vw;background:var(--card);border-left:2px solid var(--line);overflow-y:auto;padding:16px 18px 30px;display:none}
.drawer.open{display:block}
.drawer h3{font-family:var(--head);margin:0 0 6px;font-size:22px}
.drawer h4{margin:14px 0 4px;font-family:var(--head);font-size:17px;color:var(--teal)}
.drawer ul{padding-left:18px;margin:4px 0}
.drawer li{margin-bottom:6px;font-size:15.5px}
.drawer .ctrls{display:grid;gap:8px;margin-top:10px}
.drawer .ctrls button{text-align:left}
.drawer .key{background:var(--bg);border-radius:12px;padding:10px;font-size:15px}
.drawer .note{font-size:13px;color:var(--muted)}

/* Annotate + whiteboard */
#annot{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}
.annotating #annot{pointer-events:auto;cursor:crosshair}
.annotating .stageWrap{outline:4px solid var(--gum);outline-offset:-4px}
.wb{position:absolute;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:12px}
.wb.open{display:flex}
.wb .wbhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.wb .wbhead h3{font-family:var(--head);margin:0;font-size:22px}
.wbArea{flex:1;position:relative;border-radius:18px;border:3px solid var(--line);overflow:hidden;background-color:var(--board)}
.wbArea.grid{background-image:linear-gradient(#DDEBF0 1px,transparent 1px),linear-gradient(90deg,#DDEBF0 1px,transparent 1px);background-size:32px 32px}
.wbArea.lined{background-image:linear-gradient(#DDEBF0 1px,transparent 1px);background-size:100% 36px}
.wbArea.dots{background-image:radial-gradient(#B9CDD4 1.6px,transparent 1.8px);background-size:28px 28px}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.textIn{position:absolute;z-index:30;border:2px dashed var(--grape);background:rgba(255,255,255,.9);font-family:var(--head);font-weight:700;padding:2px 6px;min-width:120px;color:#1C2340}
.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 10px;display:none;gap:6px;align-items:center;flex-wrap:wrap;max-width:96vw;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.tools.show{display:flex}
.tools .tl{width:40px;height:40px;border-radius:11px;border:2px solid transparent;background:var(--bg);font-size:18px;display:grid;place-items:center;padding:0;font-weight:800}
.tools .tl.on{border-color:var(--grape);background:color-mix(in srgb,var(--grape) 18%,var(--card))}
.tools .sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);padding:0}
.tools .sw.on{box-shadow:0 0 0 3px var(--ink)}
.tools .sep{width:2px;height:30px;background:var(--line);margin:0 3px}
.tools .nstep{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.tools .nstep input{width:44px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:4px;background:var(--paper)}
.tools input[type=range]{width:80px}

/* Overlays */
.toast{position:fixed;inset:0;display:none;place-items:center;z-index:60;background:rgba(20,30,45,.45)}
.toast.show{display:grid}
.toast .tcard{background:var(--card);border-radius:28px;padding:28px 34px;text-align:center;max-width:460px;border:4px solid var(--sun);animation:pop .4s}
.toast .tcard .em{font-size:64px}
.toast h3{font-family:var(--head);font-size:30px;margin:6px 0}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.starpop{position:fixed;z-index:80;font-size:34px;pointer-events:none;animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-80px) scale(1.4);opacity:0}}

@media (max-width:760px){
  .brand h1{font-size:18px}
  .chap h2{font-size:26px}
  .bubble{font-size:18px}
  .buckets{grid-template-columns:1fr}
  .drawer{position:absolute;right:0;top:0;bottom:0;z-index:30}
  .stage{padding:14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">M</div><div><h1>Fraction Face-Off: The Great Pizza Trap</h1><small>MyMasteryLab · Grade 3 / Year 2 · Live 1:1 mission</small></div></div>
    <div class="spacer"></div>
    <span class="chip stars" id="stars" title="Stars earned">⭐ 0</span>
    <span class="chip time" id="timer" title="Time in this chapter">⏱ 0:00</span>
    <button class="tbtn" id="bAnnot" aria-pressed="false" title="Draw on top of the activity (A)">🖍️ Annotate</button>
    <button class="tbtn" id="bBoard" aria-pressed="false" title="Open the mentor whiteboard (W)">🧑‍🏫 Whiteboard</button>
    <button class="tbtn" id="bTeach" aria-pressed="false" title="Mentor notes and controls (T)">📋 Mentor</button>
  </header>
  <nav class="road" aria-label="Story chapters"><ol id="road"></ol></nav>
  <div class="main">
    <div class="stageWrap" id="stageWrap">
      <div class="stage" id="stage"><div class="inner" id="inner"></div></div>
      <canvas id="annot"></canvas>
      <div class="foot">
        <div class="status" id="status"></div>
        <button class="big ghost" id="bPrev">◀ Back</button>
        <button class="big" id="bNext" disabled>Unlock next chapter</button>
      </div>
      <section class="wb" id="wb" aria-label="Mentor whiteboard">
        <div class="wbhead">
          <h3>🧑‍🏫 Mentor whiteboard</h3>
          <span class="tag" id="wbChap"></span>
          <div class="spacer"></div>
          <label class="row" style="gap:6px;font-weight:700">Paper
            <select id="wbBg" class="tbtn" style="padding:5px 8px"><option value="grid">Grid</option><option value="blank">Blank</option><option value="lined">Lined</option><option value="dots">Dots</option></select>
          </label>
          <button class="tbtn" id="wbClose">✕ Back to story</button>
        </div>
        <div class="wbArea grid" id="wbArea"><canvas id="board"></canvas></div>
      </section>
    </div>
    <aside class="drawer" id="drawer" aria-label="Mentor notes"></aside>
  </div>
</div>

<div class="tools" id="tools" role="toolbar" aria-label="Drawing tools"></div>
<div class="toast" id="toast"><div class="tcard"><div class="em" id="tEm">🔓</div><h3 id="tTitle"></h3><p id="tText"></p><button class="big" id="tBtn">Let's go!</button></div></div>

<script>
/* ============ Utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=(n,d,cls='')=>`<span class="fr ${cls}"><span>${n}</span><span>${d}</span></span>`;
const cmp=(a,b,c,d)=>{const l=a*d,r=c*b;return l>r?'>':l<r?'<':'='};
const SYMS=['>','<','='];
const norm=v=>String(v??'').trim().toLowerCase();

/* ============ Characters (SVG) ============ */
const PEOPLE={
  bella:{name:'Chef Bella',skin:'#F3C9A8',hair:'#6B3E26',shirt:'#E8452C'},
  leo:{name:'Leo',skin:'#E3AE87',hair:'#3A2A1E',shirt:'#3B9BFF'},
  mia:{name:'Mia',skin:'#E3AE87',hair:'#3A2A1E',shirt:'#FF6FAE'},
  sam:{name:'Sam',skin:'#F7D4B6',hair:'#E0782E',shirt:'#2FA84F'},
  you:{name:'Detective',skin:'#EBC1A0',hair:'#5B3A24',shirt:'#7B5CE6'}
};
function avatar(who){
  const p=PEOPLE[who];
  let hair='',extra='';
  if(who==='bella'){hair=`<path d="M26 52 Q26 30 50 29 Q74 30 74 52 L70 46 Q50 38 30 46Z" fill="${p.hair}"/>`;

/* ============ Visual models ============ */
function pizzaSVG(n,shade,r=90,opts={}){
  const size=r*2+20,c=size/2; const sh=typeof shade==='number'?new Set([...Array(shade).keys()]):shade;
  let s=`<svg viewBox="0 0 ${size} ${size}" width="${opts.w||size}" style="max-width:100%;height:auto" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r+6}" fill="#D98E3A"/>`;
  if(n<=1){s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="${sh.has(0)?(opts.hl||'#FF7A45'):'#FFD66B'}"/>`;}
  else for(let i=0;i<n;i++){
    const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n,large=(a2-a1)>Math.PI?1:0;
    const x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1),x2=c+r*Math.cos(a2),y2=c+r*Math.sin(a2);
    s+=`<path d="M${c} ${c} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}Z" fill="${sh.has(i)?(opts.hl||'#FF7A45'):'#FFD66B'}" stroke="#C4762A" stroke-width="2.5"/>`;
    const am=(a1+a2)/2; s+=`<circle cx="${c+r*.62*Math.cos(am)}" cy="${c+r*.62*Math.sin(am)}" r="${Math.max(3,r*.09)}" fill="#C92426" opacity=".85"/>`;
  }
  return s+'</svg>';
}
function barSVG(n,shade,{w=600,h=60,col='#7B5CE6',base='#F3EEE6',label=''}={}){
  const sh=typeof shade==='number'?new Set([...Array(shade).keys()]):shade;
  let s=`<svg viewBox="0 0 ${w+4} ${h+4}" style="width:${w}px;max-width:100%;height:auto;display:block" aria-hidden="true">`;
  for(let i=0;i<n;i++){const pw=w/n; s+=`<rect x="${2+i*pw}" y="2" width="${pw}" height="${h}" fill="${sh.has(i)?col:base}" stroke="#1C2340" stroke-width="2.5"/>`;}
  if(label) s+=`<text x="${w/2+2}" y="${h/2+9}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="24" fill="#1C2340">${label}</text>`;
  return s+'</svg>';
}

    <p class="q" style="text-align:center">Confidence: ${face(bc)} → ${face(s.conf)}</p>`:'<p class="hint">Check the rematch to reveal your before-and-after score.</p><div style="font-size:80px;text-align:center">📊</div>'}</div></div>
   <div class="panel"><h3>🎓 Teach-Back: help Sam</h3><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="width:70px;flex:none">${avatar('sam')}</div><div class="bubble" style="font-size:18px">Why isn't ${F(1,8)} bigger than ${F(1,4)}? 8 is a bigger number!</div></div>
    <textarea class="note" data-in="teach" style="margin-top:10px" placeholder="Explain it to Sam in your own words...">${esc(s.teach||'')}</textarea>
    <label class="row" style="margin-top:10px;font-weight:700;background:var(--bg);padding:10px 12px;border-radius:12px"><input type="checkbox" data-act="tok" ${s.tok?'checked':''} style="width:22px;height:22px"> Mentor: the learner explained it in their own words</label></div>
   ${this.done(s)?`<div class="cert"><div style="font-size:60px">🕵️🍕</div><div class="tag">MyMasteryLab</div><h3>Master Fraction Detective</h3><p style="font-size:20px">Awarded to <b>${esc(S.name||'our Detective')}</b> for cracking The Great Pizza Trap</p><p style="font-size:26px">⭐ ${S.stars} stars earned</p><p class="hint">${new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</p></div>`:''}`;},
 act(s,d){if(d.act==='tok')s.tok=!s.tok;},
 good(s){const k=PKEY.map((kk,i)=>(s.checked&&(s.a||[])[i]===kk)?'r'+i:null).filter(Boolean);s.tok&&k.push('teach');return k;},
 done(s){return !!s.checked&&PKEY.every((k,i)=>(s.a||[])[i]===k)&&!!s.conf&&!!s.tok;},
 need(s){return !s.checked?'Answer the rematch and press Check':!PKEY.every((k,i)=>(s.a||[])[i]===k)?'Fix the red answers and check again':!s.conf?'Choose a confidence face':'Mentor: tick the Teach-Back box';}
}];

/* ============ Rendering ============ */
let lineIdx=0, chapStart=Date.now();
function renderRoad(){
  $('#road').innerHTML=CH.map((c,i)=>{const cls=i>S.max?'locked':i===S.cur?'cur':(CH[i].done(st(i))?'done':'');
    return `<li style="flex:1;display:flex"><button class="stop ${cls}" style="--c:${c.c}" data-go="${i}" ${i>S.max?'aria-disabled="true"':''} aria-current="${i===S.cur?'step':'false'}"><span class="tok">${c.icon}</span><span class="lbl">${i+1}. ${c.title}</span></button></li>`;}).join('');
}
function renderStory(){
  const c=CH[S.cur],[who,text]=c.story[lineIdx];
  $('#storyBox').innerHTML=`<div class="cast">${c.cast.map(w=>`<div class="av ${w===who?'on':''}">${avatar(w)}<span>${PEOPLE[w].name}</span></div>`).join('')}</div>
   <div class="bubble" style="--c:${c.c}"><b class="who">${PEOPLE[who].name}</b>${esc(text)}
   <div class="nav"><span>${lineIdx+1} / ${c.story.length}</span><button data-line="-1" ${lineIdx===0?'disabled':''} aria-label="Previous line">◀</button><button data-line="1" ${lineIdx===c.story.length-1?'disabled':''} aria-label="Next line">Next ▶</button></div></div>`;
}
function render(keepScroll){
  const c=CH[S.cur],s=st(S.cur),stage=$('#stage'),top=stage.scrollTop;
  document.documentElement.style.setProperty('--c',c.c);
  $('#inner').innerHTML=`<div class="chap" style="--c:${c.c}"><div class="em">${c.icon}</div><div style="flex:1;position:relative;z-index:1"><div class="num">Chapter ${S.cur+1} of ${CH.length} · about ${c.min} min</div><h2>${c.title}</h2><p>${c.mission}</p></div></div>
   <div class="story" id="storyBox"></div><div id="act">${c.view(s)}</div>`;
  renderStory(); renderRoad(); renderFoot(); renderDrawer();
  $('#wbChap').textContent=`Chapter ${S.cur+1}: ${c.title}`;
  if(keepScroll) stage.scrollTop=top;
}
function renderFoot(){
  const c=CH[S.cur],s=st(S.cur),ok=c.done(s),last=S.cur===CH.length-1;
  const el=$('#status');el.className='status'+(ok?' ready':'');
  el.textContent=ok?(last?'🏆 Mission complete! Ready for the parent debrief.':'✅ Chapter complete! The next chapter is ready to unlock.'):'🔒 '+c.need(s);
  const b=$('#bNext');b.disabled=!ok&&S.max<=S.cur;
  b.textContent=last?'🏆 Finish mission':(S.max>S.cur?`Go to Chapter ${S.cur+2} ▶`:`🔓 Unlock Chapter ${S.cur+2}`);
  b.className='big'+(ok&&S.max<=S.cur?' go':'')+(last&&ok?' go':'');
  $('#bPrev').disabled=S.cur===0;
  $('#stars').textContent='⭐ '+S.stars;
}
let confirmReset=null;
function renderDrawer(){
  const c=CH[S.cur],n=c.notes;
  $('#drawer').innerHTML=`<h3>📋 Mentor notes</h3><div class="tag" style="background:${c.c};color:#fff">Chapter ${S.cur+1}: ${c.title} · ${c.min} min</div>
   <h4>Goal</h4><p style="margin:0">${n.goal}</p>
   <h4>Say it like this</h4><ul>${n.say.map(x=>`<li><i>"${esc(x)}"</i></li>`).join('')}</ul>
   <h4>Look for</h4><p style="margin:0">${n.look}</p>
   <h4>Answer key</h4><div class="key">${esc(n.key)}</div>
   <h4>Mentor controls</h4><div class="ctrls">
    <button class="btn teal" data-t="unlock">🔓 Unlock the next chapter now</button>
    <button class="btn soft" data-t="all">🔓 Unlock all chapters</button>
    <button class="btn soft" data-t="resetch">↺ Reset this chapter</button>
    <button class="btn soft" data-t="clearann">🧽 Clear annotations on this chapter</button>
    <button class="btn soft" data-t="theme">🌗 Switch light / dark</button>
    <button class="btn soft" data-t="resetall" style="color:var(--bad)">${confirmReset?'⚠️ Tap again to erase everything':'🗑 Reset the whole mission'}</button></div>
   <p class="note">Tip: close this panel before sharing your screen if you don't want the answer key visible. Shortcuts: W whiteboard, A annotate, T notes, Esc close.</p>`;
}
function award(){
  const c=CH[S.cur],s=st(S.cur);if(!c.good)return;
  c.good(s).forEach(k=>{const key=S.cur+':'+k;if(!S.awarded[key]){S.awarded[key]=1;S.stars++;starPop();}});
}
function starPop(){const b=$('#stars').getBoundingClientRect();const e=document.createElement('div');e.className='starpop';e.textContent='⭐';e.style.left=(b.left+10+Math.random()*30)+'px';e.style.top=(b.top+10)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1000);}
function confetti(){const cols=['#E8452C','#FAA71C','#2FA84F','#3B9BFF','#7B5CE6','#FF6FAE','#00A7B2'];
  for(let i=0;i<80;i++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=cols[i%7];e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=(Math.random()*.4)+'s';e.style.borderRadius=i%3?'2px':'50%';document.body.appendChild(e);setTimeout(()=>e.remove(),3800);}}
function toast(em,title,text,btn,cb){$('#tEm').textContent=em;$('#tTitle').textContent=title;$('#tText').textContent=text;$('#tBtn').textContent=btn;$('#toast').classList.add('show');$('#tBtn').onclick=()=>{$('#toast').classList.remove('show');cb&&cb();};$('#tBtn').focus();}

function go(i){ if(i<0||i>=CH.length||i>S.max) return; annStore(); S.cur=i; lineIdx=0; chapStart=Date.now(); save(); render(); annLoad(); $('#stage').scrollTop=0; }

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){const i=+g.dataset.go; if(i<=S.max) go(i); return;}
  const ln=e.target.closest('[data-line]'); if(ln){lineIdx=Math.max(0,Math.min(CH[S.cur].story.length-1,lineIdx+ +ln.dataset.line));renderStory();return;}
  const t=e.target.closest('[data-t]'); if(t){teacher(t.dataset.t);return;}
  const a=e.target.closest('#act [data-act]'); if(!a) return;
  const c=CH[S.cur],s=st(S.cur),d=a.dataset;
  if(d.act==='set'){setK(s,d.k,d.v);}
  else if(d.act==='check'){ if(c.act) c.act(s,d); s.checked=true; }
  else if(c.act) c.act(s,d);
  if(d.act!=='tok'||true){ award(); save(); render(true); }
});
document.addEventListener('keydown',e=>{
  const b=e.target.closest&&e.target.closest('.bucket[data-act]'); if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click();return;}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='w') toggleBoard(); else if(k==='a') toggleAnnot(); else if(k==='t') toggleDrawer();
  else if(k==='escape'){ if(boardOpen) toggleBoard(false); else if(annotOn) toggleAnnot(false); }
});
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.in) return;
  const k=el.dataset.in; if(k==='#name'){S.name=el.value;save();return;}
  const c=CH[S.cur],s=st(S.cur); setK(s,k,el.value);
  if(c.onInput) c.onInput(s,el);
  if(el.classList.contains('box')&&k!=='dbl'&&s.checked) el.classList.remove('ok','bad');
  if(k==='note'){el.classList.toggle('ok',el.value.trim().length>=15);}
  award(); save(); renderFoot(); renderRoad();
});
$('#bPrev').onclick=()=>go(S.cur-1);
$('#bNext').onclick=()=>{
  const last=S.cur===CH.length-1;
  if(last){ if(CH[S.cur].done(st(S.cur))){confetti();toast('🏆','Mission complete!',`${S.name||'Our detective'} cracked The Great Pizza Trap with ${S.stars} stars. Time to invite the parent in for the debrief.`,'Celebrate!');} return; }
  if(S.max>S.cur){go(S.cur+1);return;}
  S.max=S.cur+1; save(); confetti();
  const n=CH[S.cur+1];
  toast(n.icon,`Chapter ${S.cur+2} unlocked!`,`Next stop: ${n.title}. ${n.mission}`,"Let's go!",()=>go(S.cur+1));
};
function teacher(t){
  if(t==='unlock'){ if(S.cur<CH.length-1){S.max=Math.max(S.max,S.cur+1);save();go(S.cur+1);} return; }
  if(t==='all'){S.max=CH.length-1;save();render(true);return;}
  if(t==='resetch'){S.p[S.cur]={};Object.keys(S.awarded).forEach(k=>{if(k.startsWith(S.cur+':'))delete S.awarded[k]});save();render();return;}
  if(t==='clearann'){ann.snap();ann.strokes=[];ann.redraw();annStore();return;}
  if(t==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';return;}
  if(t==='resetall'){ if(!confirmReset){confirmReset=setTimeout(()=>{confirmReset=null;renderDrawer();},4000);renderDrawer();return;}
    clearTimeout(confirmReset);confirmReset=null;S=fresh();ANN={};save();ann.strokes=[];ann.redraw();board.strokes=[];board.redraw();go(0);render();}
}
setInterval(()=>{const c=CH[S.cur],sec=Math.floor((Date.now()-chapStart)/1000),el=$('#timer');el.textContent=`⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / ${c.min}:00`;el.classList.toggle('over',sec>c.min*60);},1000);

/* ============ Drawing boards ============ */
const T={tool:'pen',color:'#1C2340',size:4,n:4};
class Board{
  constructor(cv){this.c=cv;this.x=cv.getContext('2d');this.strokes=[];this.U=[];this.R=[];this.cur=null;
    new ResizeObserver(()=>this.resize()).observe(cv.parentElement);
    cv.addEventListener('pointerdown',e=>this.down(e));cv.addEventListener('pointermove',e=>this.move(e));
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>this.up()));}
  resize(){const r=this.c.getBoundingClientRect();if(!r.width)return;this.d=window.devicePixelRatio||1;this.c.width=r.width*this.d;this.c.height=r.height*this.d;this.redraw();}
  pos(e){const r=this.c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
  down(e){e.preventDefault();const p=this.pos(e);
    if(T.tool==='text'){this.textAt(p);return;}
    this.c.setPointerCapture(e.pointerId);
    this.cur={t:T.tool,col:T.color,w:T.size,n:T.n,pts:[p],a:p,b:p};}
  move(e){if(!this.cur)return;const p=this.pos(e);if(['pen','hl','er'].includes(this.cur.t))this.cur.pts.push(p);else this.cur.b=p;this.redraw();this.draw(this.cur);}
  up(){if(!this.cur)return;const s=this.cur;this.cur=null;if(s.pts.length>1||Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1])>4||['pen','hl'].includes(s.t)){this.snap();this.strokes.push(s);}this.redraw();this.changed&&this.changed();}
  snap(){this.U.push(this.strokes.slice());if(this.U.length>80)this.U.shift();this.R=[];}
  undo(){if(!this.U.length)return;this.R.push(this.strokes);this.strokes=this.U.pop();this.redraw();this.changed&&this.changed();}
  redo(){if(!this.R.length)return;this.U.push(this.strokes);this.strokes=this.R.pop();this.redraw();this.changed&&this.changed();}
  clear(){this.snap();this.strokes=[];this.redraw();this.changed&&this.changed();}
  textAt(p){const par=this.c.parentElement,i=document.createElement('input');i.className='textIn';i.style.left=p[0]+'px';i.style.top=(p[1]-16)+'px';i.style.fontSize=(T.size*4+14)+'px';i.style.color=T.color;par.appendChild(i);setTimeout(()=>i.focus(),0);
    let done=false;const fin=()=>{if(done)return;done=true;if(i.value.trim()){this.snap();this.strokes.push({t:'text',a:p,txt:i.value,col:T.color,w:T.size});this.redraw();this.changed&&this.changed();}i.remove();};
    i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')fin();if(e.key==='Escape'){done=true;i.remove();}});i.addEventListener('blur',fin);}
  redraw(){const x=this.x;x.setTransform(this.d||1,0,0,this.d||1,0,0);x.clearRect(0,0,this.c.width,this.c.height);this.strokes.forEach(s=>this.draw(s));}
  draw(s){const x=this.x;x.save();x.lineCap='round';x.lineJoin='round';x.strokeStyle=s.col;x.fillStyle=s.col;x.lineWidth=s.w;x.globalCompositeOperation='source-over';x.globalAlpha=1;
    const[a0,a1]=s.a,[b0,b1]=s.b||s.a;
    if(s.t==='pen'||s.t==='hl'||s.t==='er'){if(s.t==='hl'){x.globalAlpha=.35;x.lineWidth=s.w*5;}if(s.t==='er'){x.globalCompositeOperation='destination-out';x.lineWidth=s.w*6;}
      x.beginPath();s.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));if(s.pts.length===1)x.lineTo(s.pts[0][0]+.1,s.pts[0][1]);x.stroke();}
    else if(s.t==='line'||s.t==='arrow'){x.beginPath();x.moveTo(a0,a1);x.lineTo(b0,b1);x.stroke();if(s.t==='arrow'){const an=Math.atan2(b1-a1,b0-a0),h=10+s.w*2.5;x.beginPath();x.moveTo(b0,b1);x.lineTo(b0-h*Math.cos(an-.45),b1-h*Math.sin(an-.45));x.lineTo(b0-h*Math.cos(an+.45),b1-h*Math.sin(an+.45));x.closePath();x.fill();}}
    else if(s.t==='rect'){x.strokeRect(Math.min(a0,b0),Math.min(a1,b1),Math.abs(b0-a0),Math.abs(b1-a1));}
    else if(s.t==='oval'){x.beginPath();x.ellipse((a0+b0)/2,(a1+b1)/2,Math.abs(b0-a0)/2,Math.abs(b1-a1)/2,0,0,Math.PI*2);x.stroke();}
    else if(s.t==='pizza'){const r=Math.hypot(b0-a0,b1-a1);x.beginPath();x.arc(a0,a1,r,0,Math.PI*2);x.globalAlpha=.18;x.fill();x.globalAlpha=1;x.stroke();
      if(s.n>1)for(let i=0;i<s.n;i++){const an=-Math.PI/2+i*2*Math.PI/s.n;x.beginPath();x.moveTo(a0,a1);x.lineTo(a0+r*Math.cos(an),a1+r*Math.sin(an));x.stroke();}}
    else if(s.t==='bar'){const l=Math.min(a0,b0),t=Math.min(a1,b1),w=Math.abs(b0-a0),h=Math.abs(b1-a1);x.globalAlpha=.12;x.fillRect(l,t,w,h);x.globalAlpha=1;x.strokeRect(l,t,w,h);for(let i=1;i<s.n;i++){x.beginPath();x.moveTo(l+w*i/s.n,t);x.lineTo(l+w*i/s.n,t+h);x.stroke();}}
    else if(s.t==='nline'){x.beginPath();x.moveTo(a0,a1);x.lineTo(b0,a1);x.stroke();const fs=14+s.w;x.font=`800 ${fs}px "Baloo 2",sans-serif`;x.textAlign='center';
      for(let i=0;i<=s.n;i++){const px=a0+(b0-a0)*i/s.n;x.beginPath();x.moveTo(px,a1-10-s.w);x.lineTo(px,a1+10+s.w);x.stroke();const lab=i===0?'0':i===s.n?'1':`${i}/${s.n}`;x.fillText(lab,px,a1+26+s.w*2);}}
    else if(s.t==='text'){x.font=`700 ${s.w*4+14}px "Baloo 2",sans-serif`;x.textBaseline='middle';x.fillText(s.txt,a0+6,a1);}
    x.restore();}
}
const board=new Board($('#board')), ann=new Board($('#annot'));
let ANN={}; const annStore=()=>{ANN[S.cur]=ann.strokes;}; const annLoad=()=>{ann.strokes=ANN[S.cur]||[];ann.U=[];ann.R=[];ann.redraw();};
ann.changed=annStore;

const TOOLS=[['pen','✏️','Pen'],['hl','🖍️','Highlighter'],['er','🧽','Eraser'],['line','╱','Line'],['arrow','➜','Arrow'],['rect','▭','Rectangle'],['oval','◯','Circle'],['text','T','Text'],['pizza','🍕','Pizza cut into N slices (drag from centre)'],['bar','▦','Bar split into N parts (drag)'],['nline','📏','Number line 0 to 1 in N steps (drag)']];
const COLS=['#1C2340','#E8452C','#FAA71C','#2FA84F','#00A7B2','#3B9BFF','#7B5CE6','#FF6FAE','#8B5A2B'];
function renderTools(){
  $('#tools').innerHTML=TOOLS.map(([k,i,l])=>`<button class="tl ${T.tool===k?'on':''}" data-tool="${k}" title="${l}" aria-label="${l}">${i}</button>`).join('')+
   `<span class="nstep" title="Number of equal parts for pizza, bar and number line">N <input type="number" id="tN" min="1" max="24" value="${T.n}"></span><span class="sep"></span>`+
   COLS.map(c=>`<button class="sw ${T.color===c?'on':''}" data-col="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')+
   `<span class="sep"></span><input type="range" id="tS" min="2" max="14" value="${T.size}" aria-label="Pen size"><button class="tl" data-cmd="undo" title="Undo">↶</button><button class="tl" data-cmd="redo" title="Redo">↷</button><button class="tl" data-cmd="clear" title="Clear all">🗑</button><button class="tl" data-cmd="close" title="Close">✕</button>`;
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const tgt=boardOpen?board:ann;
  if(b.dataset.tool){T.tool=b.dataset.tool;renderTools();}
  if(b.dataset.col){T.color=b.dataset.col;renderTools();}
  if(b.dataset.cmd==='undo')tgt.undo();if(b.dataset.cmd==='redo')tgt.redo();if(b.dataset.cmd==='clear')tgt.clear();
  if(b.dataset.cmd==='close'){if(boardOpen)toggleBoard(false);else toggleAnnot(false);}});
$('#tools').addEventListener('input',e=>{if(e.target.id==='tS')T.size=+e.target.value;if(e.target.id==='tN')T.n=Math.max(1,Math.min(24,+e.target.value||1));});
let boardOpen=false,annotOn=false;
function syncTools(){$('#tools').classList.toggle('show',boardOpen||annotOn);$('#bBoard').setAttribute('aria-pressed',boardOpen);$('#bAnnot').setAttribute('aria-pressed',annotOn);$('#app').classList.toggle('annotating',annotOn&&!boardOpen);}
function toggleBoard(v){boardOpen=v===undefined?!boardOpen:v;$('#wb').classList.toggle('open',boardOpen);if(boardOpen)setTimeout(()=>board.resize(),0);syncTools();}
function toggleAnnot(v){annotOn=v===undefined?!annotOn:v;if(annotOn&&boardOpen)toggleBoard(false);syncTools();ann.resize();}
function toggleDrawer(){const d=$('#drawer'),o=!d.classList.contains('open');d.classList.toggle('open',o);$('#bTeach').setAttribute('aria-pressed',o);setTimeout(()=>{ann.resize();board.resize();},0);}
$('#bBoard').onclick=()=>toggleBoard();$('#bAnnot').onclick=()=>toggleAnnot();$('#bTeach').onclick=toggleDrawer;$('#wbClose').onclick=()=>toggleBoard(false);
$('#wbBg').onchange=e=>{$('#wbArea').className='wbArea '+(e.target.value==='blank'?'':e.target.value);};

/* ============ Boot ============ */
S.cur=Math.min(S.cur,S.max);
renderTools(); render(); annLoad();
</script>
</body>
